syntax = "proto3";

package engram.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/thebtf/engram/proto/engram/v1;engramv1";

// EngramService provides MCP tool access via gRPC.
// The daemon connects to this service and translates MCP JSON-RPC to gRPC calls.
service EngramService {
  // CallTool dispatches a single MCP tool call.
  // Generic: tool_name + JSON args, matching the MCP tools/call pattern.
  rpc CallTool(CallToolRequest) returns (CallToolResponse);

  // Initialize returns server info and the list of available tools.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  // Ping is a lightweight health check.
  rpc Ping(PingRequest) returns (PingResponse);

  // ---- Phase B additions ---------------------------------------------

  // SyncProjectState reconciles the daemon's local project registry
  // against the server's authoritative list. Called by the daemon every
  // 60 s as a heartbeat. The response drives ProjectRemovalAware fan-out
  // for any project the daemon tracks locally but the server no longer
  // knows about. Idempotent — multiple daemons can call concurrently.
  rpc SyncProjectState(SyncProjectStateRequest) returns (SyncProjectStateResponse);

  // ProjectEvents pushes project-lifecycle events in real time. Server-
  // streaming RPC; the stream stays open for the daemon's lifetime.
  // Delivery is at-least-once; the daemon is responsible for dedup.
  rpc ProjectEvents(ProjectEventsRequest) returns (stream ProjectEvent);

  // GetSessionStartContext returns static session-start context entities for a project.
  // No ranking or LLM filtering is applied; the server returns SQL-backed entities only.
  rpc GetSessionStartContext(GetSessionStartContextRequest) returns (GetSessionStartContextResponse);

  // GetAmbientCandidates returns bounded same-turn ambient context through the
  // existing service. It is private to the credential-neutral legacy bridge.
  rpc GetAmbientCandidates(GetAmbientCandidatesRequest) returns (GetAmbientCandidatesResponse);

  // NegotiateVersion validates MAJOR-version compatibility between client and server.
  rpc NegotiateVersion(NegotiateVersionRequest) returns (NegotiateVersionResponse);

  // ---- CI-A Phase B: code index transport (CR-003) -----------------------

  // CodeIndexNegotiate performs a delta negotiation: the client sends its full
  // manifest of chunk metadata; the server returns which chunks it needs
  // (client must upload) and which existing server-side chunks are now stale
  // (client has dropped them). Stale rows are swept automatically at the end
  // of the subsequent CodeIndexUpload stream.
  rpc CodeIndexNegotiate(CodeIndexNegotiateRequest) returns (CodeIndexNegotiateResponse);

  // CodeIndexUpload is a client-streaming RPC. The client streams the chunk
  // payloads identified as needed by CodeIndexNegotiate, then closes the
  // stream. On close the server deletes stale chunks (those whose
  // index_session_id does not match the negotiated session) and returns a
  // receipt with counts of embedded and deleted rows.
  rpc CodeIndexUpload(stream CodeChunkUpload) returns (CodeIndexUploadReceipt);

  // RegisterProjectIdentityV3 explicitly establishes a V3 anchor binding.
  // Authentication and registration authority are derived solely by the server.
  rpc RegisterProjectIdentityV3(RegisterProjectIdentityV3Request) returns (RegisterProjectIdentityV3Response);
  // Bind establishes a private host-advisor capability binding.
  rpc Bind(HostAdvisorBindRequest) returns (HostAdvisorBindResponse);

  // Advise is reserved for the host-advisor delivery semantics owned by HAP-03.
  rpc Advise(HostAdvisorAdviseRequest) returns (HostAdvisorAdviseResponse);

  // Observe is reserved for host-advisor observation semantics owned by HAP-03.
  rpc Observe(HostAdvisorObserveRequest) returns (HostAdvisorObserveResponse);
}

// ---- SyncProjectState messages ----------------------------------------

message SyncProjectStateRequest {
  // local_project_ids is the set of ProjectContext.ID values the daemon
  // currently tracks (one entry per connected CC session). Order is not
  // significant. Max 10 000 entries (server enforces the cap via
  // INVALID_ARGUMENT).
  repeated string local_project_ids = 1;

  // client_id uniquely identifies this daemon instance for audit logging.
  // Typically `${daemon_pid}-${daemon_start_unix}`.
  string client_id = 2;
}

message SyncProjectStateResponse {
  // removed lists project IDs that the daemon has locally but the server
  // has no record of (removed_at IS NOT NULL or not in table). The daemon
  // fans these out to every registered ProjectRemovalAware module.
  repeated string removed = 1;

  // unknown lists project IDs that the server HAS a record of but that
  // look orphaned (last heartbeat > 24h ago AND removed_at IS NULL). The
  // daemon MAY log these for operator attention but does NOT fan them out
  // — only `removed` is authoritative.
  repeated string unknown = 2;

  // server_time_unix_ms is the server's wall clock at the time the
  // response was built. The daemon uses it for clock-skew detection.
  int64 server_time_unix_ms = 3;
}

// ---- ProjectEvents messages -------------------------------------------

message ProjectEventsRequest {
  // client_id uniquely identifies this daemon instance for audit logging.
  // Same format as SyncProjectStateRequest.client_id.
  string client_id = 1;

  // since_event_id allows the daemon to resume from a specific event after
  // reconnection. Empty string means "start from now; no replay".
  //
  // In v0.1.0 the server is NOT required to persist events for replay —
  // this field is reserved for forward compatibility. A v0.1.0 server
  // that receives a non-empty since_event_id MUST return OUT_OF_RANGE.
  string since_event_id = 2;
}

message ProjectEvent {
  // event_id is a monotonically increasing server-side identifier for this
  // event. Opaque to the daemon; used only for since_event_id replay.
  string event_id = 1;

  // event_type is the canonical event category. v0.1.0 only emits
  // PROJECT_EVENT_TYPE_REMOVED; the field is forward-compatible via the
  // ProjectEventType enum below.
  ProjectEventType event_type = 2;

  // project_id is the canonical muxcore ProjectContext.ID value.
  string project_id = 3;

  // timestamp_unix_ms is the server-side wall clock when the event was
  // generated.
  int64 timestamp_unix_ms = 4;

  // reason is a free-form server-provided explanation (e.g. "dashboard
  // operator removed", "retention policy expired").
  string reason = 5;

  // metadata is a key-value map for forward-compatible extension. v0.1.0
  // does NOT define any required keys.
  map<string, string> metadata = 6;
}

enum ProjectEventType {
  PROJECT_EVENT_TYPE_UNSPECIFIED = 0;
  PROJECT_EVENT_TYPE_REMOVED = 1;
  PROJECT_EVENT_TYPE_CREATED = 2; // reserved for v0.2.0
  PROJECT_EVENT_TYPE_RENAMED = 3; // reserved for v0.2.0
}

// ---- Session-start context messages --------------------------------------

message GetSessionStartContextRequest {
  // project is the target project slug used to fetch static context entities.
  string project = 1;

  // memories_limit is the maximum number of memories to return, ordered by newest first.
  // Zero means the server default.
  int32 memories_limit = 2;

  // issues_limit is the maximum number of active issues to return, ordered by priority then newest first.
  // Zero means the server default.
  int32 issues_limit = 3;

  // project_identity_v3 selects V3 central resolution. When present, project
  // is legacy compatibility input and MUST NOT be used for scoped access.
  ProjectIdentityV3 project_identity_v3 = 4;

  // host_session_ref is the opaque host-session reference bound by the relay.
  // Its presence selects the private bridge compatibility branch.
  string host_session_ref = 5;

  // relay_revision is the installed private relay revision. The server admits
  // it only when the dedicated relay gate accepts this exact revision.
  string relay_revision = 6;
}

message GetSessionStartContextResponse {
  repeated SessionStartIssue issues = 1;
  repeated SessionStartRule rules = 2;
  repeated SessionStartMemory memories = 3;
  google.protobuf.Timestamp generated_at = 4;
  SessionStartRuleRouter rule_router = 5;
  SessionStartMetaSummary meta_summary = 6;

  // project_resolution_v3 is populated only for V3 requests. Its project_key
  // and resolved_scope are absent on a refusal.
  ProjectResolutionResultV3 project_resolution_v3 = 7;
}

message SessionStartIssue {
  int64 id = 1;
  string title = 2;
  string body = 3;
  string status = 4;
  string priority = 5;
  string type = 6;
  string source_project = 7;
  string target_project = 8;
  string source_agent = 9;
  repeated string labels = 10;
  int64 comment_count = 11;
  google.protobuf.Timestamp acknowledged_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
  google.protobuf.Timestamp reopened_at = 14;
  google.protobuf.Timestamp closed_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message SessionStartRule {
  int64 id = 1;
  string project = 2;
  string content = 3;
  string edited_by = 4;
  int32 priority = 5;
  int32 version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SessionStartRuleRouter {
  bool enabled = 1;
  string mode = 2;
  int32 kernel_count = 3;
  int32 contextual_count = 4;
  int32 suppressed_count = 5;
  string budget_outcome = 6;
  repeated SessionStartRulePacket kernel = 7;
  repeated SessionStartRulePacket contextual = 8;
  repeated SessionStartRulePacket suppressed = 9;
  string fallback_reason = 10;
}

message SessionStartRulePacket {
  int64 rule_version_id = 1;
  int64 legacy_behavioral_rule_id = 2;
  string bucket = 3;
  string scope = 4;
  string audience = 5;
  string content = 6;
  string summary = 7;
  repeated string evidence_handles = 8;
  string state = 9;
  string budget_class = 10;
  int32 priority = 11;
  string suppression_reason = 12;
}

message SessionStartMemory {
  int64 id = 1;
  string project = 2;
  string content = 3;
  repeated string tags = 4;
  string source_agent = 5;
  string edited_by = 6;
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SessionStartMetaTagCount {
  string tag = 1;
  int64 count = 2;
}

message SessionStartMetaSummary {
  string project = 1;
  int64 total_count = 2;
  repeated SessionStartMetaTagCount top_tags = 3;
  google.protobuf.Timestamp oldest_created_at = 4;
  google.protobuf.Timestamp newest_created_at = 5;
  google.protobuf.Timestamp generated_at = 6;
}

// ---- Version negotiation messages ----------------------------------------

message NegotiateVersionRequest {
  string client_version = 1;
}

message NegotiateVersionResponse {
  bool compatible = 1;
  string server_version = 2;
  string incompat_reason = 3;
}

// CallToolRequest carries an MCP tool invocation.
message CallToolRequest {
  // MCP tool name (e.g., "store_memory", "recall", "search").
  string tool_name = 1;
  // Tool arguments as JSON bytes (same as MCP JSON-RPC params.arguments).
  bytes arguments_json = 2;
  // Project identity for scope isolation (from git-derived slug).
  string project = 3;
  // Claude session ID for tracking and outcome propagation.
  string session_id = 4;
  // Full versioned identity metadata. Additive: old servers ignore it.
  ProjectIdentityV2 project_identity = 5;
  // Version 3 descriptor. Its presence selects the V3 resolver; project and
  // project_identity are retained solely for the explicit V2 compatibility branch.
  ProjectIdentityV3 project_identity_v3 = 6;
}

// CallToolResponse carries the result of an MCP tool call.
message CallToolResponse {
  // True if the tool returned an error result.
  bool is_error = 1;
  // Tool result as JSON bytes (MCP content array serialized).
  bytes content_json = 2;
  // Server-resolved canonical selector used for this call.
  string canonical_project = 3;
  // Present only for a V3 request that resolved successfully.
  ProjectResolutionResultV3 project_resolution_v3 = 4;
}

// InitializeRequest is the handshake from daemon to server.
message InitializeRequest {
  string client_name = 1;
  string client_version = 2;
  string project = 3;
  ProjectIdentityV2 project_identity = 4;
  // Version 3 descriptor. Its presence selects the V3 resolver.
  ProjectIdentityV3 project_identity_v3 = 5;
}

// InitializeResponse carries server capabilities and tool definitions.
message InitializeResponse {
  string server_name = 1;
  string server_version = 2;
  repeated ToolDefinition tools = 3;
  string canonical_project = 4;
  // Present only for a V3 request that resolved successfully.
  ProjectResolutionResultV3 project_resolution_v3 = 5;
  // Present only for an eligible authenticated workstation keycard.
  bytes authenticated_subject_proof_sha256 = 6;
}

// ToolDefinition describes a single MCP tool.
message ToolDefinition {
  string name = 1;
  string description = 2;
  // JSON Schema for the tool's input parameters.
  bytes input_schema_json = 3;
}

message PingRequest {}

message PingResponse {
  string status = 1;
}

// ---- CI-A CR-003: code index transport messages --------------------------

// CodeChunkMeta carries the lightweight metadata for a single code chunk.
// chunk_type is a free-form string; the only value produced by CR-002a is
// "line-block". AST-derived types are added in CR-002b.
message CodeChunkMeta {
  string chunk_id = 1;
  string file_path = 2;
  int32 byte_start = 3;
  int32 byte_end = 4;
  string language = 5;
  string chunk_type = 6;
  string content_sha256 = 7;
}

// CodeIndexNegotiateRequest carries the client's full chunk manifest for a
// project. The server diffs this against its stored identity keys and returns
// the delta (need_chunks / stale_chunks).
message CodeIndexNegotiateRequest {
  string project_id = 1;
  string index_session_id = 2;
  repeated CodeChunkMeta manifest = 3;
}

// CodeIndexNegotiateResponse tells the client which chunks to upload and
// which server-side chunks are now stale.
//
//   need_chunks  — chunk_ids the server does not have (must be uploaded).
//   stale_chunks — chunk_ids present on the server but absent from the
//                  client manifest (will be swept at CodeIndexUpload EOF).
message CodeIndexNegotiateResponse {
  repeated string need_chunks = 1;
  repeated string stale_chunks = 2;
}

// CodeChunkUpload carries a single chunk payload in the CodeIndexUpload stream.
message CodeChunkUpload {
  string project_id = 1;
  string index_session_id = 2;
  CodeChunkMeta meta = 3;
  bytes content = 4;
}

// CodeIndexUploadReceipt is returned when the CodeIndexUpload stream closes.
//
//   embedded — number of chunks successfully upserted.
//   deleted  — number of stale rows swept after stream close.
//   errors   — per-chunk error strings (non-fatal; successful chunks still count).
message CodeIndexUploadReceipt {
  int32 embedded = 1;
  int32 deleted = 2;
  repeated string errors = 3;
}

// ProjectIdentityV2 carries one complete identity source. Git identities use
// git_remote+relative_path. Non-git identities use a 128-bit anchor and require
// explicit anchor_shared presence. The selector remains on the outer request
// for old-server compatibility; metadata is not an authentication credential.
// Appended after the existing message declarations to minimize generated-code
// churn while preserving every pre-v2 descriptor index.
message ProjectIdentityV2 {
  uint32 version = 1;
  string legacy_project_id = 2;
  string display_name = 3;
  string git_remote = 4;
  string relative_path = 5;
  string non_git_anchor = 6;
  optional bool anchor_shared = 7;
}

// ProjectLegacyIdentifierV3 is non-authoritative compatibility evidence.
message ProjectLegacyIdentifierV3 {
  string scheme = 1;
  string value = 2;
  string provenance = 3;
}

// ProjectIdentityV3 is the versioned project descriptor submitted by a V3-capable client.
// It deliberately has no project_key: clients cannot select canonical project authority.
message ProjectIdentityV3 {
  uint32 version = 1;
  string anchor_project_id = 2;
  string name = 3;
  string scope = 4;
  repeated string normalized_git_remotes = 5;
  repeated ProjectLegacyIdentifierV3 legacy_identifiers = 6;
  string client_instance_id = 7;
}

// ProjectResolutionOutcomeV3 is the closed transport representation of V3 outcomes.
enum ProjectResolutionOutcomeV3 {
  PROJECT_RESOLUTION_OUTCOME_V3_UNSPECIFIED = 0;
  PROJECT_RESOLVED = 1;
  PROJECT_REDIRECTED = 2;
  PROJECT_ONBOARDING_REQUIRED = 3;
  PROJECT_ANCHOR_INVALID = 4;
  PROJECT_SCOPE_MISMATCH = 5;
  PROJECT_NESTED_REPOSITORY_UNRESOLVED = 6;
  PROJECT_ANCHOR_DECISION_REQUIRED = 7;
  PROJECT_IDENTITY_AMBIGUOUS = 8;
  PROJECT_DESCRIPTOR_UNSUPPORTED = 9;
  PROJECT_DESCRIPTOR_INVALID = 10;
  PROJECT_KEY_CLIENT_ASSERTION_FORBIDDEN = 11;
}

// ProjectResolutionResultV3 carries only public resolution facts. project_key,
// resolved_scope, and redirect_reference are set only for successful outcomes.
message ProjectResolutionResultV3 {
  ProjectResolutionOutcomeV3 outcome = 1;
  string correlation = 2;
  optional string project_key = 3;
  optional string resolved_scope = 4;
  optional string redirect_reference = 5;
}

// RegisterProjectIdentityV3Request is deliberately descriptor-only. It carries
// neither project authority nor registration authorization from the client.
message RegisterProjectIdentityV3Request {
  ProjectIdentityV3 project_identity_v3 = 1;

  // relay_revision selects the additive registration branch used only by the
  // private bridge. An omitted value preserves existing registration behavior.
  string relay_revision = 2;
}

// RegisterProjectIdentityV3Response returns the existing typed V3 resolution result.
message RegisterProjectIdentityV3Response {
  ProjectResolutionResultV3 project_resolution_v3 = 1;
}

// GetAmbientCandidatesRequest contains only relay-bound callback facts. It has
// no raw project selector: the V3 descriptor is resolved by the server.
message GetAmbientCandidatesRequest {
  ProjectIdentityV3 project_identity_v3 = 1;
  string host_session_ref = 2;
  string query_text = 3;
  int32 limit = 4;
  string relay_revision = 5;
}

// GetAmbientCandidatesResponse returns only bounded, untrusted ambient text.
message GetAmbientCandidatesResponse {
  string additional_context = 1;
}

// HostAdvisorHostFamily identifies the host family that owns callback facts.
enum HostAdvisorHostFamily {
  HOST_ADVISOR_HOST_FAMILY_UNSPECIFIED = 0;
  HOST_ADVISOR_HOST_FAMILY_OMP = 1;
  HOST_ADVISOR_HOST_FAMILY_CLAUDE_CODE = 2;
  HOST_ADVISOR_HOST_FAMILY_CODEX = 3;
}

// HostAdvisorArtifactKind identifies the proven artifact source.
enum HostAdvisorArtifactKind {
  HOST_ADVISOR_ARTIFACT_KIND_UNSPECIFIED = 0;
  HOST_ADVISOR_ARTIFACT_KIND_INSTALLED = 1;
  HOST_ADVISOR_ARTIFACT_KIND_SOURCE = 2;
}

// HostAdvisorSemantic identifies a closed host callback semantic.
enum HostAdvisorSemantic {
  HOST_ADVISOR_SEMANTIC_UNSPECIFIED = 0;
  HOST_ADVISOR_SEMANTIC_BEFORE_AGENT_START = 1;
  HOST_ADVISOR_SEMANTIC_TOOL_RESULT = 2;
  HOST_ADVISOR_SEMANTIC_TOOL_ACTION = 3;
  HOST_ADVISOR_SEMANTIC_SESSION_FINALIZATION = 4;
}

// HostAdvisorAction identifies a closed action capability.
enum HostAdvisorAction {
  HOST_ADVISOR_ACTION_UNSPECIFIED = 0;
  HOST_ADVISOR_ACTION_EMIT_ADVICE = 1;
  HOST_ADVISOR_ACTION_ADAPTER_ATTESTATION = 2;
  HOST_ADVISOR_ACTION_ALLOW = 3;
  HOST_ADVISOR_ACTION_BLOCK = 4;
  HOST_ADVISOR_ACTION_REWRITE = 5;
}

// HostAdvisorContextInjectionMode identifies a closed host context surface.
enum HostAdvisorContextInjectionMode {
  HOST_ADVISOR_CONTEXT_INJECTION_MODE_UNSPECIFIED = 0;
  HOST_ADVISOR_CONTEXT_INJECTION_MODE_HIDDEN_UNTRUSTED_MESSAGE = 1;
  HOST_ADVISOR_CONTEXT_INJECTION_MODE_DEVELOPER_CONTEXT = 2;
  HOST_ADVISOR_CONTEXT_INJECTION_MODE_ADDITIONAL_CONTEXT = 3;
}

// HostAdvisorCallbackOrdering identifies the observed callback ordering.
enum HostAdvisorCallbackOrdering {
  HOST_ADVISOR_CALLBACK_ORDERING_UNSPECIFIED = 0;
  HOST_ADVISOR_CALLBACK_ORDERING_BEFORE_FIRST_ACTION = 1;
  HOST_ADVISOR_CALLBACK_ORDERING_AFTER_TOOL_RESULT = 2;
  HOST_ADVISOR_CALLBACK_ORDERING_OTHER_PROVEN_ORDER = 3;
}

// HostAdvisorAcknowledgement identifies the strongest host acknowledgement.
enum HostAdvisorAcknowledgement {
  HOST_ADVISOR_ACKNOWLEDGEMENT_UNSPECIFIED = 0;
  HOST_ADVISOR_ACKNOWLEDGEMENT_NONE = 1;
  HOST_ADVISOR_ACKNOWLEDGEMENT_ADAPTER_ATTESTED = 2;
  HOST_ADVISOR_ACKNOWLEDGEMENT_HOST_ACKNOWLEDGED = 3;
  HOST_ADVISOR_ACKNOWLEDGEMENT_CONSUMPTION_OBSERVED = 4;
}

message HostAdvisorProtocolRange {
  uint32 min_version = 1;
  uint32 max_version = 2;
}

message HostAdvisorHost {
  HostAdvisorHostFamily family = 1;
  string host_version = 2;
  string adapter_id = 3;
  string adapter_version = 4;
  string runtime_instance_ref = 5;
}

message HostAdvisorArtifact {
  HostAdvisorArtifactKind kind = 1;
  bytes digest_sha256 = 2;
}

message HostAdvisorEvidenceRef {
  HostAdvisorArtifact artifact = 1;
  string runtime_probe_receipt_id = 2;
}

message HostAdvisorCorrelation {
  bool session = 1;
  bool turn = 2;
  bool tool_action = 3;
  bool stable_phase_anchor = 4;
}

message HostAdvisorCallback {
  bool awaited = 1;
  uint32 deadline_ms = 2;
  HostAdvisorCallbackOrdering ordering = 3;
}

message HostCapability {
  HostAdvisorSemantic semantic = 1;
  repeated HostAdvisorAction allowed_actions = 2;
  repeated HostAdvisorContextInjectionMode context_injection_modes = 3;
  HostAdvisorCorrelation correlation = 4;
  HostAdvisorCallback callback = 5;
  HostAdvisorAcknowledgement acknowledgement = 6;
}

message HostHello {
  HostAdvisorProtocolRange protocol_range = 1;
  HostAdvisorHost host = 2;
  repeated HostCapability requested_capabilities = 3;
  HostAdvisorEvidenceRef evidence_ref = 4;
}

message AcceptedCapabilitySnapshot {
  string snapshot_id = 1;
  bytes contract_sha256 = 2;
  uint64 revision = 3;
  string capability_revision = 4;
  repeated HostCapability capabilities = 5;
}

message HostBinding {
  string binding_id = 1;
  AcceptedCapabilitySnapshot capability_snapshot = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint32 callback_deadline_ms = 4;
  bytes authenticated_subject_proof_sha256 = 5;
}

message HostAdvisorBindRequest {
  HostHello hello = 1;
}

message HostAdvisorBindResponse {
  HostBinding binding = 1;
}

// HostAdvisorFactKind identifies a bounded occurrence fact.
enum HostAdvisorFactKind {
  HOST_ADVISOR_FACT_KIND_UNSPECIFIED = 0;
  HOST_ADVISOR_FACT_KIND_KEYWORD = 1;
  HOST_ADVISOR_FACT_KIND_PATH = 2;
  HOST_ADVISOR_FACT_KIND_TOOL = 3;
}

// HostAdvisorCandidateTier identifies the selected knowledge source tier.
enum HostAdvisorCandidateTier {
  HOST_ADVISOR_CANDIDATE_TIER_UNSPECIFIED = 0;
  HOST_ADVISOR_CANDIDATE_TIER_EXACT = 1;
  HOST_ADVISOR_CANDIDATE_TIER_FTS = 2;
  HOST_ADVISOR_CANDIDATE_TIER_VECTOR = 3;
}

// HostAdvisorAbstentionReason identifies a final non-delivery decision.
enum HostAdvisorAbstentionReason {
  HOST_ADVISOR_ABSTENTION_REASON_UNSPECIFIED = 0;
  HOST_ADVISOR_ABSTENTION_REASON_NO_CANDIDATES = 1;
  HOST_ADVISOR_ABSTENTION_REASON_POLICY_OBSERVING = 2;
  HOST_ADVISOR_ABSTENTION_REASON_POLICY_SHADOW = 3;
  HOST_ADVISOR_ABSTENTION_REASON_POLICY_CANARY_BUDGET = 4;
  HOST_ADVISOR_ABSTENTION_REASON_EVIDENCE_INSUFFICIENT = 5;
  HOST_ADVISOR_ABSTENTION_REASON_HARM_BOUND = 6;
  HOST_ADVISOR_ABSTENTION_REASON_POLICY_SUPPRESSED = 7;
  HOST_ADVISOR_ABSTENTION_REASON_TASK_FIT = 8;
  HOST_ADVISOR_ABSTENTION_REASON_ACTIONABILITY = 9;
  HOST_ADVISOR_ABSTENTION_REASON_EVIDENCE_STATE = 10;
  HOST_ADVISOR_ABSTENTION_REASON_ALREADY_VISIBLE = 11;
  HOST_ADVISOR_ABSTENTION_REASON_CONTEXT_BUDGET = 12;
  HOST_ADVISOR_ABSTENTION_REASON_AMBIGUOUS_CONFLICT = 13;
}

// HostAdvisorUnavailableCode identifies a typed unavailable outcome.
enum HostAdvisorUnavailableCode {
  HOST_ADVISOR_UNAVAILABLE_CODE_UNSPECIFIED = 0;
  HOST_ADVISOR_UNAVAILABLE_CODE_BINDING_UNAVAILABLE = 1;
  HOST_ADVISOR_UNAVAILABLE_CODE_CAPABILITY_UNAVAILABLE = 2;
  HOST_ADVISOR_UNAVAILABLE_CODE_FACTS_INVALID = 3;
  HOST_ADVISOR_UNAVAILABLE_CODE_PREDECESSOR_INVALID = 4;
  HOST_ADVISOR_UNAVAILABLE_CODE_DEADLINE_EXPIRED = 5;
  HOST_ADVISOR_UNAVAILABLE_CODE_REPLAY_CONFLICT = 6;
  HOST_ADVISOR_UNAVAILABLE_CODE_DEPENDENCY_UNAVAILABLE = 7;
  HOST_ADVISOR_UNAVAILABLE_CODE_RECEIPT_UNAVAILABLE = 8;
}

// HostAdvisorObservationState identifies the final observation acknowledgement.
enum HostAdvisorObservationState {
  HOST_ADVISOR_OBSERVATION_STATE_UNSPECIFIED = 0;
  HOST_ADVISOR_OBSERVATION_STATE_ACCEPTED = 1;
  HOST_ADVISOR_OBSERVATION_STATE_DUPLICATE = 2;
  HOST_ADVISOR_OBSERVATION_STATE_REJECTED = 3;
  HOST_ADVISOR_OBSERVATION_STATE_UNAVAILABLE = 4;
}

// HostAdvisorObservationReason identifies the closed observation disposition.
enum HostAdvisorObservationReason {
  HOST_ADVISOR_OBSERVATION_REASON_UNSPECIFIED = 0;
  HOST_ADVISOR_OBSERVATION_REASON_ACCEPTED_ATTESTATION = 1;
  HOST_ADVISOR_OBSERVATION_REASON_ACCEPTED_SEMANTIC_GAP = 2;
  HOST_ADVISOR_OBSERVATION_REASON_DUPLICATE = 3;
  HOST_ADVISOR_OBSERVATION_REASON_INVALID_TARGET = 4;
  HOST_ADVISOR_OBSERVATION_REASON_RECEIPT_UNAVAILABLE = 5;
  HOST_ADVISOR_OBSERVATION_REASON_DEPENDENCY_UNAVAILABLE = 6;
}

// HostAdvisorAttestationKind identifies a closed receipt-bound adapter fact.
enum HostAdvisorAttestationKind {
  HOST_ADVISOR_ATTESTATION_KIND_UNSPECIFIED = 0;
  HOST_ADVISOR_ATTESTATION_KIND_DECISION_RECEIVED = 1;
  HOST_ADVISOR_ATTESTATION_KIND_UNTRUSTED_REFERENCE_PRESENTED = 2;
}

// HostAdvisorSemanticGapCode identifies a closed adapter semantic gap.
enum HostAdvisorSemanticGapCode {
  HOST_ADVISOR_SEMANTIC_GAP_CODE_UNSPECIFIED = 0;
  HOST_ADVISOR_SEMANTIC_GAP_CODE_CALLBACK_UNAVAILABLE = 1;
  HOST_ADVISOR_SEMANTIC_GAP_CODE_CONTEXT_INJECTION_UNAVAILABLE = 2;
  HOST_ADVISOR_SEMANTIC_GAP_CODE_RECEIPT_CORRELATION_UNAVAILABLE = 3;
}

message HostAdvisorTypedFact {
  HostAdvisorFactKind kind = 1;
  string value = 2;
}

message HostAdvisorBeforeAgentStartFacts {
  string task_query = 1;
  repeated HostAdvisorTypedFact facts = 2;
}

message HostAdvisorReceiptIdentity {
  string receipt_id = 1;
  bytes integrity_sha256 = 2;
}

message HostAdvisorOccurrence {
  HostAdvisorSemantic phase = 1;
  string session_ref = 2;
  string phase_anchor_ref = 3;
  HostAdvisorBeforeAgentStartFacts before_agent_start = 4;
  HostAdvisorReceiptIdentity predecessor = 5;
}

message HostAdvisorAdviseRequest {
  string binding_id = 1;
  // Untrusted, evidence-only project ingress; never the canonical project.
  ProjectIdentityV3 project_evidence = 2;
  HostAdvisorOccurrence occurrence = 3;
}

message HostAdvisorKnowledgeReference {
  int64 memory_id = 1;
  uint32 memory_version = 2;
  HostAdvisorCandidateTier source_tier = 3;
  bytes text_sha256 = 4;
}

message HostAdvisorPresentation {
  HostAdvisorContextInjectionMode injection_mode = 1;
  string bounded_text = 2;
}

message HostAdvisorPacket {
  HostAdvisorReceiptIdentity receipt = 1;
  google.protobuf.Timestamp expires_at = 2;
  HostAdvisorKnowledgeReference knowledge = 3;
  HostAdvisorPresentation presentation = 4;
}

message HostAdvisorEmit {
  HostAdvisorReceiptIdentity receipt = 1;
  HostAdvisorPacket packet = 2;
}

message HostAdvisorAbstain {
  HostAdvisorReceiptIdentity receipt = 1;
  HostAdvisorAbstentionReason reason = 2;
}

message HostAdvisorDeliveryAmbiguous {
  HostAdvisorReceiptIdentity receipt = 1;
}

message HostAdvisorUnavailable {
  string correlation_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  HostAdvisorUnavailableCode code = 3;
}

message HostAdvisorAdviseResponse {
  oneof decision {
    HostAdvisorEmit emit = 1;
    HostAdvisorAbstain abstain = 2;
    HostAdvisorDeliveryAmbiguous delivery_ambiguous = 3;
    HostAdvisorUnavailable unavailable = 4;
  }
}

message HostAdvisorAdapterAttestation {
  HostAdvisorAttestationKind kind = 1;
}

message HostAdvisorAdapterSemanticGap {
  HostAdvisorSemanticGapCode code = 1;
}

message HostAdvisorReceiptBoundObservation {
  HostAdvisorReceiptIdentity decision_receipt = 1;
  string observation_anchor_ref = 2;
  oneof evidence {
    HostAdvisorAdapterAttestation adapter_attested = 3;
    HostAdvisorAdapterSemanticGap adapter_semantic_gap = 4;
  }
}

// A channel-only semantic gap carries no project evidence or receipt identity.
message HostAdvisorChannelSemanticGap {
  string observation_anchor_ref = 1;
  HostAdvisorAdapterSemanticGap adapter_semantic_gap = 2;
}

message HostAdvisorObserveRequest {
  string binding_id = 1;
  oneof target {
    HostAdvisorReceiptBoundObservation receipt_bound = 2;
    HostAdvisorChannelSemanticGap channel_gap = 3;
  }
}

message HostAdvisorObserveResponse {
  HostAdvisorObservationState state = 1;
  string observation_id = 2;
  HostAdvisorObservationReason reason = 3;
}
