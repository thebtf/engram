basePath: /
definitions:
  github_com_thebtf_engram_internal_embedding.EmbeddingStats:
    properties:
      chunk_count:
        type: integer
      dimension:
        type: integer
      last_chunk_at:
        type: string
      memories_with_chunks:
        type: integer
      model:
        type: string
    type: object
  github_com_thebtf_engram_pkg_models.Memory:
    properties:
      access_count:
        type: integer
      citation_count:
        type: integer
      confidence:
        type: number
      consecutive_citation_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      defeasibility:
        type: string
      deleted_at:
        type: string
      edited_by:
        type: string
      epistemic_type:
        type: string
      id:
        type: integer
      importance_base:
        type: number
      injection_count:
        type: integer
      last_confirmed:
        type: string
      last_retrieved_at:
        type: string
      privacy_scope:
        description: |-
          PrivacyScope is one of 'private' | 'project' | 'shared' | 'global'.
          Added by migration 125 (TG1 / T001+T002). DEFAULT 'project' for legacy rows.
          Backward-compat: see spec.md §FR-F1 REVISE — the legacy `scope:*` tag + MCP
          response synthesis surface remains active for 2 minor versions (until v6.7.0)
          per RI-F2.
        type: string
      project:
        type: string
      promotion_target:
        type: string
      recurrence_count:
        type: integer
      retrievability:
        type: number
      review_after:
        type: string
      source_agent:
        type: string
      source_sessions:
        description: |-
          SourceSessions lists every session_id that wrote or confirmed this memory.
          Added by migration 125 (TG1 / T001+T002) as TEXT[] NOT NULL DEFAULT ARRAY[]::TEXT[].
          Consumed by internal/scope/filter.Resolve for private-scope visibility checks
          per spec §FR-F1 CHK005-ADDED keycard identity invariant.
        items:
          type: string
        type: array
      source_workstation_id:
        description: |-
          SourceWorkstationID is the writing keycard's workstation identifier
          (api_tokens.id for SourceClient writers). Added by migration 130 (TG1 /
          T001b + T003b, AMEND 2026-05-25). Empty string is the "unknown
          workstation" sentinel — pre-existing rows + flag-OFF writes carry empty.
          Consumed by scope.Resolve ScopePrivate for the keycard identity
          invariant per spec §FR-F1 AMEND 2026-05-25 decision tree.
        type: string
      stability:
        type: number
      status:
        type: string
      superseded_by:
        type: integer
      supersedes_id:
        type: integer
      tags:
        items:
          type: string
        type: array
      tier:
        type: string
      ts_alpha:
        type: number
      ts_beta:
        type: number
      updated_at:
        type: string
      valid_from:
        type: string
      valid_until:
        type: string
      version:
        type: integer
    type: object
  internal_worker.BackfillSessionRequest:
    properties:
      content:
        description: Content is the raw JSONL session data.
        type: string
      project:
        description: Project overrides the project path from session metadata. Empty
          = use parsed value.
        type: string
      run_id:
        description: RunID groups observations from the same backfill run.
        type: string
      session_id:
        description: SessionID identifies the source session (e.g. UUID from filename).
        type: string
    type: object
  internal_worker.BackfillSessionResponse:
    properties:
      deprecated:
        type: string
      errors:
        type: integer
      skipped:
        type: integer
      stored:
        type: integer
    type: object
  internal_worker.BackfillStatus:
    properties:
      active_runs:
        additionalProperties:
          $ref: '#/definitions/internal_worker.RunInfo'
        type: object
      total_observations:
        type: integer
      total_runs:
        type: integer
    type: object
  internal_worker.CheckSessionsRequest:
    properties:
      session_ids:
        items:
          type: string
        type: array
    type: object
  internal_worker.ComponentHealth:
    properties:
      message:
        type: string
      name:
        type: string
      status:
        description: '"healthy", "degraded", "unhealthy"'
        type: string
    type: object
  internal_worker.IngestRequest:
    properties:
      project:
        type: string
      session_id:
        type: string
      tool_input: {}
      tool_name:
        type: string
      tool_result: {}
      workstation_id:
        type: string
    type: object
  internal_worker.InstinctsImportRequest:
    properties:
      path:
        type: string
    type: object
  internal_worker.MemoryTriggerMatch:
    properties:
      blurb:
        type: string
      kind:
        type: string
      observation_id:
        type: integer
    type: object
  internal_worker.MemoryTriggerRequest:
    properties:
      params:
        additionalProperties: {}
        type: object
      project:
        type: string
      session_id:
        type: string
      tool:
        type: string
    type: object
  internal_worker.ObservationRequest:
    properties:
      claudeSessionId:
        type: string
      cwd:
        type: string
      project:
        type: string
      tool_input: {}
      tool_name:
        type: string
      tool_response: {}
    type: object
  internal_worker.RunInfo:
    properties:
      errors:
        type: integer
      run_id:
        type: string
      sessions:
        type: integer
      skipped:
        type: integer
      stored:
        type: integer
    type: object
  internal_worker.SelfCheckResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/internal_worker.ComponentHealth'
        type: array
      overall:
        description: '"healthy", "degraded", "unhealthy"'
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  internal_worker.SessionInitRequest:
    properties:
      claudeSessionId:
        type: string
      matchedObservations:
        type: integer
      project:
        type: string
      prompt:
        type: string
    type: object
  internal_worker.SessionInitResponse:
    properties:
      promptNumber:
        type: integer
      reason:
        type: string
      sessionDbId:
        type: integer
      skipped:
        type: boolean
    type: object
  internal_worker.SessionStartRequest:
    properties:
      promptNumber:
        type: integer
      userPrompt:
        type: string
    type: object
  internal_worker.SubagentCompleteRequest:
    properties:
      claudeSessionId:
        type: string
      project:
        type: string
    type: object
  internal_worker.SummarizeRequest:
    properties:
      lastAssistantMessage:
        type: string
      lastUserMessage:
        type: string
    type: object
  internal_worker.loginRequest:
    properties:
      token:
        type: string
    type: object
  internal_worker.sessionEndRequest:
    properties:
      agent_output_text:
        type: string
      project:
        type: string
      session_id:
        type: string
    type: object
  internal_worker.sessionStartCompatibilityResponse:
    properties:
      generated_at:
        type: string
      issues:
        items:
          additionalProperties: {}
          type: object
        type: array
      memories:
        items:
          additionalProperties: {}
          type: object
        type: array
      rules:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  internal_worker.storeCredentialRequest:
    properties:
      name:
        type: string
      project:
        type: string
      scope:
        type: string
      tags:
        items:
          type: string
        type: array
      value:
        type: string
    type: object
  internal_worker.storeMemoryRequest:
    properties:
      content:
        type: string
      privacy_scope:
        description: T004 — vNext F, 4-tier enum
        type: string
      project:
        type: string
      session_id:
        description: T004 — caller session for SourceSessions
        type: string
      source_agent:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  internal_worker.tokenCreateRequest:
    properties:
      name:
        type: string
      principal:
        type: string
      principal_kind:
        type: string
      scope:
        type: string
    type: object
  internal_worker.vnextStatsResponse:
    properties:
      citation_count:
        type: integer
      embedding:
        $ref: '#/definitions/github_com_thebtf_engram_internal_embedding.EmbeddingStats'
      generated_at:
        type: string
      injection_count:
        type: integer
      noise_ratio:
        type: number
      uncited_count:
        type: integer
      write_gate_stats:
        additionalProperties:
          format: int64
          type: integer
        type: object
    type: object
host: localhost:37777
info:
  contact: {}
  description: 'Persistent shared memory infrastructure for AI agents. Stores memories
    + behavioral rules + credentials in PostgreSQL. REST API over HTTP; MCP tools
    are served via stdio client proxy only (server-side MCP HTTP transports removed
    in v5). Note: the host below is the default for local development; set ENGRAM_LISTEN_ADDR
    to change the listen address in production.'
  title: Engram API
  version: 1.0.0
paths:
  /api/analytics/search-misses:
    post:
      consumes:
      - application/json
      description: Search miss analytics persistence was removed in v5; this endpoint
        remains for compatibility and returns an explicit deprecation payload.
      parameters:
      - description: 'Params: project (optional — omit to aggregate across all projects),
          limit (optional)'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid project name
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get search miss analytics
      tags:
      - Search
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Validates the master admin token and returns an HMAC-signed session
        cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "401":
          description: unauthorized
          schema:
            type: string
      summary: Login with master token
      tags:
      - Auth
  /api/auth/logout:
    post:
      description: Clears the session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - Auth
  /api/auth/me:
    get:
      description: Returns the current authentication state and role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Check authentication status
      tags:
      - Auth
  /api/auth/tokens:
    get:
      description: Returns all API tokens (excluding hashes) for admin management.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List API tokens
      tags:
      - Auth
    post:
      consumes:
      - application/json
      description: Generates a new client API token with the specified name and scope.
        The raw token is returned only once.
      parameters:
      - description: Token creation parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.tokenCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad request
          schema:
            type: string
        "403":
          description: forbidden — issuance requires browser session
          schema:
            type: string
        "409":
          description: conflict
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Create a new API token
      tags:
      - Auth
  /api/auth/tokens/{id}:
    delete:
      description: Revokes the specified API token, preventing further authentication.
      parameters:
      - description: Token ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Revoke an API token
      tags:
      - Auth
  /api/auth/tokens/{id}/stats:
    get:
      description: Returns request count and last-used timestamp for a specific token.
      parameters:
      - description: Token ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get API token usage stats
      tags:
      - Auth
  /api/backfill/session:
    post:
      consumes:
      - application/json
      description: Accepts raw JSONL session content, runs server-side LLM extraction,
        and stores resulting observations with semantic deduplication.
      parameters:
      - description: Session content and metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.BackfillSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_worker.BackfillSessionResponse'
        "400":
          description: bad request
          schema:
            type: string
        "503":
          description: LLM not configured or store not initialized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Backfill session with LLM extraction
      tags:
      - Backfill
  /api/backfill/status:
    get:
      description: Returns status of all active backfill runs including stored/skipped/error
        counts per run.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_worker.BackfillStatus'
      security:
      - ApiKeyAuth: []
      summary: Get backfill status
      tags:
      - Backfill
  /api/context/by-file:
    get:
      description: Returns observations with files_modified or files_read matching
        the given path.
      parameters:
      - description: File path to search for
        in: query
        name: path
        required: true
        type: string
      - description: Project name
        in: query
        name: project
        required: true
        type: string
      - description: Max results (default 10, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad request
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: File-specific context
      tags:
      - Context
  /api/context/count:
    get:
      description: Returns the count of observations for a project (cached).
      parameters:
      - description: Project name
        in: query
        name: project
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get observation count
      tags:
      - Context
  /api/context/files:
    get:
      description: Returns observations relevant to specific files being worked on,
        using vector similarity search.
      parameters:
      - description: Project name
        in: query
        name: project
        required: true
        type: string
      - description: Comma-separated file paths (max 20)
        in: query
        name: files
        required: true
        type: string
      - description: Results per file (default 10, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad request
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get file context
      tags:
      - Context
  /api/context/inject:
    get:
      consumes:
      - application/json
      description: Returns context for injection at session start. Response includes
        recent (last 5), relevant (top 10 semantic), and guidance sections. Supports
        GET (deprecated) and POST. Critical startup path — optimized for speed.
      parameters:
      - description: Project name (required)
        in: query
        name: project
        type: string
      - description: Agent ID (acts as project scope if project empty)
        in: query
        name: agent_id
        type: string
      - description: 'Response format: ''compact'' for minimal payload'
        in: query
        name: format
        type: string
      - description: 'POST body: {project, agent_id, cwd, legacy_project, git_remote,
          relative_path}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Inject context for session start
      tags:
      - Context
    post:
      consumes:
      - application/json
      description: Returns context for injection at session start. Response includes
        recent (last 5), relevant (top 10 semantic), and guidance sections. Supports
        GET (deprecated) and POST. Critical startup path — optimized for speed.
      parameters:
      - description: Project name (required)
        in: query
        name: project
        type: string
      - description: Agent ID (acts as project scope if project empty)
        in: query
        name: agent_id
        type: string
      - description: 'Response format: ''compact'' for minimal payload'
        in: query
        name: format
        type: string
      - description: 'POST body: {project, agent_id, cwd, legacy_project, git_remote,
          relative_path}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Inject context for session start
      tags:
      - Context
  /api/context/search:
    get:
      consumes:
      - application/json
      description: Searches observations relevant to a user prompt using hybrid vector
        + FTS search with query expansion, cross-encoder reranking, and clustering.
        Supports both GET (query params) and POST (JSON body) to avoid URL length
        limits.
      parameters:
      - description: Project filter
        in: query
        name: project
        type: string
      - description: Search query
        in: query
        name: query
        type: string
      - description: Working directory (ignored server-side)
        in: query
        name: cwd
        type: string
      - description: Agent ID (acts as project scope if project empty)
        in: query
        name: agent_id
        type: string
      - description: Number of results (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: 'POST body: {project, query, agent_id, cwd, limit}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: project and query required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Search observations by prompt
      tags:
      - Search
    post:
      consumes:
      - application/json
      description: Searches observations relevant to a user prompt using hybrid vector
        + FTS search with query expansion, cross-encoder reranking, and clustering.
        Supports both GET (query params) and POST (JSON body) to avoid URL length
        limits.
      parameters:
      - description: Project filter
        in: query
        name: project
        type: string
      - description: Search query
        in: query
        name: query
        type: string
      - description: Working directory (ignored server-side)
        in: query
        name: cwd
        type: string
      - description: Agent ID (acts as project scope if project empty)
        in: query
        name: agent_id
        type: string
      - description: Number of results (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: 'POST body: {project, query, agent_id, cwd, limit}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: project and query required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Search observations by prompt
      tags:
      - Search
  /api/context/session-start:
    get:
      description: 'Returns static session-start context sourced from the server gRPC
        implementation: active issues, behavioral rules, recent memories, and generated_at.'
      parameters:
      - description: Project slug (required)
        in: query
        name: project
        type: string
      - description: 'POST body: {project, memories_limit, issues_limit}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_worker.sessionStartCompatibilityResponse'
        "400":
          description: project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get static session-start context
      tags:
      - Context
    post:
      description: 'Returns static session-start context sourced from the server gRPC
        implementation: active issues, behavioral rules, recent memories, and generated_at.'
      parameters:
      - description: Project slug (required)
        in: query
        name: project
        type: string
      - description: 'POST body: {project, memories_limit, issues_limit}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_worker.sessionStartCompatibilityResponse'
        "400":
          description: project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get static session-start context
      tags:
      - Context
  /api/decisions/search:
    post:
      consumes:
      - application/json
      description: Searches observations using decision-optimized semantic search.
        Thin REST wrapper over the search manager's Decisions method.
      parameters:
      - description: 'Search params: query, project (required), limit (optional)'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: query and project required
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Search decisions
      tags:
      - Search
  /api/events/ingest:
    post:
      consumes:
      - application/json
      description: Receives raw tool events from Claude Code hooks. Stores in raw_events,
        runs deterministic Level 0 pipeline, creates an observation, and triggers
        async embedding.
      parameters:
      - description: Tool event data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.IngestRequest'
      produces:
      - application/json
      responses:
