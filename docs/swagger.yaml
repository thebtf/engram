        memories_with_chunks, etc.).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get vector database metrics
      tags:
      - Vectors
  /api/vectors/health:
    get:
      description: Reports live pgvector subsystem health. Message reflects whether
        vNext hybrid retrieval is active.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get vector database health
      tags:
      - Vectors
  /api/version:
    get:
      description: Returns the worker version string for version checking.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get worker version
      tags:
      - System
  /sessions/{id}/init:
    post:
      consumes:
      - application/json
      description: Initializes an SDK agent session in the session manager. Observations
        are processed asynchronously.
      parameters:
      - description: Session database ID
        in: path
        name: id
        required: true
        type: integer
      - description: Session start params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.SessionStartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid session id
          schema:
            type: string
        "404":
          description: session not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Start SDK agent session
      tags:
      - Sessions
  /sessions/{id}/summarize:
    post:
      consumes:
      - application/json
      description: Handles summarize requests from the stop hook. Queues a summarization
        request for background processing.
      parameters:
      - description: Session database ID
        in: path
        name: id
        required: true
        type: integer
      - description: Last messages for summarization
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_worker.SummarizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid session id
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Summarize session
      tags:
      - Sessions
  /v1/models:
    get:
      description: OpenAI-compatibility shim. Embedding pipeline removed in v5; always
        returns {"object":"list","data":[]}.
      produces:
      - application/json
      responses:
        "200":
          description: Always returns empty data array; no real model entries
          schema:
            additionalProperties: true
            type: object
      summary: 'Compatibility: empty models list (no embeddings in v5)'
      tags:
      - System
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-Auth-Token
    type: apiKey
swagger: "2.0"
