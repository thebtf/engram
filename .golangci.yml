# golangci-lint configuration for engram.
# Run: golangci-lint run ./...

linters-settings:
  govet:
    enable:
      # fieldalignment catches struct padding waste that inflates memory usage.
      - fieldalignment
  errcheck:
    # These return errors that are safe to ignore in test helpers and
    # low-consequence write paths; treating them as fatal adds noise.
    exclude-functions:
      - (io.Closer).Close
      - (*encoding/json.Encoder).Encode
      - (io.Writer).Write

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - gofmt
    - staticcheck
    - unused
    - ineffassign
    - typecheck

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    # Test files call helpers that trigger errcheck and gosec; suppressing
    # them there keeps the signal-to-noise ratio high for production code.
    - path: _test\.go
      linters:
        - errcheck
        - gosec

run:
  timeout: 5m
  tests: true
