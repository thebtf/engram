name: Publish OpenClaw Plugin

on:
  push:
    branches: [main]
    paths:
      - "plugin/openclaw-engram/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: plugin/openclaw-engram

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    environment: npm # Must match trusted publisher config on npmjs.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build candidate Go client for consumer tests
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/engram" ./cmd/engram
          printf 'ENGRAM_EXECUTABLE=%s\n' "$RUNNER_TEMP/engram" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Test
        run: npm test

      - name: Require unpublished newer version
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view openclaw-engram version)
          node scripts/check-publish-version.mjs "$LOCAL" "$REMOTE"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish --access public
