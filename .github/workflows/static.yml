# Deploy the engram documentation website to GitHub Pages.
#
# Triggered on pushes to main that touch docs/ content, and on manual
# workflow_dispatch so operators can force a re-deploy without a docs change.
#
# Job names and the deployment environment name are referenced by:
#   - branch protection rules ("pages" concurrency group)
#   - the GitHub Pages deployment environment
# Do not rename them without updating those references.

name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time. A queued run is not cancelled so an
# in-progress deploy always finishes cleanly.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install dependencies
        run: cd docs && npm ci

      - name: Build
        run: cd docs && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
