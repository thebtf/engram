          $unreachableScoutRunner = $dbRunner.Replace($scanLine, $unreachableScoutReplacement)
          Assert-MutationRejected 'unreachable live Scout invocation' { Assert-WorkflowContract $workflow $critical $stand $unreachableScoutRunner $criticalRunner $devStandRunner }
          $duplicateScoutRunner = $dbRunner.Replace($scanLine, ($scanLine + "`n" + $scanLine))
