name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # M0 RELEASE-GATES foundation. The wrapper owns fresh database identity,
  # go-test JSON parsing, unexpected-skip policy, per-process exit capture,
  # connection evidence, and unconditional cleanup. A later successful command
  # cannot overwrite an earlier non-zero exit.
  release-gates-foundation:
    name: release gates / isolated clean-db chain
    runs-on: ubuntu-latest
    env:
      ENGRAM_TEST_ADMIN_DSN: postgres://engram:engram@localhost:5432/postgres?sslmode=disable
      DATABASE_DSN: postgres://engram:engram@localhost:5432/engram_critical_test?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram_critical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test go-test JSON assertion
        shell: pwsh
        run: ./scripts/production-gates/assert-go-test-json.ps1 -SelfTest

      - name: Self-test coverage assertion
        shell: pwsh
        run: ./scripts/production-gates/assert-coverage.ps1 -SelfTest

      - name: Self-test cleanup safety
        shell: pwsh
        run: ./scripts/production-gates/cleanup-db-sessions.ps1 -SelfTest

      - name: Self-test false-green prevention
        shell: pwsh
        run: ./scripts/production-gates/run-db-suite.ps1 -SelfTest

      - name: Self-test tracked critical runner
        shell: pwsh
        run: ./scripts/production-gates/run-critical-suite.ps1 -Config .agent/critical-suite.config.yaml -SelfTest

      - name: Self-test tracked dev-stand runner
        shell: pwsh
        run: ./scripts/production-gates/run-dev-stand.ps1 -Config .agent/dev-stand.config.yaml -SelfTest

      - name: Self-test plan path ownership gate
        shell: pwsh
        run: ./scripts/production-gates/assert-plan-path-ownership.ps1 -SelfTest

      - name: Self-test active candidate path authority gate
        shell: pwsh
        run: ./scripts/production-gates/assert-active-candidate-path-authority.ps1 -SelfTest

      - name: Self-test Windows tracked path budget
        shell: pwsh
        run: ./scripts/production-gates/assert-windows-path-budget.ps1 -SelfTest

      - name: Self-test OpenClaw node release matrix
        shell: pwsh
        run: ./scripts/production-gates/run-node-matrix.ps1 -SelfTest

      - name: Assert tracked production-ready ownership ledger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $planSha = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md -PrintCanonicalPlanSha256)).Trim()
          $scopeText = Get-Content -LiteralPath '.agent/plans/2026-07-10-engram-production-ready-scope-map.json' -Raw
          $scopeCanonical = ($scopeText -replace "`r`n", "`n") -replace "`r", "`n"
          $scopeSha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.UTF8Encoding]::new($false).GetBytes($scopeCanonical))).ToLowerInvariant()
          & pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 `
            -Mode Ledger `
            -Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md `
            -ExpectedPlanSha256 $planSha `
            -State .agent/plans/2026-07-10-engram-production-ready-ownership-state.json `
            -ScopeMap .agent/plans/2026-07-10-engram-production-ready-scope-map.json `
            -ExpectedScopeMapSha256 $scopeSha `
            -Artifact .agent/e/rg4/ci-ledger.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert frozen active candidate path authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contractSha = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-active-candidate-path-authority.ps1 -Contract .agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json -PrintCanonicalContractSha256)).Trim()
          $planSha = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md -PrintCanonicalPlanSha256)).Trim()
          & pwsh -NoProfile -File scripts/production-gates/assert-active-candidate-path-authority.ps1 `
            -Contract .agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json `
            -ExpectedContractSha256 $contractSha `
            -Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md `
            -ExpectedPlanSha256 $planSha `
            -Artifact .agent/e/rg17/ci-active-candidate-authority.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert R12 closed-world plan governance
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath '.agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json' -Raw | ConvertFrom-Json -Depth 100
          if (@($contract.control_plane_maintenance.consumed_epochs).Count -eq 0 -and $null -eq $contract.control_plane_maintenance.transition_manifest) {
            ./.agent/specs/release-gates-r12/evidence/plan-governance/test-r12-plan-governance.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            Write-Output 'R12 successor state: immutable bootstrap proof replaced by trusted inductive history validation'
          }

      - name: Assert Windows tracked path budget
        shell: pwsh
        run: pwsh -NoProfile -File scripts/production-gates/assert-windows-path-budget.ps1 -Repository . -Ref HEAD -CheckoutPrefixLength 66 -MaximumCombinedPathLength 240 -Artifact .agent/e/rg4/ci-path-budget.json

      - name: Assert tracked gate / CI conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-CanonicalTextSha256([string]$text) {
            $canonical = ($text -replace "`r`n", "`n") -replace "`r", "`n"
            $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($canonical)
            return [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          }
          $critical = Get-Content -Raw '.agent/critical-suite.config.yaml'
          $stand = Get-Content -Raw '.agent/dev-stand.config.yaml'
          $workflow = Get-Content -Raw '.github/workflows/test.yml'
          $dbRunner = Get-Content -Raw 'scripts/production-gates/run-db-suite.ps1'
          $criticalRunner = Get-Content -Raw 'scripts/production-gates/run-critical-suite.ps1'
          $devStandRunner = Get-Content -Raw 'scripts/production-gates/run-dev-stand.ps1'
          $ownershipRunner = Get-Content -Raw 'scripts/production-gates/assert-plan-path-ownership.ps1'
          $activeAuthorityRunner = Get-Content -Raw 'scripts/production-gates/assert-active-candidate-path-authority.ps1'
          $pathBudgetRunner = Get-Content -Raw 'scripts/production-gates/assert-windows-path-budget.ps1'
          $nodeRunner = Get-Content -Raw 'scripts/production-gates/run-node-matrix.ps1'
          $ownershipState = Get-Content -Raw '.agent/plans/2026-07-10-engram-production-ready-ownership-state.json'
          $masterPlan = Get-Content -Raw '.agent/plans/2026-07-10-engram-production-ready-master-plan.md'
          $scopeMap = Get-Content -Raw '.agent/plans/2026-07-10-engram-production-ready-scope-map.json'
          $activeDiffContracts = Get-Content -Raw '.agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json'
          $observedPlanSha = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md -PrintCanonicalPlanSha256)).Trim()
          $observedScopeMapSha = Get-CanonicalTextSha256 $scopeMap
          $expectedPlanSha = $observedPlanSha
          $expectedScopeMapSha = $observedScopeMapSha
          $expectedActiveDiffContractSha = Get-CanonicalTextSha256 $activeDiffContracts
          $rejectedBulkHead = '68b2ce5835c7c6efdf1c68da9eedcb8d9c3837ef'
          $rejectedBulkChecker = '.agent/worktrees/prc-db-bulkops/.agent/reviews/2026-07-10-db-bulkops-sibling-rework-check.md'
          $rejectedBulkCheckerSha = 'EB9EB227363A27EA058C6654BD7E38EED1088252F79F837E377B2A3CBC1FAFB7'
          $trackedCriticalCommand = 'go test -tags=critical -json ./tests/critical/... -count=1'
          $trackedDatabaseCommand = 'pwsh -NoProfile -File scripts/production-gates/run-db-suite.ps1 -FreshDatabase -Package ./... -Race -FailOnUnexpectedSkip'
          $trackedCriticalWrapper = 'pwsh -NoProfile -File scripts/production-gates/run-critical-suite.ps1 -Config .agent/critical-suite.config.yaml'
          $trackedDevStandWrapper = 'pwsh -NoProfile -File scripts/production-gates/run-dev-stand.ps1 -Config .agent/dev-stand.config.yaml'
          $trackedPathBudgetWrapper = 'pwsh -NoProfile -File scripts/production-gates/assert-windows-path-budget.ps1 -Repository . -Ref HEAD -CheckoutPrefixLength 66 -MaximumCombinedPathLength 240 -Artifact .agent/e/rg4/ci-path-budget.json'

          function Remove-ConformanceStep([string]$text) {
            return [regex]::Replace($text, '(?ms)^      - name: Assert tracked gate / CI conformance\r?\n.*?(?=^      - name: |\z)', '')
          }

          function Get-StepBody([string]$text, [string]$name) {
            $match = [regex]::Match($text, ('(?ms)^      - name: ' + [regex]::Escape($name) + '\r?\n(?<body>.*?)(?=^      - name: |\z)'))
            if (-not $match.Success) { throw "workflow step '$name' is missing" }
            return $match.Groups['body'].Value
          }

          function ConvertTo-AstShape([string]$text) {
            return [regex]::Replace($text, '\s+', '')
          }

          function Get-PowerShellAst([string]$text) {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) {
              throw "PowerShell source has $($parseErrors.Count) parse error(s): $([string]::Join('; ', @($parseErrors | ForEach-Object Message)))"
            }
            return $ast
          }

          function Get-Ancestor([System.Management.Automation.Language.Ast]$node, [type]$type) {
            $cursor = $node.Parent
            while ($null -ne $cursor) {
              if ($cursor -is $type) { return $cursor }
              $cursor = $cursor.Parent
            }
            return $null
          }

          function Test-InExactIfClause([System.Management.Automation.Language.Ast]$node, [string]$expectedCondition) {
            $expectedShape = ConvertTo-AstShape $expectedCondition
            $cursor = $node.Parent
            while ($null -ne $cursor) {
              if ($cursor -is [System.Management.Automation.Language.IfStatementAst]) {
                foreach ($clause in $cursor.Clauses) {
                  $body = $clause.Item2
                  if ($node.Extent.StartOffset -ge $body.Extent.StartOffset -and $node.Extent.EndOffset -le $body.Extent.EndOffset -and (ConvertTo-AstShape $clause.Item1.Extent.Text) -ceq $expectedShape) {
                    return $true
                  }
                }
              }
              $cursor = $cursor.Parent
            }
            return $false
          }

          function Assert-ExactCommandControlFlow(
            [System.Management.Automation.Language.CommandAst]$node,
            [string[]]$expectedIfConditions,
            [string[]]$expectedLoopConditions
          ) {
            $actualIfConditions = [System.Collections.Generic.List[string]]::new()
            $actualLoopConditions = [System.Collections.Generic.List[string]]::new()
            $cursor = $node.Parent
            while ($null -ne $cursor -and $cursor -isnot [System.Management.Automation.Language.FunctionDefinitionAst]) {
              if ($cursor -is [System.Management.Automation.Language.IfStatementAst]) {
                $matchedClause = $false
                foreach ($clause in $cursor.Clauses) {
                  if ($node.Extent.StartOffset -ge $clause.Item2.Extent.StartOffset -and $node.Extent.EndOffset -le $clause.Item2.Extent.EndOffset) {
                    $actualIfConditions.Add((ConvertTo-AstShape $clause.Item1.Extent.Text))
                    $matchedClause = $true
                    break
                  }
                }
                if (-not $matchedClause) {
                  $clauseShapes = @($cursor.Clauses | ForEach-Object { ConvertTo-AstShape $_.Item1.Extent.Text })
                  $actualIfConditions.Add(('<else:' + ($clauseShapes -join ',') + '>'))
                }
              }
              elseif ($cursor -is [System.Management.Automation.Language.ForEachStatementAst]) {
                $actualLoopConditions.Add(('foreach:' + (ConvertTo-AstShape $cursor.Condition.Extent.Text)))
              }
              elseif ($cursor -is [System.Management.Automation.Language.ForStatementAst]) {
                $actualLoopConditions.Add(('for:' + (ConvertTo-AstShape $cursor.Condition.Extent.Text)))
              }
              elseif ($cursor -is [System.Management.Automation.Language.LoopStatementAst] -or
                      $cursor -is [System.Management.Automation.Language.SwitchStatementAst] -or
                      $cursor -is [System.Management.Automation.Language.TrapStatementAst] -or
                      $cursor -is [System.Management.Automation.Language.DataStatementAst] -or
                      $cursor -is [System.Management.Automation.Language.ScriptBlockExpressionAst]) {
                throw "live invocation '$([string]$node.CommandElements[1].Value)' is hidden in unsupported or potentially unreachable control flow '$($cursor.GetType().Name)'"
              }
              $cursor = $cursor.Parent
            }

            $expectedIfShapes = @($expectedIfConditions | ForEach-Object { ConvertTo-AstShape $_ })
            $expectedLoopShapes = @($expectedLoopConditions | ForEach-Object { ConvertTo-AstShape $_ })
            if ($actualIfConditions.Count -ne $expectedIfShapes.Count) {
              throw "live invocation '$([string]$node.CommandElements[1].Value)' has $($actualIfConditions.Count) if-branch ancestor(s), expected $($expectedIfShapes.Count)"
            }
            foreach ($condition in $expectedIfShapes) {
              if (-not $actualIfConditions.Contains($condition)) { throw "live invocation '$([string]$node.CommandElements[1].Value)' is missing exact live if-branch '$condition'" }
            }
            if ($actualLoopConditions.Count -ne $expectedLoopShapes.Count) {
              throw "live invocation '$([string]$node.CommandElements[1].Value)' has $($actualLoopConditions.Count) loop ancestor(s), expected $($expectedLoopShapes.Count)"
            }
            foreach ($condition in $expectedLoopShapes) {
              if (-not $actualLoopConditions.Contains($condition)) { throw "live invocation '$([string]$node.CommandElements[1].Value)' is missing exact live loop '$condition'" }
            }
          }

          function Get-ExactCapturedInvocation(
            [System.Management.Automation.Language.ScriptBlockAst]$ast,
            [string]$name,
            [string]$expectedExecutable,
            [string]$expectedArguments,
            [string]$expectedAssignment,
            [string]$expectedIfCondition
          ) {
            $commands = @($ast.FindAll({
              param($node)
              if ($node -isnot [System.Management.Automation.Language.CommandAst] -or $node.GetCommandName() -cne 'Invoke-CapturedProcess' -or $node.CommandElements.Count -lt 2) { return $false }
              $nameNode = $node.CommandElements[1]
              return ($nameNode -is [System.Management.Automation.Language.StringConstantExpressionAst] -or $nameNode -is [System.Management.Automation.Language.ExpandableStringExpressionAst]) -and [string]$nameNode.Value -ceq $name
            }, $true))
            if ($commands.Count -ne 1) { throw "live Invoke-CapturedProcess '$name' cardinality must be exactly 1; found $($commands.Count)" }
            $command = $commands[0]
            if ($command.CommandElements.Count -ne 10) { throw "live invocation '$name' argument cardinality drifted: found $($command.CommandElements.Count - 1), expected 9" }
            if ($command.CommandElements[2].Extent.Text -cne $expectedExecutable) { throw "live invocation '$name' executable drifted: '$($command.CommandElements[2].Extent.Text)'" }
            if ((ConvertTo-AstShape $command.CommandElements[3].Extent.Text) -cne (ConvertTo-AstShape $expectedArguments)) { throw "live invocation '$name' command arguments drifted: '$($command.CommandElements[3].Extent.Text)'" }
            $assignment = Get-Ancestor $command ([System.Management.Automation.Language.AssignmentStatementAst])
            if ($null -eq $assignment -or $assignment.Left.Extent.Text -cne $expectedAssignment) { throw "live invocation '$name' is not assigned to $expectedAssignment" }
            $function = Get-Ancestor $command ([System.Management.Automation.Language.FunctionDefinitionAst])
            if ($null -eq $function -or $function.Name -cne 'Invoke-DevStandContract') { throw "live invocation '$name' is outside Invoke-DevStandContract" }
            if (-not (Test-InExactIfClause $command $expectedIfCondition)) { throw "live invocation '$name' is outside the required branch '$expectedIfCondition'" }
            return $command
          }

          function Assert-ExactImageTargetMap([System.Management.Automation.Language.ScriptBlockAst]$ast) {
            $functions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Get-DevStandImageTargets' }, $true))
            if ($functions.Count -ne 1) { throw "Get-DevStandImageTargets cardinality must be exactly 1; found $($functions.Count)" }
            $maps = @($functions[0].Body.FindAll({ param($node) $node -is [System.Management.Automation.Language.HashtableAst] }, $true))
            if ($maps.Count -ne 1) { throw "Get-DevStandImageTargets must contain exactly one live hashtable; found $($maps.Count)" }
            $expected = [ordered]@{ postgres = "'ghcr.io/thebtf/engram-postgres:main'"; server = "'ghcr.io/thebtf/engram:main'"; 'operator-console' = "'ghcr.io/thebtf/engram-operator-console:main'" }
            if ($maps[0].KeyValuePairs.Count -ne $expected.Count) { throw "exact image target map must contain 3 services; found $($maps[0].KeyValuePairs.Count)" }
            $actual = @{}
            foreach ($pair in $maps[0].KeyValuePairs) {
              $key = $pair.Item1.Extent.Text.Trim("'", '"')
              if ($actual.ContainsKey($key)) { throw "duplicate exact image target '$key'" }
              $actual[$key] = ConvertTo-AstShape $pair.Item2.Extent.Text
            }
            foreach ($entry in $expected.GetEnumerator()) {
              if (-not $actual.ContainsKey($entry.Key) -or $actual[$entry.Key] -cne (ConvertTo-AstShape $entry.Value)) { throw "exact image target '$($entry.Key)' drifted" }
            }
          }

          function Assert-ExactRequiredSessionStartInventory([System.Management.Automation.Language.ScriptBlockAst]$ast) {
            $expectedPackage = 'github.com/thebtf/engram/internal/grpcserver'
            $expectedNames = @(
              'TestEC_F1_P1_GRPCSessionStart_FlagOff_ByteIdentity',
              'TestEC_F1_P1_GRPCSessionStart_FlagOn_PrivateCrossWorkstationInvisible',
              'TestEC_F1_P1_GRPCSessionStart_FlagOn_NoCallerIdentity_PrivateInvisible',
              'TestGetSessionStartContext_HappyPath',
              'TestGetSessionStartContext_PrincipalPrivateCrossPrincipalInvisible_FlagOff',
              'TestGetSessionStartContext_MetaSummaryFlagOnDescribesMemoryLandscape',
              'TestGetSessionStartContext_MetaSummaryCountsBeyondResponseCap',
              'TestGetSessionStartContext_MetaSummaryFlagOffOmitted',
              'TestGetSessionStartContext_MetaSummaryFlagOnEmptyProjectIsBoundedAndContentFree',
              'TestGetSessionStartContext_T014_MetaSummaryRequiresMasterAndS2Flags',
              'TestGetSessionStartContext_RuleRouterEnabledPacketShape',
              'TestGetSessionStartContext_DefaultLimits'
            )

            $inventoryFunctions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Get-RequiredSessionStartTestNames' }, $true))
            if ($inventoryFunctions.Count -ne 1) { throw "Get-RequiredSessionStartTestNames cardinality must be exactly 1; found $($inventoryFunctions.Count)" }
            $actualNames = @($inventoryFunctions[0].Body.FindAll({ param($node) $node -is [System.Management.Automation.Language.StringConstantExpressionAst] }, $true) | ForEach-Object Value)
            if ($actualNames.Count -ne $expectedNames.Count) { throw "required session-start identity cardinality must be exactly 12; found $($actualNames.Count)" }
            for ($identityIndex = 0; $identityIndex -lt $expectedNames.Count; $identityIndex++) {
              if ([string]$actualNames[$identityIndex] -cne $expectedNames[$identityIndex]) { throw "required session-start identity drifted at index ${identityIndex}: '$([string]$actualNames[$identityIndex])'" }
            }

            $proofFunctions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Get-RequiredSessionStartExecutionProof' }, $true))
            if ($proofFunctions.Count -ne 1) { throw "Get-RequiredSessionStartExecutionProof cardinality must be exactly 1; found $($proofFunctions.Count)" }
            $allPackageAssignments = @($proofFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$package'
            }, $true))
            if ($allPackageAssignments.Count -ne 1) { throw "required session-start package assignment cardinality must be exactly 1; found $($allPackageAssignments.Count)" }
            $packageAssignments = @($proofFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$package' -and
                (ConvertTo-AstShape $node.Right.Extent.Text) -ceq (ConvertTo-AstShape ("'" + $expectedPackage + "'"))
            }, $true))
            if ($packageAssignments.Count -ne 1 -or $packageAssignments[0].Extent.StartOffset -ne $allPackageAssignments[0].Extent.StartOffset) { throw "required session-start package must be assigned exactly once to '$expectedPackage'" }
            $inventoryAssignments = @($proofFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$expectedNames' -and
                (ConvertTo-AstShape $node.Right.Extent.Text) -ceq (ConvertTo-AstShape '@(Get-RequiredSessionStartTestNames)')
            }, $true))
            if ($inventoryAssignments.Count -ne 1) { throw 'execution proof does not consume the pinned required session-start identity inventory exactly once' }

            $consumerLoops = @($proofFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.ForEachStatementAst] -and
                $node.Variable.Extent.Text -ceq '$name' -and
                (ConvertTo-AstShape $node.Condition.Extent.Text) -ceq (ConvertTo-AstShape '$expectedNames')
            }, $true))
            if ($consumerLoops.Count -ne 1) { throw "required session-start consumer loop cardinality must be exactly 1; found $($consumerLoops.Count)" }
            $matchesAssignments = @($proofFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$matches'
            }, $true))
            if ($matchesAssignments.Count -ne 1) { throw "required session-start live matches assignment cardinality must be exactly 1; found $($matchesAssignments.Count)" }
            $liveMatchesAssignment = $consumerLoops[0].Body.Statements[0]
            $expectedMatchesExpression = '@($allTests | Where-Object { [string]$_.package -ceq $package -and [string]$_.test -ceq $name })'
            if ($liveMatchesAssignment -isnot [System.Management.Automation.Language.AssignmentStatementAst] -or
                $liveMatchesAssignment.Left.Extent.Text -cne '$matches' -or
                $liveMatchesAssignment.Extent.StartOffset -ne $matchesAssignments[0].Extent.StartOffset -or
                $packageAssignments[0].Extent.StartOffset -ge $liveMatchesAssignment.Extent.StartOffset -or
                (ConvertTo-AstShape $liveMatchesAssignment.Right.Extent.Text) -cne (ConvertTo-AstShape $expectedMatchesExpression)) {
              throw 'required session-start live consumer does not bind exact case-sensitive package plus test identity at the point of consumption'
            }
          }

          function Get-ExactRuntimeAssignment(
            [System.Management.Automation.Language.ScriptBlockAst]$ast,
            [string]$left,
            [string]$right
          ) {
            $rightShape = ConvertTo-AstShape $right
            $assignments = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
                $node.Left.Extent.Text -ceq $left -and
                (ConvertTo-AstShape $node.Right.Extent.Text) -ceq $rightShape
            }, $true) | Where-Object { $null -eq (Get-Ancestor $_ ([System.Management.Automation.Language.FunctionDefinitionAst])) })
            if ($assignments.Count -ne 1) { throw "live runtime assignment '$left = $right' cardinality must be exactly 1; found $($assignments.Count)" }
            return $assignments[0]
          }

          function Assert-ExactRepeatLoop([System.Management.Automation.Language.Ast]$node) {
            $loop = Get-Ancestor $node ([System.Management.Automation.Language.ForStatementAst])
            if ($null -eq $loop -or
                (ConvertTo-AstShape $loop.Initializer.Extent.Text) -cne (ConvertTo-AstShape '$repeatIndex = 1') -or
                (ConvertTo-AstShape $loop.Condition.Extent.Text) -cne (ConvertTo-AstShape '$repeatIndex -le $Repeat') -or
                (ConvertTo-AstShape $loop.Iterator.Extent.Text) -cne (ConvertTo-AstShape '$repeatIndex++')) {
              throw 'runtime release proof is not inside the exact 1..Repeat execution loop'
            }
          }

          function Assert-LiveSessionStartExecutionContract([System.Management.Automation.Language.ScriptBlockAst]$ast) {
            Assert-ExactRequiredSessionStartInventory $ast
            $nameFunctions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'New-RunDatabaseName' }, $true))
            if ($nameFunctions.Count -ne 1) { throw "New-RunDatabaseName cardinality must be exactly 1; found $($nameFunctions.Count)" }
            $nameAssignments = @($nameFunctions[0].Body.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$name' -and
                (ConvertTo-AstShape $node.Right.Extent.Text) -ceq (ConvertTo-AstShape '"engram_prc_rg_test_${runHash}_r$RepeatIndex"')
            }, $true))
            if ($nameAssignments.Count -ne 1) { throw 'live fresh-database naming does not contain the exact literal-test identity' }

            [void](Get-ExactRuntimeAssignment $ast '$requireSessionStartExecution' "[string]::IsNullOrWhiteSpace(`$Run) -and `$packages.Count -eq 1 -and `$packages[0] -ceq './...'")
            $databaseAssignment = Get-ExactRuntimeAssignment $ast '$databaseName' 'New-RunDatabaseName -RequestedRunId $RunId -RepeatIndex $repeatIndex'
            Assert-ExactRepeatLoop $databaseAssignment
            $databaseCommands = @($databaseAssignment.Right.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'New-RunDatabaseName' }, $true))
            if ($databaseCommands.Count -ne 1) { throw 'fresh-database identity assignment is not one live New-RunDatabaseName invocation' }
            Assert-ExactCommandControlFlow -node $databaseCommands[0] -expectedIfConditions @() -expectedLoopConditions @('for:$repeatIndex -le $Repeat')

            $proofAssignment = Get-ExactRuntimeAssignment $ast '$sessionStartExecutionProof' 'Get-RequiredSessionStartExecutionProof $goTestSummary'
            Assert-ExactRepeatLoop $proofAssignment
            $proofCommands = @($proofAssignment.Right.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'Get-RequiredSessionStartExecutionProof' }, $true))
            if ($proofCommands.Count -ne 1) { throw 'parsed go-test summary is not consumed by one live session-start execution proof invocation' }
            $missingSummaryBranch = '-not (Test-Path -LiteralPath $goTestSummaryPath -PathType Leaf)'
            Assert-ExactCommandControlFlow -node $proofCommands[0] -expectedIfConditions @('$requireSessionStartExecution', "<else:$missingSummaryBranch>") -expectedLoopConditions @('for:$repeatIndex -le $Repeat')

            $proofWrites = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'Write-Utf8NoBom' -and $node.CommandElements.Count -ge 2 -and
                (ConvertTo-AstShape $node.CommandElements[1].Extent.Text) -ceq (ConvertTo-AstShape "(Join-Path `$repeatDirectory 'required-session-start-execution.json')")
            }, $true) | Where-Object { $null -eq (Get-Ancestor $_ ([System.Management.Automation.Language.FunctionDefinitionAst])) })
            if ($proofWrites.Count -ne 1) { throw "required session-start proof artifact write cardinality must be exactly 1; found $($proofWrites.Count)" }
            Assert-ExactRepeatLoop $proofWrites[0]
            Assert-ExactCommandControlFlow -node $proofWrites[0] -expectedIfConditions @('$requireSessionStartExecution') -expectedLoopConditions @('for:$repeatIndex -le $Repeat')

            $verdictIfs = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.IfStatementAst] -and $node.Clauses.Count -eq 1 -and
                (ConvertTo-AstShape $node.Clauses[0].Item1.Extent.Text) -ceq (ConvertTo-AstShape "`$sessionStartExecutionProof.verdict -ne 'PASS'")
            }, $true) | Where-Object { $null -eq (Get-Ancestor $_ ([System.Management.Automation.Language.FunctionDefinitionAst])) })
            if ($verdictIfs.Count -ne 1) { throw "required session-start fail-closed verdict branch cardinality must be exactly 1; found $($verdictIfs.Count)" }
            $verdictIf = $verdictIfs[0]
            Assert-ExactRepeatLoop $verdictIf
            if (-not (Test-InExactIfClause $verdictIf '$requireSessionStartExecution')) { throw 'required session-start fail-closed verdict is outside its canonical runtime gate' }
            $failAssignments = @($verdictIf.Clauses[0].Item2.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$repeatFailed' -and $node.Right.Extent.Text -ceq '$true'
            }, $true))
            $errorAdds = @($verdictIf.Clauses[0].Item2.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and $node.Expression.Extent.Text -ceq '$repeatErrors' -and $node.Member.Extent.Text -ceq 'Add'
            }, $true))
            if ($failAssignments.Count -ne 1 -or $errorAdds.Count -ne 1) { throw 'required session-start proof failure does not fail the repeat and retain one error' }

            $proofSummaryPairs = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.HashtableAst] }, $true) | ForEach-Object { $_.KeyValuePairs } | Where-Object {
              $_.Item1.Extent.Text.Trim("'", '"') -ceq 'required_session_start_execution' -and $_.Item2.Extent.Text -ceq '$sessionStartExecutionProof'
            })
            if ($proofSummaryPairs.Count -ne 1) { throw "repeat summary must bind the live required session-start proof exactly once; found $($proofSummaryPairs.Count)" }
          }

          function Assert-LiveDevStandInvocationContract([string]$dbRunnerText) {
            $ast = Get-PowerShellAst $dbRunnerText
            Assert-ExactImageTargetMap $ast
            Assert-LiveSessionStartExecutionContract $ast
            $outerBranch = "`$Action -in @('Up', 'Ready', 'Scan')"
            $upBranch = "`$Action -eq 'Up'"
            $scanBranch = "`$Action -eq 'Scan' -and `$inventoryAssertion.Pass -and `$imageIdentityPass -and `$prelaunchToRunningImageIdentity"
            $sourceRoot = Get-ExactCapturedInvocation $ast 'dev-stand-source-root' '$gitPath' "@('-C', `$composeDirectory, 'rev-parse', '--show-toplevel')" '$sourceRoot' $outerBranch
            $sourceCommit = Get-ExactCapturedInvocation $ast 'dev-stand-source-commit' '$gitPath' "@('-C', `$sourceRepository, 'rev-parse', '--verify', 'HEAD^{commit}')" '$sourceHead' $outerBranch
            $sourceStatus = Get-ExactCapturedInvocation $ast 'dev-stand-source-tracked-status' '$gitPath' "@('-C', `$sourceRepository, 'status', '--porcelain=v1', '--untracked-files=all')" '$sourceStatus' $outerBranch
            $build = Get-ExactCapturedInvocation $ast 'dev-stand-compose-build' '$dockerPath' "(@(`$composeArgs) + @('build', '--pull', 'server', 'operator-console', 'postgres'))" '$build' $upBranch
            $postHead = Get-ExactCapturedInvocation $ast 'dev-stand-source-commit-post-build' '$gitPath' "@('-C', `$sourceRepository, 'rev-parse', '--verify', 'HEAD^{commit}')" '$postBuildHead' $upBranch
            $postStatus = Get-ExactCapturedInvocation $ast 'dev-stand-source-tracked-status-post-build' '$gitPath' "@('-C', `$sourceRepository, 'status', '--porcelain=v1', '--untracked-files=all')" '$postBuildStatus' $upBranch
            $prelaunch = Get-ExactCapturedInvocation $ast 'dev-stand-prelaunch-image-inspect-$($target.Key)' '$dockerPath' "@('image', 'inspect', `$target.Value, '--format', '{{.Id}}')" '$prelaunchInspect' $upBranch
            $up = Get-ExactCapturedInvocation $ast 'dev-stand-up' '$dockerPath' "(@(`$composeArgs) + @('up', '-d', '--no-build', '--pull', 'never', '--wait'))" '$up' $upBranch
            $scan = Get-ExactCapturedInvocation $ast 'dev-stand-vulnerability-scan-$($entry.Key)' '$dockerPath' "@('scout', 'cves', '--exit-code', '--only-severity', 'critical,high', '--format', 'sarif', '--output', `$sarifPath, `$scanReference)" '$scan' $scanBranch

            foreach ($command in @($sourceRoot, $sourceCommit, $sourceStatus)) {
              Assert-ExactCommandControlFlow -node $command -expectedIfConditions @($outerBranch) -expectedLoopConditions @()
            }
            foreach ($command in @($build, $postHead, $postStatus, $up)) {
              Assert-ExactCommandControlFlow -node $command -expectedIfConditions @($upBranch) -expectedLoopConditions @()
            }
            Assert-ExactCommandControlFlow -node $prelaunch -expectedIfConditions @($upBranch) -expectedLoopConditions @('foreach:(Get-DevStandImageTargets).GetEnumerator()')
            Assert-ExactCommandControlFlow -node $scan -expectedIfConditions @($outerBranch, $scanBranch) -expectedLoopConditions @('foreach:@($actualImages.GetEnumerator() | Sort-Object Key)')

            $capturedInContract = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'Invoke-CapturedProcess' -and $node.CommandElements.Count -ge 4 }, $true) | Where-Object {
              $owner = Get-Ancestor $_ ([System.Management.Automation.Language.FunctionDefinitionAst])
              $null -ne $owner -and $owner.Name -ceq 'Invoke-DevStandContract' -and $_.CommandElements[2].Extent.Text -ceq '$dockerPath'
            })
            $liveBuilds = @($capturedInContract | Where-Object {
              $literals = @($_.CommandElements[3].FindAll({ param($node) $node -is [System.Management.Automation.Language.StringConstantExpressionAst] }, $true) | ForEach-Object Value)
              $literals -ccontains 'build'
            })
            if ($liveBuilds.Count -ne 1 -or $liveBuilds[0].Extent.StartOffset -ne $build.Extent.StartOffset) { throw "live Docker build invocation cardinality must be exactly 1; found $($liveBuilds.Count)" }
            $liveScouts = @($capturedInContract | Where-Object {
              $literals = @($_.CommandElements[3].FindAll({ param($node) $node -is [System.Management.Automation.Language.StringConstantExpressionAst] }, $true) | ForEach-Object Value)
              $literals -ccontains 'scout' -and $literals -ccontains 'cves'
            })
            if ($liveScouts.Count -ne 1 -or $liveScouts[0].Extent.StartOffset -ne $scan.Extent.StartOffset) { throw "live Docker Scout invocation cardinality must be exactly 1; found $($liveScouts.Count)" }

            $ordered = @($sourceRoot, $sourceCommit, $sourceStatus, $build, $postHead, $postStatus, $prelaunch, $up)
            for ($i = 1; $i -lt $ordered.Count; $i++) {
              if ($ordered[$i].Extent.StartOffset -le $ordered[$i - 1].Extent.StartOffset) { throw "live dev-stand invocation order is invalid at '$([string]$ordered[$i].CommandElements[1].Value)'" }
            }

            $targetLoop = Get-Ancestor $prelaunch ([System.Management.Automation.Language.ForEachStatementAst])
            if ($null -eq $targetLoop -or $targetLoop.Variable.Extent.Text -cne '$target' -or (ConvertTo-AstShape $targetLoop.Condition.Extent.Text) -cne (ConvertTo-AstShape '(Get-DevStandImageTargets).GetEnumerator()')) { throw 'prelaunch inspect does not iterate the exact image target map' }
            $scanLoop = Get-Ancestor $scan ([System.Management.Automation.Language.ForEachStatementAst])
            if ($null -eq $scanLoop -or $scanLoop.Variable.Extent.Text -cne '$entry' -or (ConvertTo-AstShape $scanLoop.Condition.Extent.Text) -cne (ConvertTo-AstShape '@($actualImages.GetEnumerator() | Sort-Object Key)')) { throw 'Scout does not iterate the exact running image inventory' }
            $scanReferences = @($scanLoop.Body.FindAll({ param($node) $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -ceq '$scanReference' }, $true))
            if ($scanReferences.Count -ne 1 -or (ConvertTo-AstShape $scanReferences[0].Right.Extent.Text) -cne (ConvertTo-AstShape '"local://$imageId"') -or $scanReferences[0].Extent.StartOffset -ge $scan.Extent.StartOffset) { throw 'Scout reference is not exactly one live immutable local:// image-ID assignment before the scan' }
            $inventoryAssertions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -ceq 'Test-ExactDevStandInventory' }, $true) | Where-Object {
              $owner = Get-Ancestor $_ ([System.Management.Automation.Language.FunctionDefinitionAst])
              $null -ne $owner -and $owner.Name -ceq 'Invoke-DevStandContract'
            })
            if ($inventoryAssertions.Count -ne 1 -or $inventoryAssertions[0].CommandElements.Count -ne 2 -or $inventoryAssertions[0].CommandElements[1].Extent.Text -cne '$actualImages' -or $inventoryAssertions[0].Extent.StartOffset -ge $scan.Extent.StartOffset) { throw 'exact running image inventory assertion must execute exactly once before Scout' }
          }

          function Assert-WorkflowContract(
            [string]$workflowText,
            [string]$criticalText,
            [string]$standText,
            [string]$dbRunnerText,
            [string]$criticalRunnerText,
            [string]$devStandRunnerText,
            [string]$ownershipRunnerText = $ownershipRunner,
            [string]$activeAuthorityRunnerText = $activeAuthorityRunner,
            [string]$nodeRunnerText = $nodeRunner,
            [string]$stateText = $ownershipState,
            [string]$planText = $masterPlan,
            [string]$scopeText = $scopeMap,
            [string]$activeDiffContractsText = $activeDiffContracts
          ) {
            $execution = Remove-ConformanceStep $workflowText
            Assert-LiveDevStandInvocationContract $dbRunnerText
            if ($observedPlanSha -cne $expectedPlanSha) { throw "tracked production-ready plan hash drifted: expected=$expectedPlanSha observed=$observedPlanSha" }
            if ((Get-CanonicalTextSha256 $planText) -cne $expectedPlanSha) { throw 'challenged plan text is not the exact canonical R12 authority' }
            if ($observedScopeMapSha -cne $expectedScopeMapSha -or (Get-CanonicalTextSha256 $scopeText) -cne $expectedScopeMapSha) { throw "tracked R12 scope-map hash drifted: expected=$expectedScopeMapSha observed=$observedScopeMapSha" }
            if ((Get-CanonicalTextSha256 $activeDiffContractsText) -cne $expectedActiveDiffContractSha) { throw 'tracked R12 active-diff contract hash drifted' }
            $repeatToken = '(?i)(?<![A-Za-z0-9_])-Repeat(?:\s+|=)\d+'
            if ($criticalText -match $repeatToken) { throw 'repeat count is duplicated in critical-suite config' }
            if ($execution -match $repeatToken) { throw 'repeat count is duplicated in executable workflow; run-db-suite default is the source of truth' }
            if ($dbRunnerText -notmatch '\[ValidateRange\(1, 20\)\]\[int\]\$Repeat\s*=\s*3\b') { throw 'run-db-suite default Repeat=3 source is missing' }
            foreach ($requiredHttpContract in @('function Test-LivenessStatusPayload', 'function Test-ReadyStatusPayload', 'Get-HttpJsonContractResult -CapturedOutput $http.Stdout -ContractKind $endpoint.contract_kind', "@('starting', 'ready', 'error')")) {
              if (-not $dbRunnerText.Contains($requiredHttpContract)) { throw "dev-stand HTTP liveness/readiness contract is missing '$requiredHttpContract'" }
            }
            foreach ($requiredCredentialContract in @('New-CryptographicSecret', 'Assert-DevStandCredentials $credentials', 'Test-RedactedContainerEnvironment', 'postgres_password = $postgresPassword', 'admin_token = $adminToken', 'bootstrap_capability = $bootstrapCapability', 'dev-stand-postgres-credential-injection', 'dev-stand-server-credential-injection', "@('inspect', `$serverContainer.Stdout.Trim(), '--format', '{{json .Config.Env}}')")) {
              if (-not $dbRunnerText.Contains($requiredCredentialContract)) { throw "dev-stand credential contract is missing '$requiredCredentialContract'" }
            }
            if ($dbRunnerText.Contains('EXPECTED_BOOTSTRAP_CAPABILITY=') -or $dbRunnerText.Contains("'server', 'sh', '-ec'")) { throw 'dev-stand credential proof depends on a shell inside the runtime image' }
            if (-not $standText.Contains('NUXT_OPERATOR_API_TARGET: "http://server:37777"') -or $standText.Contains('NUXT_ENGRAM_API_TARGET:')) { throw 'tracked dev-stand uses the wrong operator-console API target variable' }
            foreach ($requiredProxyProof in @('operator-api-health', 'http://localhost:3001/api/health', 'operator-api-ready', 'http://localhost:3001/api/ready')) {
              if (-not $dbRunnerText.Contains($requiredProxyProof)) { throw "dev-stand runner is missing proxied semantic proof '$requiredProxyProof'" }
            }
            if ($criticalText -notmatch ('(?m)^\s{2}command:\s*"' + [regex]::Escape($trackedCriticalCommand) + '"\s*$')) { throw 'tracked critical runner command drifted' }
            if ($criticalText -notmatch ('(?m)^\s{2}command:\s*"' + [regex]::Escape($trackedDatabaseCommand) + '"\s*$')) { throw 'tracked full fresh-DB runner command drifted' }

            $ledgerStep = Get-StepBody $execution 'Assert tracked production-ready ownership ledger'
            foreach ($required in @('-PrintCanonicalPlanSha256', '$scopeSha = [Convert]::ToHexString', '-Mode Ledger', '-Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md', '-ExpectedPlanSha256 $planSha', '-State .agent/plans/2026-07-10-engram-production-ready-ownership-state.json', '-ScopeMap .agent/plans/2026-07-10-engram-production-ready-scope-map.json', '-ExpectedScopeMapSha256 $scopeSha', '-Artifact .agent/e/rg4/ci-ledger.json')) {
              if (-not $ledgerStep.Contains($required)) { throw "tracked ownership Ledger step is missing '$required'" }
            }
            $activeAuthoritySelfTest = Get-StepBody $execution 'Self-test active candidate path authority gate'
            if (-not $activeAuthoritySelfTest.Contains('assert-active-candidate-path-authority.ps1 -SelfTest')) { throw 'workflow does not self-test active-candidate path authority' }
            $activeAuthorityStep = Get-StepBody $execution 'Assert frozen active candidate path authority'
            foreach ($required in @('-PrintCanonicalContractSha256', '-PrintCanonicalPlanSha256', '-Contract .agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json', '-ExpectedContractSha256 $contractSha', '-Plan .agent/plans/2026-07-10-engram-production-ready-master-plan.md', '-ExpectedPlanSha256 $planSha', '-Artifact .agent/e/rg17/ci-active-candidate-authority.json')) {
              if (-not $activeAuthorityStep.Contains($required)) { throw "tracked active-candidate authority step is missing '$required'" }
            }
            if ($activeAuthorityStep.Contains('production-readiness-evidence-register.json') -or $activeAuthorityStep.Contains('-VerifyAvailableGit') -or $activeAuthorityStep.Contains('-RequireGitObjects')) { throw 'frozen CI authority must not depend on the mutable register or unavailable historical Git objects' }
            $bootstrapProofStep = Get-StepBody $execution 'Assert R12 closed-world plan governance'
            foreach ($required in @('consumed_epochs', 'transition_manifest', 'test-r12-plan-governance.ps1', 'trusted inductive history validation')) {
              if (-not $bootstrapProofStep.Contains($required)) { throw "bootstrap/successor plan-governance router is missing '$required'" }
            }
            foreach ($required in @('authority-successor-selftest:', 'permissions:', 'contents: read', 'persist-credentials: false', './.agent/specs/release-gates-r12/evidence/release-gates/test-r12-authority-maintenance.ps1', '-Artifact $env:RUNNER_TEMP/r12-authority-maintenance.json', 'name: authority-successor-selftest-')) {
              if (-not $execution.Contains($required)) { throw "unprivileged successor self-test is missing '$required'" }
            }
            $pathBudgetSelfTest = Get-StepBody $execution 'Self-test Windows tracked path budget'
            if (-not $pathBudgetSelfTest.Contains('assert-windows-path-budget.ps1 -SelfTest')) { throw 'workflow does not self-test the Windows path-budget gate' }
            $pathBudgetStep = Get-StepBody $execution 'Assert Windows tracked path budget'
            if (-not $pathBudgetStep.Contains("run: $trackedPathBudgetWrapper")) { throw 'workflow does not execute the tracked Windows path-budget gate exactly' }
            foreach ($required in @('Measure-TrackedPathBudget', 'CheckoutPrefixLength = 66', 'MaximumCombinedPathLength = 240', 'git -c core.quotepath=false', 'ls-tree -r --name-only --full-tree')) {
              if (-not $pathBudgetRunner.Contains($required)) { throw "Windows path-budget runner implementation is missing '$required'" }
            }
            $nodeSelfTest = Get-StepBody $execution 'Self-test OpenClaw node release matrix'
            if (-not $nodeSelfTest.Contains('run-node-matrix.ps1 -SelfTest')) { throw 'workflow does not self-test the OpenClaw node release matrix' }

            foreach ($required in @('Get-CanonicalUtf8LfFileSha256', 'PrintCanonicalPlanSha256', 'Test-SameStringSequence', 'Invoke-ScopeContractAudit', 'structural-projection', 'plan row plus state epoch deletion was accepted', 'live register unique slice set differs from the frozen scope map', 'explicitly rejected historical head was accepted as current', 'ordinary same-lane register progress was rejected', 'new live register slice without a refreshed scope map was accepted', "current owner is '`$currentOwner', not '`$Slice'", 'lacks exact rejected-checker evidence', 'must equal rejected predecessor', 'does not descend from predecessor integration')) {
              if (-not $ownershipRunnerText.Contains($required)) { throw "ownership runner implementation is missing '$required'" }
            }
            foreach ($required in @('Invoke-R9ProfileAudit', "freshness = 'HISTORICAL_DISCOVERY_ONLY'", 'used_for_acceptance = $false', 'mutable_register_read = $false', 'authority rejected_r8_head drifted', 'authority r8_scope_provenance_sha256 drifted', 'source_audit use must remain discovery-only and never acceptance authority', 'digest serialization drifted', 'digest path_case drifted', 'missing frozen path was accepted', 'extra frozen path was accepted', "`$wrongOwner.candidates[0].plan_owner = 'NO-PATHS'", 'zero-declaration non-empty candidate did not fail clearly', 'wrong test name was accepted', 'stale evidence namespace was accepted', 'undeclared pending .agent/testing path was accepted', 'explicitly forbidden pending path was accepted', 'prefix-only pending contract serialized a null exact-path declaration', 'prefix-only pending full plan-owned evidence surface failed', 'pending probe accepted or obscured a non-anchor base', 'R9 profile accepted a wrong rejected R8 head', 'R9 profile accepted wrong AB5F scope provenance', 'R9 profile accepted the mutable register as authority', 'R9 profile accepted wrong digest serialization', 'R9 profile accepted wrong digest path-case semantics')) {
              if (-not $activeAuthorityRunnerText.Contains($required)) { throw "active-candidate authority runner is missing '$required'" }
            }
            foreach ($required in @('Test-StrictBoolean', '--untracked-files=all', 'dev-stand-source-commit', 'dev-stand-source-commit-post-build', 'dev-stand-source-tracked-status-post-build', 'dev-stand-compose-build', "@('build', '--pull', 'server', 'operator-console', 'postgres')", 'postgres_build_completed', 'dev-stand-failure-logs', "@('up', '-d', '--no-build', '--pull', 'never', '--wait')", 'source_commit = $sourceCommit', 'source_tracked_clean = $sourceTrackedClean', 'prelaunch_image_ids = $prelaunchImageIds', 'prelaunch_to_running_image_identity = $prelaunchToRunningImageIdentity', 'scanned_reference = $scanReference', '$databaseName = New-RunDatabaseName -RequestedRunId $RunId -RepeatIndex $repeatIndex', 'engram_prc_rg_test_${runHash}_r$RepeatIndex', 'Get-RequiredSessionStartExecutionProof', '$sessionStartExecutionProof = Get-RequiredSessionStartExecutionProof $goTestSummary', 'required-session-start-execution.json', 'required_session_start_execution = $sessionStartExecutionProof')) {
              if (-not $dbRunnerText.Contains($required)) { throw "dev-stand source/build provenance contract is missing '$required'" }
            }
            foreach ($required in @('openclaw-lock-non-ignored', "@('check-ignore', '--no-index', '--quiet'", 'npm pack contains forbidden path', 'dist/index.js', 'dist/index.d.ts', 'scripts/install.sh', 'npm-ci -> npm-typecheck -> npm-test -> npm-audit-high -> npm-pack-dry-run')) {
              if (-not $nodeRunnerText.Contains($required)) { throw "node release runner implementation is missing '$required'" }
            }

            $stateObject = $stateText | ConvertFrom-Json -Depth 100
            if ([string]$stateObject.plan.sha256 -cne $expectedPlanSha) { throw 'ownership state is not bound to the exact challenged plan hash' }
            if ([string]$stateObject.scope_map.path -cne '.agent/plans/2026-07-10-engram-production-ready-scope-map.json' -or [string]$stateObject.scope_map.sha256 -cne $expectedScopeMapSha) { throw 'ownership state is not bound to the exact R12 scope map' }
            $scopeObject = $scopeText | ConvertFrom-Json -Depth 100
            $scopeEntries = @($scopeObject.entries)
            $uniqueScopeSlices = @($scopeEntries.slice | Sort-Object -Unique)
            if ($scopeEntries.Count -ne 69 -or $uniqueScopeSlices.Count -ne 69 -or [int]$scopeObject.register_snapshot.row_count -ne 69 -or [int]$scopeObject.register_snapshot.unique_slice_count -ne 69) { throw 'R12 scope map must preserve the frozen 69/69 structural slice set' }
            $expectedClassifications = @('maker', 'checker-evidence', 'meta-fold', 'historical', 'root-integration')
            if ((@($scopeObject.allowed_classifications) -join "`n") -cne ($expectedClassifications -join "`n")) { throw 'R12 scope-map classifications drifted' }
            $expectedClassificationCounts = [ordered]@{ maker = 58; 'checker-evidence' = 4; 'meta-fold' = 4; historical = 1; 'root-integration' = 2 }
            foreach ($classification in $expectedClassificationCounts.Keys) {
              $observedCount = @($scopeEntries | Where-Object classification -CEQ $classification).Count
              if ($observedCount -ne [int]$expectedClassificationCounts[$classification]) { throw "R12 scope classification '$classification' count drifted: expected=$([int]$expectedClassificationCounts[$classification]) observed=$observedCount" }
            }
            $planRows = @([regex]::Matches($planText, '(?m)^\| ([A-Z0-9][A-Z0-9-]+) \|') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
            foreach ($entry in $scopeEntries) {
              foreach ($owner in @($entry.plan_owners)) {
                if ([string]$owner -cnotin $planRows) { throw "scope slice '$([string]$entry.slice)' points to missing plan owner '$([string]$owner)'" }
              }
            }
            $expectedFolds = [ordered]@{
              'CUSTOMER-MODE' = @('CRITICAL-HARNESS', 'INTEGRATION-RELEASE')
              'MASTER-PLAN' = @('PLAN-GOVERNANCE', 'RELEASE-GATES-CONTROL-PLANE-EVOLVABILITY-R12')
              'OPERATIONS' = @('DEPLOYMENT-ROLLBACK', 'RECOVERY-DATA', 'OBSERVABILITY-OTLP', 'PRIVACY-BOUNDARIES', 'CORE-PUBLIC-TRUTH', 'FINAL-PUBLIC-TRUTH')
              'OPERATOR-CONSOLE' = @('IMAGE-REMEDIATION-R2', 'OC-INTEGRATION')
            }
            foreach ($foldName in $expectedFolds.Keys) {
              $fold = @($scopeEntries | Where-Object slice -CEQ $foldName)
              if ($fold.Count -ne 1 -or [string]$fold[0].classification -cne 'meta-fold' -or (@($fold[0].plan_owners) -join "`n") -cne (@($expectedFolds[$foldName]) -join "`n")) { throw "R12 scope fold '$foldName' drifted" }
            }
            foreach ($path in @('internal/db/gorm/candidate_store.go', 'internal/db/gorm/candidate_store_test.go', 'internal/mcp/tools_bulkops.go', 'internal/mcp/tools_dryrun_test.go')) {
              $epoch = @($stateObject.path_epochs | Where-Object path -CEQ $path)
              if ($epoch.Count -ne 1) { throw "ownership state must contain exactly one rework epoch for '$path'" }
              if ([string]$epoch[0].current_owner -cne 'DB-BULKOPS-BEHAVIORAL-EDGE-REWORK' -or [string]$epoch[0].transition_kind -cne 'rework') { throw "ownership state current owner/transition drifted for '$path'" }
              if ([string]$epoch[0].required_successor_base_sha -cne $rejectedBulkHead) { throw "ownership state rejected-base lock drifted for '$path'" }
              $predecessor = @($epoch[0].completed_predecessors)
              if ($predecessor.Count -ne 1 -or [string]$predecessor[0].owner -cne 'DB-BULKOPS' -or [string]$predecessor[0].checker_verdict -cne 'FAIL' -or [string]$predecessor[0].checker_artifact -cne $rejectedBulkChecker -or [string]$predecessor[0].checker_sha256 -cne $rejectedBulkCheckerSha -or [string]$predecessor[0].rejected_head_sha -cne $rejectedBulkHead -or -not [string]::IsNullOrWhiteSpace([string]$predecessor[0].integration_sha)) {
                throw "ownership state rejected-predecessor evidence drifted for '$path'"
              }
            }

            $trackedCommands = [regex]::Matches($standText, '(?m)^\s+(?:command|readiness_check):\s+"([^"]*run-db-suite\.ps1 -DevStandAction [^"]+)"\s*$')
            if ($trackedCommands.Count -ne 4) { throw "tracked dev-stand contract must declare Up, Ready, Scan, Down exactly once; found $($trackedCommands.Count)" }
            foreach ($match in $trackedCommands) {
              if (-not $devStandRunnerText.Contains($match.Groups[1].Value)) { throw "dev-stand runner does not validate tracked command: $($match.Groups[1].Value)" }
            }

            $database = Get-StepBody $execution 'Run full project through fresh-DB RELEASE-GATES'
            if (-not $database.Contains($trackedDatabaseCommand)) { throw 'full fresh-DB step does not execute the tracked command exactly' }
            if (-not $database.Contains('-PostgresContainer $env:POSTGRES_CONTAINER -PostgresImage pgvector/pgvector:pg17')) { throw 'full fresh-DB step does not bind the proven PostgreSQL 17 service identity' }
            if ($database -match '(?i)(?<![A-Za-z0-9_])-Run\b') { throw 'full fresh-DB step narrows tests with -Run' }
            $packageTokens = [regex]::Matches($database, '(?i)(?<![A-Za-z0-9_])-Package\s+\S+')
            if ($packageTokens.Count -ne 1 -or $packageTokens[0].Value -cne '-Package ./...') { throw 'full fresh-DB step package must be exactly ./...' }

            $criticalStep = Get-StepBody $execution 'Run tracked critical suite runner'
            if (-not $criticalStep.Contains("run: $trackedCriticalWrapper")) { throw 'workflow does not execute the tracked critical wrapper exactly' }
            foreach ($required in @("foreach (`$argument in @('test', '-tags=critical', '-json'))", "foreach (`$argument in @('./tests/critical/...', '-count=1'))", "Invoke-CapturedProcess 'critical-json-parser'", 'assert-go-test-json.ps1', '-FailOnUnexpectedSkip', 'AllowedSkipIdentity')) {
              if (-not $criticalRunnerText.Contains($required)) { throw "critical runner implementation is missing '$required'" }
            }

            $devStandStep = Get-StepBody $execution 'Run tracked dev-stand lifecycle runner'
            if (-not $devStandStep.Contains("run: $trackedDevStandWrapper")) { throw 'workflow does not execute the tracked dev-stand wrapper exactly' }
            foreach ($required in @("foreach (`$action in @('Up', 'Ready', 'Scan'))", 'if ($upAttempted)', "Read-ActionSummary 'Down'", 'residual_resources_zero', 'dev-stand-operator-api-health', 'dev-stand-operator-api-ready', 'Test-StrictBoolean', 'source_commit', 'source_tracked_clean', 'prelaunch_image_ids', 'dev-stand-compose-build', 'postgres_build_completed', 'Scan image ID is not the exact prelaunch/running ID', 'Scan command arguments do not end in the recorded immutable reference')) {
              if (-not $devStandRunnerText.Contains($required)) { throw "dev-stand runner implementation is missing '$required'" }
            }

            $fullStep = Get-StepBody $execution 'Cross-platform tests (DB completeness owned by release gate)'
            $fullArguments = "foreach (`$argument in @('test', '-json', '-covermode=atomic', '-coverprofile=coverage.out', '-count=1', '-timeout=30m'))"
            foreach ($required in @($fullArguments, "`$arguments.Add('./...')", "if (`$env:RUNNER_OS -ne 'Windows') { `$arguments.Add('-race') }", 'assert-go-test-json.ps1', 'exit-summary.json', "db_completeness_owner = 'release-gates-foundation'", "coverage_enforcement_owner = 'release-gates-foundation'", 'fail_on_unexpected_skip = $false')) {
              if (-not $fullStep.Contains($required)) { throw "cross-platform transcript step is missing '$required'" }
            }
            if ($fullStep.Contains('-FailOnUnexpectedSkip') -or $fullStep.Contains('assert-coverage.ps1')) { throw 'cross-platform matrix falsely claims canonical DB zero-skip or coverage enforcement ownership' }
          }

          function Assert-MutationRejected([string]$name, [scriptblock]$assertion) {
            $rejected = $false
            try { & $assertion } catch { $rejected = $true }
            if (-not $rejected) { throw "conformance mutation '$name' was accepted" }
          }

          Assert-WorkflowContract $workflow $critical $stand $dbRunner $criticalRunner $devStandRunner
          $canonicalFixtureRoot = Join-Path $env:RUNNER_TEMP ('plan-authority-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $canonicalFixtureRoot -Force | Out-Null
          try {
            $planText = [System.IO.File]::ReadAllText((Resolve-Path '.agent/plans/2026-07-10-engram-production-ready-master-plan.md'))
            $lfText = ($planText -replace "`r`n", "`n") -replace "`r", "`n"
            $crlfText = $lfText -replace "`n", "`r`n"
            $semanticText = $lfText.Replace('Revision: 12', 'Revision: 13')
            if ($semanticText -ceq $lfText) { throw 'semantic plan mutation fixture did not change the plan' }
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            $lfPath = Join-Path $canonicalFixtureRoot 'plan-lf.md'; [System.IO.File]::WriteAllText($lfPath, $lfText, $utf8NoBom)
            $crlfPath = Join-Path $canonicalFixtureRoot 'plan-crlf.md'; [System.IO.File]::WriteAllText($crlfPath, $crlfText, $utf8NoBom)
            $semanticPath = Join-Path $canonicalFixtureRoot 'plan-semantic.md'; [System.IO.File]::WriteAllText($semanticPath, $semanticText, $utf8NoBom)
            $lfHash = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan $lfPath -PrintCanonicalPlanSha256)).Trim()
            $crlfHash = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan $crlfPath -PrintCanonicalPlanSha256)).Trim()
            $semanticHash = ([string](& pwsh -NoProfile -File scripts/production-gates/assert-plan-path-ownership.ps1 -Plan $semanticPath -PrintCanonicalPlanSha256)).Trim()
            if ($lfHash -cne $expectedPlanSha -or $crlfHash -cne $expectedPlanSha) { throw 'LF/CRLF canonical plan authority hashes diverged' }
            if ($semanticHash -ceq $expectedPlanSha) { throw 'semantic plan mutation preserved the authority hash' }
          }
          finally { Remove-Item -LiteralPath $canonicalFixtureRoot -Recurse -Force -ErrorAction SilentlyContinue }
          foreach ($mutation in @(
            @{ name = 'remove fresh database'; token = '-FreshDatabase' },
            @{ name = 'remove database race'; token = '-Race' },
            @{ name = 'remove skip enforcement'; token = '-FailOnUnexpectedSkip' },
            @{ name = 'remove critical wrapper'; token = $trackedCriticalWrapper },
            @{ name = 'remove dev-stand wrapper'; token = $trackedDevStandWrapper },
            @{ name = 'remove Windows path-budget wrapper'; token = $trackedPathBudgetWrapper },
            @{ name = 'remove active-candidate authority self-test'; token = './scripts/production-gates/assert-active-candidate-path-authority.ps1 -SelfTest' },
            @{ name = 'remove full JSON mode'; token = "'-json'" }
          )) {
            $mutated = $workflow.Replace($mutation.token, '')
            if ($mutated -eq $workflow) { throw "mutation token '$($mutation.token)' was not present" }
            Assert-MutationRejected $mutation.name { Assert-WorkflowContract $mutated $critical $stand $dbRunner $criticalRunner $devStandRunner }
          }
          Assert-MutationRejected 'narrow canonical full package' { Assert-WorkflowContract ($workflow.Replace('-Package ./...', '-Package ./internal/db/gorm')) $critical $stand $dbRunner $criticalRunner $devStandRunner }
          Assert-MutationRejected 'narrow critical package' { Assert-WorkflowContract $workflow ($critical.Replace('./tests/critical/...', './tests/critical/auth/...')) $stand $dbRunner $criticalRunner $devStandRunner }
          Assert-MutationRejected 'remove critical parser execution' { Assert-WorkflowContract $workflow $critical $stand $dbRunner ($criticalRunner.Replace("Invoke-CapturedProcess 'critical-json-parser'", '')) $devStandRunner }
          Assert-MutationRejected 'remove semantic readiness validation' { Assert-WorkflowContract $workflow $critical $stand ($dbRunner.Replace('Get-HttpJsonContractResult -CapturedOutput $http.Stdout -ContractKind $endpoint.contract_kind', '$true')) $criticalRunner $devStandRunner }
          Assert-MutationRejected 'use stale operator target variable' { Assert-WorkflowContract $workflow $critical ($stand.Replace('NUXT_OPERATOR_API_TARGET', 'NUXT_ENGRAM_API_TARGET')) $dbRunner $criticalRunner $devStandRunner }
          Assert-MutationRejected 'remove proxied operator health proof' { Assert-WorkflowContract $workflow $critical $stand ($dbRunner.Replace('http://localhost:3001/api/health', '')) $criticalRunner $devStandRunner }
          Assert-MutationRejected 'remove wrapper proxied operator validation' { Assert-WorkflowContract $workflow $critical $stand $dbRunner $criticalRunner ($devStandRunner.Replace('dev-stand-operator-api-health', '')) }
          Assert-MutationRejected 'remove dev-stand Scan action' { Assert-WorkflowContract $workflow $critical $stand $dbRunner $criticalRunner ($devStandRunner.Replace("@('Up', 'Ready', 'Scan')", "@('Up', 'Ready')")) }
          Assert-MutationRejected 'remove unconditional Down validation' { Assert-WorkflowContract $workflow $critical $stand $dbRunner $criticalRunner ($devStandRunner.Replace("Read-ActionSummary 'Down'", '')) }
          Assert-MutationRejected 'remove prelaunch compose build' { Assert-WorkflowContract $workflow $critical $stand ($dbRunner.Replace("@('build', '--pull', 'server', 'operator-console', 'postgres')", "@('config')")) $criticalRunner $devStandRunner }
          $lateBuildRunner = $dbRunner.Replace("Invoke-CapturedProcess 'dev-stand-compose-build'", "Invoke-CapturedProcess 'dev-stand-compose-build-placeholder'") + "`n# Invoke-CapturedProcess 'dev-stand-compose-build'"
          Assert-MutationRejected 'move prelaunch compose build after launch' { Assert-WorkflowContract $workflow $critical $stand $lateBuildRunner $criticalRunner $devStandRunner }
          $buildLines = @($dbRunner -split "`r?`n" | Where-Object { $_.Contains('$build = Invoke-CapturedProcess ''dev-stand-compose-build''') })
