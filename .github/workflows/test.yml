      - name: Resolve PostgreSQL service identity
        shell: pwsh
        run: |
          $container = docker ps --filter "ancestor=pgvector/pgvector:pg17" --format "{{.ID}}" | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($container)) {
            throw "pgvector/pgvector:pg17 service container was not found"
          }
          "POSTGRES_CONTAINER=$container" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # This is the canonical release gate: three full-project repetitions from
      # the runner default, each with a new PostgreSQL 17 database, race mode,
      # raw JSON parsing, coverage enforcement, session proof, and cleanup.
      - name: Run full project through fresh-DB RELEASE-GATES
        shell: pwsh
        run: pwsh -NoProfile -File scripts/production-gates/run-db-suite.ps1 -FreshDatabase -Package ./... -Race -FailOnUnexpectedSkip -PostgresContainer $env:POSTGRES_CONTAINER -PostgresImage pgvector/pgvector:pg17

      - name: Run tracked critical suite runner
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/production-gates/run-critical-suite.ps1 -Config .agent/critical-suite.config.yaml

      - name: Run tracked dev-stand lifecycle runner
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/production-gates/run-dev-stand.ps1 -Config .agent/dev-stand.config.yaml

      - name: Upload RELEASE-GATES evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gates-foundation
          path: |
            .agent/reports/evidence/production-ready/release-gates-foundation/
            .agent/e/rg4/
          if-no-files-found: error

  authority-successor-selftest:
    name: authority guard / unprivileged successor self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate as unprivileged data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Parse candidate validators and reject privileged workflow drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $validatorPaths = @(
            'scripts/production-gates/assert-plan-path-ownership.ps1',
            'scripts/production-gates/assert-active-candidate-path-authority.ps1',
            'scripts/production-gates/assert-pr-authority-guard.ps1',
            'scripts/production-gates/assert-pr-authority-maintenance.ps1'
          )
          foreach ($path in $validatorPaths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "candidate validator '$path' has parse errors: $($errors.Message -join '; ')" }
          }
          $guard = Get-Content -LiteralPath '.github/workflows/authority-guard.yml' -Raw
          $validatorText = (Get-Content -LiteralPath 'scripts/production-gates/assert-pr-authority-guard.ps1' -Raw) + "`n" + (Get-Content -LiteralPath 'scripts/production-gates/assert-pr-authority-maintenance.ps1' -Raw)
          if (-not $guard.Contains('pull_request_target:') -or -not $guard.Contains('contents: read')) { throw 'authority guard lost trusted-base trigger or least privilege' }
          if ($guard -match '(?m)^\s*-\s+(?:name:\s*)?Checkout\b' -or $guard -match 'actions/checkout@') { throw 'privileged authority workflow must never checkout candidate bytes' }
          foreach ($required in @('Export-TrustedValidator', 'cat-file', 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02')) {
            if (-not $guard.Contains($required)) { throw "authority guard is missing '$required'" }
          }
          foreach ($required in @('treated_as_data_only', 'executed=$false', 'checked_out=$false')) {
            if (-not $validatorText.Contains($required)) { throw "candidate validators are missing '$required'" }
          }

      - name: Execute candidate self-tests without secrets
        shell: pwsh
        run: |
          ./scripts/production-gates/assert-plan-path-ownership.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/production-gates/assert-active-candidate-path-authority.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $contract = Get-Content -LiteralPath '.agent/plans/2026-07-10-engram-production-ready-active-diff-contracts.json' -Raw | ConvertFrom-Json -Depth 100
          if (@($contract.control_plane_maintenance.consumed_epochs).Count -eq 0 -and $null -eq $contract.control_plane_maintenance.transition_manifest) {
            ./.agent/specs/release-gates-r12/evidence/plan-governance/test-r12-plan-governance.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./.agent/specs/release-gates-r12/evidence/release-gates/test-r12-authority-maintenance.ps1 `
            -Artifact $env:RUNNER_TEMP/r12-authority-maintenance.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unprivileged successor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authority-successor-selftest-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/r12-authority-maintenance.json
          if-no-files-found: error
          retention-days: 30

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Operator console parity + build
        if: runner.os == 'Linux'
        working-directory: apps/operator-console
        run: |
          npm ci
          npm run parity
          npm run test:seam
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Vet
        run: go vet ./...

      # This matrix proves portable build/test behavior. Database-backed
      # completeness, zero unexpected skips, and coverage enforcement are
      # owned by the isolated PostgreSQL release gate above. The matrix still
      # captures a coverage profile on every OS, but does not treat a
      # no-database profile as release coverage.
      - name: Cross-platform tests (DB completeness owned by release gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = '.agent/reports/evidence/production-ready/release-gates-foundation/full-matrix'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          $stdout = Join-Path $artifact 'go-test.stdout.jsonl'
          $stderr = Join-Path $artifact 'go-test.stderr.log'
          $arguments = [System.Collections.Generic.List[string]]::new()
          foreach ($argument in @('test', '-json', '-covermode=atomic', '-coverprofile=coverage.out', '-count=1', '-timeout=30m')) { $arguments.Add($argument) }
          if ($env:RUNNER_OS -ne 'Windows') { $arguments.Add('-race') }
          $arguments.Add('./...')
          $go = (Get-Command go -ErrorAction Stop).Source
          $process = Start-Process -FilePath $go `
            -ArgumentList @($arguments) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $goExit = $process.ExitCode
          ./scripts/production-gates/assert-go-test-json.ps1 `
            -InputPath $stdout `
            -SummaryPath (Join-Path $artifact 'go-test-summary.json')
          $parserExit = $LASTEXITCODE
          [System.IO.File]::WriteAllText(
            (Join-Path $artifact 'exit-summary.json'),
            (([ordered]@{ go_test_exit = $goExit; json_parser_exit = $parserExit; race = $env:RUNNER_OS -ne 'Windows'; db_completeness_owner = 'release-gates-foundation'; coverage_enforcement_owner = 'release-gates-foundation'; fail_on_unexpected_skip = $false } | ConvertTo-Json) + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          if ($goExit -ne 0 -or $parserExit -ne 0) { exit 1 }

      - name: Upload cross-platform test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-platform-tests-${{ matrix.os }}
          path: |
            coverage.out
            .agent/reports/evidence/production-ready/release-gates-foundation/full-matrix/
          if-no-files-found: error

      # Safety-gate self-check (T007, v5 cleanup).
      #
      # Validates the scripts/safety-gate.* toolchain that every cleanup PR MUST
      # pass before merging. CI cannot reach the LAN production vault endpoint
      # (`http://unleashed.lan:37777`), so this step only validates the scripts
      # themselves — NOT production invariants. Live invariant verification is
      # operator-only and runs manually on the Unraid host before merging
      # critical PRs (US3 in particular).
      #
      # What this step verifies:
      #   1. scripts/safety-gate-baseline.json is syntactically valid JSON
      #   2. On Linux/macOS: bash scripts/safety-gate_test.sh passes (5 mock tests)
      #   3. On Windows: pwsh scripts/safety-gate.ps1 -Help parses + exits 0
      #
      # What this step does NOT do:
      #   - Hit /api/vault/status (unreachable from CI)
      #   - docker exec on Unraid Postgres (no docker socket)
      #   - Compare against live entity counts
      - name: Safety gate self-check (scripts integrity)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Validate baseline JSON ==="
          if command -v jq >/dev/null 2>&1; then
            jq . scripts/safety-gate-baseline.json > /dev/null
          else
            python -c 'import json,sys; json.load(open("scripts/safety-gate-baseline.json"))'
          fi
          echo "baseline JSON: OK"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "=== Windows: pwsh -Help smoke ==="
            pwsh -NoProfile -File scripts/safety-gate.ps1 -Help
            echo "safety-gate.ps1: help output OK"
          else
            echo "=== Linux/macOS: bash safety-gate_test.sh ==="
            bash scripts/safety-gate_test.sh
            echo "safety-gate_test.sh: all tests passed"
          fi
