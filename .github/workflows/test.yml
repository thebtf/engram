          $renamedDuplicateScoutLine = $scanLine.Replace('dev-stand-vulnerability-scan-$($entry.Key)', 'dev-stand-vulnerability-scan-shadow-$($entry.Key)')
          $renamedDuplicateScoutRunner = $dbRunner.Replace($scanLine, ($scanLine + "`n" + $renamedDuplicateScoutLine))
          Assert-MutationRejected 'renamed duplicate live Scout invocation' { Assert-WorkflowContract $workflow $critical $stand $renamedDuplicateScoutRunner $criticalRunner $devStandRunner }
          $databaseLines = @($dbRunner -split "`r?`n" | Where-Object { $_.Contains('$databaseName = New-RunDatabaseName -RequestedRunId $RunId -RepeatIndex $repeatIndex') })
          if ($databaseLines.Count -ne 1) { throw "canonical fresh-database assignment fixture must resolve exactly one line; found $($databaseLines.Count)" }
          $databaseLine = $databaseLines[0]
          $databaseIndent = [regex]::Match($databaseLine, '^\s*').Value
