name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verification source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/operator-console/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          readonly trivy_archive='trivy_0.72.0_Linux-64bit.tar.gz'
          readonly trivy_url='https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz'
          readonly trivy_sha256='bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea'
          readonly trivy_tmp="${RUNNER_TEMP}/trivy"
          readonly trivy_bin="${RUNNER_TEMP}/engram-tools"
          mkdir -p "$trivy_tmp" "$trivy_bin"
          curl --fail --location --silent --show-error "$trivy_url" --output "$trivy_tmp/$trivy_archive"
          printf '%s  %s\n' "$trivy_sha256" "$trivy_tmp/$trivy_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$trivy_tmp/$trivy_archive" --directory "$trivy_tmp"
          install --mode 0755 "$trivy_tmp/trivy" "$trivy_bin/trivy"
          printf '%s\n' "$trivy_bin" >> "$GITHUB_PATH"
          "$trivy_bin/trivy" --version

      - name: Build, scan, and exercise exact images without registry authority
        shell: pwsh
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
          EVIDENCE_ROOT: .agent/reports/evidence/production-ready/image-remediation-r2/workflow-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pwsh ./scripts/production-gates/build-and-scan-images.ps1 `
            -Mode BuildAndScan `
            -ServerTag engram:r2-server `
            -OperatorTag engram:r2-operator-console `
            -PostgresTag engram:r2-postgres `
            -Platform linux/amd64 `
            -ArtifactRoot $env:EVIDENCE_ROOT `
            -Version $env:IMAGE_VERSION `
            -NoAllowlist

      - name: Upload unprivileged verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent/reports/evidence/production-ready/image-remediation-r2/workflow-verify-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
