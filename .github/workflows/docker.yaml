name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verification source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/operator-console/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install pinned Docker Scout CLI
        shell: bash
        env:
          DOCKER_SCOUT_LINUX_AMD64_SHA256: "0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/docker-scout_1.23.1_linux_amd64.tar.gz"
          binary="$RUNNER_TEMP/docker-scout"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/scout-cli/releases/download/v1.23.1/docker-scout_1.23.1_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$DOCKER_SCOUT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" docker-scout
          install --directory --mode 0755 "$HOME/.docker/cli-plugins"
          install --mode 0755 "$binary" "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version

      - name: Build, scan, and exercise exact images without registry authority
        shell: pwsh
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
          EVIDENCE_ROOT: .agent/reports/evidence/production-ready/image-remediation-r2/workflow-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pwsh ./scripts/production-gates/build-and-scan-images.ps1 `
            -Mode BuildAndScan `
            -ServerTag engram:r2-server `
            -OperatorTag engram:r2-operator-console `
            -PostgresTag engram:r2-postgres `
            -Platform linux/amd64 `
            -ArtifactRoot $env:EVIDENCE_ROOT `
            -Version $env:IMAGE_VERSION `
            -NoAllowlist

      - name: Upload unprivileged verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent/reports/evidence/production-ready/image-remediation-r2/workflow-verify-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
