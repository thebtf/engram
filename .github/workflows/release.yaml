# The sole tag-triggered writer for Engram server archives and raw launcher clients.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25.9
    steps:
      - name: Install git-lfs
        run: apt-get update && apt-get install -y git-lfs curl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch tags
        run: |
          git config --global --add safe.directory /__w/engram/engram
          git fetch --force --tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Test plugin scripts
        run: node --test --test-concurrency=1 plugin/engram/hooks/*.test.js plugin/engram/scripts/*.test.js
        env:
          ENGRAM_TOKEN: release-test-keycard

      # This is intentionally a check: the integrated release commit must carry
      # tuples generated from its exact client source before a tag can publish.
      - name: Verify committed launcher policy
        run: scripts/prepare-bootstrap-policy.sh --version "${GITHUB_REF_NAME#v}" --check

      - name: Build split release artifacts
        run: goreleaser release --clean --split
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate raw clients against committed policy
        run: scripts/check-bootstrap-policy-artifacts.sh --policy plugin/engram/bootstrap-targets.json --dist dist

      # continue --merge consumes the checked split artifacts; it does not rebuild.
      - name: Archive sign and publish checked artifacts
        run: goreleaser continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read published launcher assets back
        run: scripts/readback-bootstrap-policy-assets.sh --policy plugin/engram/bootstrap-targets.json --tag "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
