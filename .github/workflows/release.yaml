# The sole tag-triggered writer for Engram server archives and raw launcher clients.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit on the dispatch branch to preflight
        required: true
        type: string

jobs:
  archive-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25.9
    steps:
      - name: Install archive check tools
        run: apt-get update && apt-get install -y git-lfs unzip

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Verify dispatch commit and source version
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'candidate_sha must be an exact 40-character SHA' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" && "$CANDIDATE_SHA" == "$GITHUB_SHA" ]] || { echo 'candidate SHA must equal checked-out HEAD and dispatch branch HEAD' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['plugin/engram/package.json', 'plugin/engram/.claude-plugin/plugin.json', 'plugin/engram/.codex-plugin/plugin.json', 'plugin/engram/.omp-plugin/plugin.json']) {
            if (JSON.parse(fs.readFileSync(file, 'utf8')).version !== '6.49.4') throw new Error(`unexpected source version: ${file}`);
          }
          if (!/^var Daemon = "v6\.49\.4"$/m.test(fs.readFileSync('internal/version/version.go', 'utf8'))) throw new Error('unexpected daemon source version');
          NODE

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify committed launcher policy
        run: scripts/prepare-bootstrap-policy.sh --version 6.49.4 --check

      - name: Build unpublished snapshot from release config
        shell: bash
        run: |
          set -euo pipefail
          config="$(mktemp --suffix=.yaml)"
          trap 'rm -f "$config"' EXIT
          cat .goreleaser.yaml > "$config"
          printf '\nsnapshot:\n  version_template: "6.49.4"\n' >> "$config"
          goreleaser release --snapshot --skip=sign --clean --config "$config"

      - name: Gate raw clients against committed policy
        run: scripts/check-bootstrap-policy-artifacts.sh --policy plugin/engram/bootstrap-targets.json --dist dist

      - name: Gate server-plugin archives against candidate OMP payload
        run: scripts/check-server-plugin-artifacts.sh --version 6.49.4 --dist dist

      - name: List verified artifact hashes
        run: find dist -maxdepth 2 -type f -print0 | sort -z | xargs -0 -r sha256sum

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25.9
    steps:
      - name: Install release tools
        run: apt-get update && apt-get install -y git-lfs curl unzip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch tags
        run: |
          git config --global --add safe.directory /__w/engram/engram
          git fetch --force --tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Test plugin scripts
        run: node --test --test-concurrency=1 plugin/engram/hooks/*.test.js plugin/engram/scripts/*.test.js plugin/engram/extensions/*.test.mjs scripts/*.test.js
        env:
          ENGRAM_TOKEN: release-test-keycard

      # This is intentionally a check: the integrated release commit must carry
      # tuples generated from its exact client source before a tag can publish.
      - name: Verify committed launcher policy
        run: scripts/prepare-bootstrap-policy.sh --version "${GITHUB_REF_NAME#v}" --check

      # GoReleaser OSS has no split/continue gate. Upload into a private draft,
      # verify the exact bytes locally and through GitHub readback, then publish.
      - name: Build sign and upload draft release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate raw clients against committed policy
        run: scripts/check-bootstrap-policy-artifacts.sh --policy plugin/engram/bootstrap-targets.json --dist dist

      - name: Gate server-plugin archives against tagged OMP payload
        run: scripts/check-server-plugin-artifacts.sh --version "${GITHUB_REF_NAME#v}" --dist dist

      - name: Read draft launcher assets back
        run: scripts/readback-bootstrap-policy-assets.sh --policy plugin/engram/bootstrap-targets.json --tag "${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(mktemp)"
          published="$(mktemp)"
          trap 'rm -f "$release" "$published"' EXIT
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/thebtf/engram/releases?per_page=100" > "$release"
          release_id="$(node scripts/verify-bootstrap-release-assets.js plugin/engram/bootstrap-targets.json "$release" "$GITHUB_REF_NAME")"
          curl --fail --silent --show-error --location \
            -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/thebtf/engram/releases/${release_id}" \
            --data '{"draft":false}' > "$published"
          node - "$published" "$GITHUB_REF_NAME" <<'NODE'
          const fs = require('node:fs');
          const [path, tag] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (release.tag_name !== tag || release.draft !== false) {
            throw new Error('verified draft was not published');
          }
          NODE
