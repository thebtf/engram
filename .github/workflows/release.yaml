# Build and publish a GitHub release using GoReleaser.
#
# Triggered by version tags (v*) and manual workflow_dispatch.
# Uses the goreleaser-cross container so CGO builds work for all
# published platform targets without a separate cross-compilation setup.
#
# Job names and step names are referenced by branch protection rules and
# release automation — do not rename without updating those dependencies.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      # goreleaser-cross bundles the CGO toolchains for all supported targets.
      # The nearest published 1.25.x image provides the cross toolchains; the
      # exact Go compiler version comes from actions/setup-go and go.mod below.
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25.9
    steps:
      - name: Install git-lfs
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch tags
        run: |
          git config --global --add safe.directory /__w/engram/engram
          git fetch --force --tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
