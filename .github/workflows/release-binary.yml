name: Release Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build engram binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build -ldflags "-X main.Version=${VERSION} -X github.com/thebtf/engram/internal/version.Daemon=${VERSION} -s -w" \
            -o engram-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/engram
          if [ "${{ matrix.goos }}" = "linux" ]; then
            version_output="$(./engram-${{ matrix.suffix }} --version)"
            case "$version_output" in
              *"$VERSION"*) ;;
              *) echo "version output did not include ${VERSION}: ${version_output}" >&2; exit 1 ;;
            esac

            init_request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            init_output="$(printf '%s\n' "$init_request" | ENGRAM_DATA_DIR="${RUNNER_TEMP}/engram-release-smoke" timeout 20s ./engram-${{ matrix.suffix }} || true)"
            case "$init_output" in
              *"\"serverInfo\""*"\"version\":\"${VERSION}\""*) ;;
              *) echo "initialize serverInfo.version did not include ${VERSION}: ${init_output}" >&2; exit 1 ;;
            esac
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: engram-${{ matrix.suffix }}${{ matrix.ext }}
