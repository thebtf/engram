name: Sync Plugin Marketplace

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release Binary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, tag, or SHA to sync"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engram
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          repository: thebtf/engram-marketplace
          token: ${{ secrets.MARKETPLACE_PAT }}
          path: marketplace
          # persist-credentials must remain true (default) so the PAT is
          # available for the git push inside the Sync step.

      - name: Sync plugin files
        run: |
          rm -rf marketplace/engram
          cp -r plugin/engram marketplace/engram
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            VERSION=$(jq -r .version engram/.claude-plugin/plugin.json)
            git commit -m "chore: sync engram plugin to v${VERSION}"
            git push origin main
          fi
