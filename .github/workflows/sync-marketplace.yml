name: Sync Plugin Marketplace

on:
  # Release is the reliable post-publication authority. release:published stays
  # redundant for manually published releases, never as the only trigger.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Published v* tag to sync
        required: true

permissions:
  contents: read

concurrency:
  group: sync-marketplace
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published Release provenance
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # A completed Release workflow supplies its exact tag head; no ambient ref.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify published Release provenance
        env:
          TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch || github.event.inputs.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version plugin/engram/.claude-plugin/plugin.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = null ]; then
            echo "::error::version missing in plugin/engram/.claude-plugin/plugin.json"
            exit 1
          fi
          case "$TAG" in "v$VERSION") ;; *) echo "Sync tag must exactly match the canonical plugin version: v$VERSION" >&2; exit 1 ;; esac
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          if [ -n "$HEAD_SHA" ]; then test "$HEAD_SHA" = "$TAG_SHA"; fi
          release="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" '.tag_name == $tag and (.draft | not)' <<<"$release" >/dev/null

      - name: Checkout trusted package validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-validator
          persist-credentials: false

      # Candidate package files are data; only the workflow-definition commit's
      # validator executes before any marketplace credential exists.
      - name: Validate plugin package before marketplace access
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version plugin/engram/.claude-plugin/plugin.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = null ]; then
            echo "::error::version missing in plugin/engram/.claude-plugin/plugin.json"
            exit 1
          fi
          node trusted-validator/plugin/engram/scripts/bootstrap-policy.js validate plugin/engram/bootstrap-targets.json "$VERSION"
          OMP_MANIFEST="plugin/engram/.omp-plugin/plugin.json"
          if [ ! -f "$OMP_MANIFEST" ]; then
            echo "::error::OMP plugin manifest missing: $OMP_MANIFEST"
            exit 1
          fi
          OMP_VERSION="$(jq -r .version "$OMP_MANIFEST")"
          if [ -z "$OMP_VERSION" ] || [ "$OMP_VERSION" = null ]; then
            echo "::error::version missing in $OMP_MANIFEST"
            exit 1
          fi
          if [ "$OMP_VERSION" != "$VERSION" ]; then
            echo "::error::OMP plugin manifest version must exactly match the canonical plugin version: $VERSION"
            exit 1
          fi

      - name: Checkout marketplace
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: thebtf/engram-marketplace
          token: ${{ secrets.MARKETPLACE_PAT }}
          path: marketplace

      - name: Sync plugin files
        run: |
          set -euo pipefail
          rm -rf marketplace/engram marketplace/plugins/engram \
            marketplace/.agents/plugins/marketplace.json \
            marketplace/.claude-plugin/marketplace.json \
            marketplace/.omp-plugin/marketplace.json
          rm -f marketplace/marketplace.json
          mkdir -p marketplace/plugins marketplace/.agents/plugins \
            marketplace/.claude-plugin marketplace/.omp-plugin
          VERSION="$(jq -r .version plugin/engram/.claude-plugin/plugin.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = null ]; then
            echo "::error::version missing in plugin/engram/.claude-plugin/plugin.json"
            exit 1
          fi
          cp -r plugin/engram marketplace/engram
          cp -r plugin/engram marketplace/plugins/engram
          cmp plugin/engram/bootstrap-targets.json marketplace/engram/bootstrap-targets.json
          cmp plugin/engram/bootstrap-targets.json marketplace/plugins/engram/bootstrap-targets.json
          cmp plugin/engram/.omp-plugin/plugin.json marketplace/engram/.omp-plugin/plugin.json
          cmp plugin/engram/.omp-plugin/plugin.json marketplace/plugins/engram/.omp-plugin/plugin.json
          jq --arg version "$VERSION" '
            .version = $version
            | .plugins |= map(.version = $version | .source = "./engram")
          ' .claude-plugin/marketplace.json > marketplace/.claude-plugin/marketplace.json
          cp marketplace/.claude-plugin/marketplace.json marketplace/.omp-plugin/marketplace.json
          cat > marketplace/.agents/plugins/marketplace.json <<'JSON'
          {
            "name": "engram-marketplace",
            "interface": { "displayName": "Engram Marketplace" },
            "plugins": [{
              "name": "engram",
              "source": { "source": "local", "path": "./plugins/engram" },
              "policy": { "installation": "AVAILABLE", "authentication": "ON_INSTALL" },
              "category": "Development"
            }]
          }
          JSON
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync engram plugin to v${VERSION}"
            git push origin main
          fi
