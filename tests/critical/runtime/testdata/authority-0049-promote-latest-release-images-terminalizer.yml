name: Promote Latest Release Images
on:
  repository_dispatch:
    types: [promote-latest-release-images]
  workflow_run:
    workflows: ["Release", "Docker Publish"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: engram-latest-release-images
  cancel-in-progress: false
jobs:
  promote-latest:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.name == 'Release' && github.event.workflow_run.event == 'push') || (github.event.workflow_run.name == 'Docker Publish' && github.event.workflow_run.event == 'workflow_run')))
    permissions:
      contents: read
      actions: read
      checks: write
      packages: write
    env:
      REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Initialize isolated promotion paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerConfig = Join-Path $env:RUNNER_TEMP "engram-latest-promotion-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $receiptDir = Join-Path $env:RUNNER_TEMP "engram-latest-promotion-receipt-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "DOCKER_CONFIG=$dockerConfig" | Add-Content -LiteralPath $env:GITHUB_ENV
          "RECEIPT_DIR=$receiptDir" | Add-Content -LiteralPath $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $receiptDir -Force | Out-Null
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve the official GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGERING_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $triggeringWorkflowName = $env:GITHUB_EVENT_NAME
          $triggeringWorkflowHeadSHA = $null
          $triggeringWorkflowRunID = $null
          $triggeringWorkflowJobConclusion = $null
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $triggeringWorkflowName = ([string]$env:TRIGGERING_WORKFLOW_NAME).Trim()
            $triggeringWorkflowHeadSHA = ([string]$env:TRIGGERING_WORKFLOW_HEAD_SHA).Trim()
            $triggeringWorkflowRunID = ([string]$env:TRIGGERING_WORKFLOW_RUN_ID).Trim()
            if ([string]::IsNullOrWhiteSpace($triggeringWorkflowName) -or $triggeringWorkflowHeadSHA -notmatch '^[0-9a-f]{40}$' -or $triggeringWorkflowRunID -notmatch '^[1-9][0-9]*$') {
              throw "workflow_run did not provide a valid triggering workflow name, head SHA, and run ID: name=$triggeringWorkflowName head=$triggeringWorkflowHeadSHA run=$triggeringWorkflowRunID"
            }
            if ($triggeringWorkflowName -eq 'Docker Publish') {
              $jobPages = gh api --paginate --slurp "repos/$env:REPOSITORY_NAME/actions/runs/$triggeringWorkflowRunID/jobs?per_page=100"
              if ($LASTEXITCODE -ne 0) { throw "could not query jobs for triggering Docker Publish run: $triggeringWorkflowRunID" }
              $publishJobs = @($jobPages | ConvertFrom-Json | ForEach-Object { $_.jobs } | Where-Object { $_.name -ceq 'publish-images' })
              if ($publishJobs.Count -ne 1) { throw "triggering Docker Publish run must contain exactly one publish-images job: run=$triggeringWorkflowRunID count=$($publishJobs.Count)" }
              $publishJob = $publishJobs[0]
              if ([string]$publishJob.run_id -cne $triggeringWorkflowRunID -or [string]$publishJob.status -cne 'completed' -or [string]$publishJob.conclusion -cne 'success') {
                throw "triggering Docker Publish publish-images job was not completed successfully: run=$triggeringWorkflowRunID job_run=$($publishJob.run_id) status=$($publishJob.status) conclusion=$($publishJob.conclusion)"
              }
              $triggeringWorkflowJobConclusion = [string]$publishJob.conclusion
            }
          } elseif ($env:GITHUB_EVENT_NAME -cne 'repository_dispatch') {
            throw "unsupported event: $env:GITHUB_EVENT_NAME"
          }
          $tag = (gh api "repos/$env:REPOSITORY_NAME/releases/latest" --jq .tag_name).Trim()
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "official GitHub Release tag is not a stable version: $tag"
          }
          $commit = (gh api "repos/$env:REPOSITORY_NAME/commits/$tag" --jq .sha).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw "official GitHub Release does not resolve to a commit: $commit"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run' -and $commit -cne $triggeringWorkflowHeadSHA) {
            throw "latest GitHub Release commit does not match triggering workflow_run head: release=$commit event=$triggeringWorkflowHeadSHA"
          }
          [ordered]@{
            triggering_event = $env:GITHUB_EVENT_NAME
            release_tag = $tag
            source_commit = $commit
            triggering_workflow_name = $triggeringWorkflowName
            triggering_workflow_head_sha = $triggeringWorkflowHeadSHA
            triggering_workflow_run_id = $triggeringWorkflowRunID
            triggering_workflow_job_conclusion = $triggeringWorkflowJobConclusion
          } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'release.json') -Encoding utf8NoBOM

      - name: Wait for all public immutable release images before login
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $release = Get-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'release.json') -Raw | ConvertFrom-Json
          $maxAttempts = 6
          $retrySeconds = 10

          function Get-Label {
            param([Parameter(Mandatory)]$Labels, [Parameter(Mandatory)][string]$Name)
            $property = $Labels.PSObject.Properties[$Name]
            if ($null -eq $property) { return '' }
            return [string]$property.Value
          }

          function Get-ImageIdentity {
            param([Parameter(Mandatory)][string]$Reference)
            $manifest = docker buildx imagetools inspect $Reference --format '{{json .Manifest}}' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect manifest for $Reference" }
            $raw = docker buildx imagetools inspect $Reference --raw | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect raw manifest for $Reference" }
            $image = docker buildx imagetools inspect $Reference --format '{{json .Image}}' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect image configuration for $Reference" }
            $manifestDigest = [string]$manifest.digest
            $configDigest = [string]$raw.config.digest
            $source = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.source'
            $version = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.version'
            $revision = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.revision'
            if ($manifestDigest -notmatch '^sha256:[0-9a-f]{64}$' -or $configDigest -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "immutable image does not expose manifest/config identities: $Reference"
            }
            if ($source -cne 'https://github.com/thebtf/engram' -or $version -cne $release.release_tag -or $revision -cne $release.source_commit) {
              throw "immutable image provenance labels do not match the official release: $Reference"
            }
            $repository = $Reference.Substring(0, $Reference.LastIndexOf(':'))
            return [ordered]@{
              reference = $Reference
              repository = $repository
              immutable_reference = "$repository@$manifestDigest"
              manifest_digest = $manifestDigest
              config_digest = $configDigest
              source = $source
              version = $version
              revision = $revision
            }
          }

          $repositories = @(
            'ghcr.io/thebtf/engram',
            'ghcr.io/thebtf/engram-operator-console',
            'ghcr.io/thebtf/engram-postgres'
          )
          $sources = foreach ($repository in $repositories) {
            $versionReference = "$repository`:$($release.release_tag)"
            $commitReference = "$repository`:sha-$($release.source_commit)"
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                $versionIdentity = Get-ImageIdentity -Reference $versionReference
                $commitIdentity = Get-ImageIdentity -Reference $commitReference
                foreach ($field in 'manifest_digest', 'config_digest') {
                  if ([string]$versionIdentity.$field -cne [string]$commitIdentity.$field) {
                    throw "release image references disagree: $versionReference $commitReference $field"
                  }
                }
                $identity = [ordered]@{
                  reference = $versionIdentity.reference
                  repository = $versionIdentity.repository
                  immutable_reference = $versionIdentity.immutable_reference
                  commit_reference = $commitIdentity.reference
                  manifest_digest = $versionIdentity.manifest_digest
                  config_digest = $versionIdentity.config_digest
                  source = $versionIdentity.source
                  version = $versionIdentity.version
                  revision = $versionIdentity.revision
                }
                break
              } catch {
                if ($attempt -eq $maxAttempts) { throw "official release images remained unavailable or inconsistent after $maxAttempts attempts: $versionReference $commitReference. $($_.Exception.Message)" }
                Start-Sleep -Seconds $retrySeconds
              }
            }
            $identity
          }
          [ordered]@{ release_tag = $release.release_tag; source_commit = $release.source_commit; images = @($sources) } |
            ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'sources.json') -Encoding utf8NoBOM

      - name: Final revalidate official GitHub Release before registry login
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $release = Get-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'release.json') -Raw | ConvertFrom-Json
          $prewrite = [ordered]@{
            status = 'started'
            expected_release_tag = [string]$release.release_tag
            expected_source_commit = [string]$release.source_commit
            observed_release_tag = $null
            observed_source_commit = $null
            failure = $null
          }
          function Write-PrewriteRevalidation {
            $prewrite |
              ConvertTo-Json -Depth 4 |
              Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'prewrite-release-revalidation.json') -Encoding utf8NoBOM
          }
          Write-PrewriteRevalidation
          try {
            $tag = ([string](gh api "repos/$env:REPOSITORY_NAME/releases/latest" --jq .tag_name)).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'could not re-read the latest GitHub Release tag before registry login' }
            $commit = ([string](gh api "repos/$env:REPOSITORY_NAME/commits/$tag" --jq .sha)).Trim()
            if ($LASTEXITCODE -ne 0) { throw "could not resolve the latest GitHub Release commit before registry login: $tag" }
            $prewrite.observed_release_tag = $tag
            $prewrite.observed_source_commit = $commit
            if ($tag -cne $release.release_tag -or $commit -cne $release.source_commit) {
              $prewrite.status = 'mismatch'
              $prewrite.failure = "latest GitHub Release changed before registry login: expected=$($release.release_tag)@$($release.source_commit) observed=$tag@$commit"
              Write-PrewriteRevalidation
              throw $prewrite.failure
            }
            $prewrite.status = 'passed'
            Write-PrewriteRevalidation
          } catch {
            if ($prewrite.status -eq 'started') {
              $prewrite.status = 'error'
              $prewrite.failure = $_.Exception.Message
              Write-PrewriteRevalidation
            }
            throw
          }

      - name: Create durable latest-promotion journal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $release = Get-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'release.json') -Raw | ConvertFrom-Json
          $runID = ([string]$env:GITHUB_RUN_ID).Trim()
          $runAttempt = ([string]$env:GITHUB_RUN_ATTEMPT).Trim()
          if ($runID -notmatch '^[1-9][0-9]*$' -or $runAttempt -notmatch '^[1-9][0-9]*$' -or [string]$release.source_commit -notmatch '^[0-9a-f]{40}$') {
            throw 'latest-promotion journal lacks a valid run identity or selected release commit'
          }
          $externalID = "latest-promotion:$runID`:$runAttempt"
          $detailsURL = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$runID"
          $request = [ordered]@{
            name = 'latest-promotion-journal'
            head_sha = [string]$release.source_commit
            status = 'in_progress'
            external_id = $externalID
            details_url = $detailsURL
          } | ConvertTo-Json -Compress
          $requestPath = Join-Path $env:RECEIPT_DIR 'journal-create-request.json'
          $request | Set-Content -LiteralPath $requestPath -Encoding utf8NoBOM
          $responseLines = @(gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$env:REPOSITORY_NAME/check-runs" --input $requestPath)
          if ($LASTEXITCODE -ne 0) { throw 'could not create latest-promotion journal check run' }
          try { $response = ($responseLines -join "`n") | ConvertFrom-Json } catch { throw 'latest-promotion journal creation returned invalid JSON' }
          $journalID = ([string]$response.id).Trim()
          if ($journalID -notmatch '^[1-9][0-9]*$' -or [string]$response.name -cne 'latest-promotion-journal' -or [string]$response.head_sha -cne [string]$release.source_commit -or [string]$response.external_id -cne $externalID -or [string]$response.details_url -cne $detailsURL -or [string]$response.status -cne 'in_progress') {
            throw 'latest-promotion journal creation returned an unexpected check run'
          }
          $env:LATEST_PROMOTION_JOURNAL_ID = $journalID
          "LATEST_PROMOTION_JOURNAL_ID=$journalID" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Login to GHCR only after immutable provenance inspection
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed' }

      - name: Promote each official release image to latest as a recoverable set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $release = Get-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'release.json') -Raw | ConvertFrom-Json
          $source = Get-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'sources.json') -Raw | ConvertFrom-Json
          $journalID = ([string]$env:LATEST_PROMOTION_JOURNAL_ID).Trim()
          $runID = ([string]$env:GITHUB_RUN_ID).Trim()
          $runAttempt = ([string]$env:GITHUB_RUN_ATTEMPT).Trim()
          if ($journalID -notmatch '^[1-9][0-9]*$' -or $runID -notmatch '^[1-9][0-9]*$' -or $runAttempt -notmatch '^[1-9][0-9]*$') { throw 'latest-promotion journal identity is unavailable' }
          $journalExternalID = "latest-promotion:$runID`:$runAttempt"
          $journalDetailsURL = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$runID"

          function Get-Label {
            param([Parameter(Mandatory)]$Labels, [Parameter(Mandatory)][string]$Name)
            $property = $Labels.PSObject.Properties[$Name]
            if ($null -eq $property) { return '' }
            return [string]$property.Value
          }

          function Get-ImageIdentity {
            param([Parameter(Mandatory)][string]$Reference)
            $manifest = docker buildx imagetools inspect $Reference --format '{{json .Manifest}}' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect manifest for $Reference" }
            $raw = docker buildx imagetools inspect $Reference --raw | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect raw manifest for $Reference" }
            $image = docker buildx imagetools inspect $Reference --format '{{json .Image}}' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "could not inspect image configuration for $Reference" }
            $repository = $Reference.Substring(0, $Reference.LastIndexOf(':'))
            $manifestDigest = [string]$manifest.digest
            $configDigest = [string]$raw.config.digest
            if ($manifestDigest -notmatch '^sha256:[0-9a-f]{64}$' -or $configDigest -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "image does not expose immutable manifest/config identities: $Reference"
            }
            return [ordered]@{
              reference = $Reference
              repository = $repository
              state = 'present'
              immutable_reference = "$repository@$manifestDigest"
              manifest_digest = $manifestDigest
              config_digest = $configDigest
              source = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.source'
              version = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.version'
              revision = Get-Label -Labels $image.config.Labels -Name 'org.opencontainers.image.revision'
            }
          }

          function Get-TagIdentity {
            param([Parameter(Mandatory)][string]$Reference)
            $inspectOutput = @(docker buildx imagetools inspect $Reference --format '{{json .Manifest}}' 2>&1)
            if ($LASTEXITCODE -ne 0) {
              $detail = ($inspectOutput | ForEach-Object { $_.ToString() }) -join "`n"
              if ($detail -match '(?i)(\b404\b|manifest unknown|name unknown)') {
                return [ordered]@{ reference = $Reference; repository = $Reference.Substring(0, $Reference.LastIndexOf(':')); state = 'absent'; immutable_reference = $null; manifest_digest = $null }
              }
              throw "could not inspect manifest for ${Reference}: $detail"
            }
            $manifest = $inspectOutput | ConvertFrom-Json
            $manifestDigest = [string]$manifest.digest
            if ($manifestDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "image does not expose an immutable manifest digest: $Reference" }
            $repository = $Reference.Substring(0, $Reference.LastIndexOf(':'))
            return [ordered]@{ reference = $Reference; repository = $repository; state = 'present'; immutable_reference = "$repository@$manifestDigest"; manifest_digest = $manifestDigest }
          }

          function Get-FinalTagIdentity {
            param([Parameter(Mandatory)][string]$Reference)
            try { return Get-TagIdentity -Reference $Reference } catch {
              return [ordered]@{ reference = $Reference; repository = $Reference.Substring(0, $Reference.LastIndexOf(':')); state = 'readback_error'; immutable_reference = $null; manifest_digest = $null; failure = $_.Exception.Message }
            }
          }

          function Assert-ImageIdentity {
            param([Parameter(Mandatory)]$Expected, [Parameter(Mandatory)]$Observed, [Parameter(Mandatory)][string]$Description)
            foreach ($field in 'manifest_digest','config_digest','source','version','revision') {
              if ([string]$Observed.$field -cne [string]$Expected.$field) { throw "$Description differs from its expected immutable identity: $field" }
            }
          }

          function Get-OfficialRelease {
            $tag = ([string](gh api "repos/$env:REPOSITORY_NAME/releases/latest" --jq .tag_name)).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'could not re-read the latest GitHub Release tag after latest writes' }
            $commit = ([string](gh api "repos/$env:REPOSITORY_NAME/commits/$tag" --jq .sha)).Trim()
            if ($LASTEXITCODE -ne 0) { throw "could not resolve the latest GitHub Release commit after latest writes: $tag" }
            return [ordered]@{ release_tag = $tag; source_commit = $commit }
          }


          $previousLatest = [System.Collections.Generic.List[object]]::new()
          $attemptedLatest = [System.Collections.Generic.List[object]]::new()
          $updatedLatest = [System.Collections.Generic.List[object]]::new()
          $rollbackTargets = [System.Collections.Generic.List[object]]::new()
          $restoredLatest = [System.Collections.Generic.List[object]]::new()
          $rollbackFailures = [System.Collections.Generic.List[object]]::new()
          $receiptFailures = [System.Collections.Generic.List[object]]::new()
          $previousByRepository = @{}
          $finalByRepository = @{}
          $promotion = [ordered]@{
            phase = 'capturing_previous_latest'
            outcome = 'pending'
            failure = $null
            previous_latest_images = @()
            attempted_latest_images = @()
            updated_latest_images = @()
            final_latest_images = @()
            intermediate_receipt_failures = @()
            post_write_release_revalidation = [ordered]@{ status = 'not_started'; expected_release_tag = [string]$release.release_tag; expected_source_commit = [string]$release.source_commit; observed_release_tag = $null; observed_source_commit = $null; failure = $null }
            rollback = [ordered]@{ attempted = $false; outcome = 'not_needed'; targets = @(); restored_images = @(); failures = @() }
          }
          function Set-FinalLatestImage {
            param([Parameter(Mandatory)][string]$Repository, [Parameter(Mandatory)]$Identity)
            $finalByRepository[$Repository] = $Identity
            $promotion.final_latest_images = @($source.images | ForEach-Object { $finalByRepository[[string]$_.repository] })
          }
          function Set-FinalLatestReadbacks {
            $promotion.final_latest_images = @($source.images | ForEach-Object { Get-FinalTagIdentity -Reference "$($_.repository):latest" })
          }
          function Write-PromotionState {
            param([switch]$BestEffort)
            try {
              $promotion | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'promotion.json') -Encoding utf8NoBOM
            } catch {
              if (-not $BestEffort) { throw }
              $receiptFailures.Add([ordered]@{ phase = [string]$promotion.phase; failure = $_.Exception.Message })
              $promotion.intermediate_receipt_failures = $receiptFailures.ToArray()
            }
          }
          function Get-JournalIdentity {
            param($Identity, [switch]$Intended)
            if ($null -eq $Identity) { return $null }
            $identityObject = [pscustomobject]$Identity
            $useIntendedIdentity = $Intended -and
              $null -ne $identityObject.PSObject.Properties['intended_immutable_reference'] -and
              $null -ne $identityObject.PSObject.Properties['intended_manifest_digest']
            return [ordered]@{
              reference = [string]$identityObject.reference
              state = [string]$identityObject.state
              immutable_reference = if ($useIntendedIdentity) { [string]$identityObject.intended_immutable_reference } else { [string]$identityObject.immutable_reference }
              manifest_digest = if ($useIntendedIdentity) { [string]$identityObject.intended_manifest_digest } else { [string]$identityObject.manifest_digest }
            }
          }
          function Get-JournalSummary {
            param([Parameter(Mandatory)][string]$Phase, [Parameter(Mandatory)][string]$Outcome, [string]$Repository = $null, $Previous = $null, $Intended = $null)
            $updatedSummary = @($updatedLatest | ForEach-Object { [ordered]@{ reference = [string]$_.reference; repository = [string]$_.repository; manifest_digest = [string]$_.manifest_digest } })
            $finalSummary = @($promotion.final_latest_images | ForEach-Object { [ordered]@{ reference = [string]$_.reference; repository = [string]$_.repository; state = [string]$_.state; manifest_digest = if ($_.state -eq 'mutation_pending') { [string]$_.intended_manifest_digest } else { [string]$_.manifest_digest } } })
            return ([ordered]@{
                phase = $Phase
                outcome = $Outcome
                repository = $Repository
                previous_identity = Get-JournalIdentity -Identity $Previous
                intended_identity = Get-JournalIdentity -Identity $Intended -Intended
                updated_summary = [ordered]@{ count = $updatedSummary.Count; images = $updatedSummary }
                final_summary = [ordered]@{ count = $finalSummary.Count; images = $finalSummary }
              } | ConvertTo-Json -Compress -Depth 10)
          }
          function Assert-JournalResponse {
            param([Parameter(Mandatory)]$Response, [Parameter(Mandatory)][string]$ExpectedStatus, [string]$ExpectedConclusion = $null, [Parameter(Mandatory)][string]$ExpectedSummary)
            if ([string]$Response.id -cne $journalID -or [string]$Response.name -cne 'latest-promotion-journal' -or [string]$Response.head_sha -cne [string]$release.source_commit -or [string]$Response.external_id -cne $journalExternalID -or [string]$Response.details_url -cne $journalDetailsURL -or [string]$Response.status -cne $ExpectedStatus -or [string]$Response.output.title -cne 'Latest promotion journal' -or [string]$Response.output.summary -cne $ExpectedSummary) {
              throw 'latest-promotion journal update returned an unexpected check run'
            }
            if ($ExpectedStatus -eq 'completed' -and [string]$Response.conclusion -cne $ExpectedConclusion) { throw 'latest-promotion journal completion returned an unexpected conclusion' }
          }
          function Update-PromotionJournal {
            param([Parameter(Mandatory)][string]$Phase, [Parameter(Mandatory)][string]$Outcome, [string]$Repository = $null, $Previous = $null, $Intended = $null, [string]$Conclusion = $null, [switch]$BestEffort)
            try {
              $summary = Get-JournalSummary -Phase $Phase -Outcome $Outcome -Repository $Repository -Previous $Previous -Intended $Intended
              $request = [ordered]@{
                status = if ([string]::IsNullOrEmpty($Conclusion)) { 'in_progress' } else { 'completed' }
                output = [ordered]@{ title = 'Latest promotion journal'; summary = $summary }
              }
              if (-not [string]::IsNullOrEmpty($Conclusion)) { $request.conclusion = $Conclusion }
              $requestJSON = $request | ConvertTo-Json -Compress -Depth 10
              $requestPath = Join-Path $env:RECEIPT_DIR 'journal-update-request.json'
              $requestJSON | Set-Content -LiteralPath $requestPath -Encoding utf8NoBOM
              $responseLines = @(gh api --method PATCH -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$env:REPOSITORY_NAME/check-runs/$journalID" --input $requestPath)
              if ($LASTEXITCODE -ne 0) { throw 'could not update latest-promotion journal check run' }
              try { $response = ($responseLines -join "`n") | ConvertFrom-Json } catch { throw 'latest-promotion journal update returned invalid JSON' }
              Assert-JournalResponse -Response $response -ExpectedStatus ([string]$request.status) -ExpectedConclusion $Conclusion -ExpectedSummary $summary
              return $true
            } catch {
              if (-not $BestEffort) { throw }
              return $false
            }
          }

          Write-PromotionState
          try {
            foreach ($image in @($source.images)) {
              $target = "$($image.repository):latest"
              $previous = Get-TagIdentity -Reference $target
              $previousLatest.Add($previous)
              $previousByRepository[[string]$image.repository] = $previous
              Set-FinalLatestImage -Repository ([string]$image.repository) -Identity $previous
            }
            $promotion.previous_latest_images = $previousLatest.ToArray()
            $promotion.phase = 'writing_latest'
            Write-PromotionState
            $missing = @($previousLatest | Where-Object { $_.state -eq 'absent' })
            if ($missing.Count -gt 0) {
              $promotion.phase = 'failed'
              $promotion.outcome = 'bootstrap_required_no_write'
              $promotion.failure = "latest tag is absent and requires manual bootstrap without promotion writes: $($missing[0].reference)"
              Write-PromotionState
              Update-PromotionJournal -Phase 'failed' -Outcome $promotion.outcome -Conclusion 'neutral' | Out-Null
              throw $promotion.failure
            }

            foreach ($image in @($source.images)) {
              $target = "$($image.repository):latest"
              $previous = $previousByRepository[[string]$image.repository]
              $attempt = [ordered]@{ reference = $target; repository = [string]$image.repository; state = 'mutation_pending'; intended_immutable_reference = [string]$image.immutable_reference; intended_manifest_digest = [string]$image.manifest_digest }
              Set-FinalLatestImage -Repository ([string]$image.repository) -Identity $attempt
              $promotion.attempted_latest_images = @($attemptedLatest.ToArray() + $attempt)
              Write-PromotionState
              Update-PromotionJournal -Phase 'writing_latest' -Outcome 'mutation_pending' -Repository ([string]$image.repository) -Previous $previous -Intended $attempt | Out-Null
              $rollbackTargets.Add($previous)
              $attemptedLatest.Add($attempt)
              $promotion.rollback.targets = $rollbackTargets.ToArray()
              $promotion.attempted_latest_images = $attemptedLatest.ToArray()
              docker buildx imagetools create --prefer-index=false --tag $target $image.immutable_reference
              if ($LASTEXITCODE -ne 0) { throw "could not promote $($image.immutable_reference) to $target" }
              $observed = Get-ImageIdentity -Reference $target
              Assert-ImageIdentity -Expected $image -Observed $observed -Description "latest readback for $target"
              $updatedLatest.Add($observed)
              $promotion.updated_latest_images = $updatedLatest.ToArray()
              Set-FinalLatestImage -Repository ([string]$image.repository) -Identity $observed
              Update-PromotionJournal -Phase 'writing_latest' -Outcome 'updated' -Repository ([string]$image.repository) -Previous $previous -Intended $attempt | Out-Null
              try {
                [ordered]@{ images = $updatedLatest.ToArray() } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'latest.json') -Encoding utf8NoBOM
              } catch {
                $receiptFailures.Add([ordered]@{ phase = 'writing_latest'; failure = $_.Exception.Message })
                $promotion.intermediate_receipt_failures = $receiptFailures.ToArray()
              }
              Write-PromotionState -BestEffort
            }

            $promotion.phase = 'post_write_release_revalidation'
            $promotion.post_write_release_revalidation.status = 'started'
            Write-PromotionState -BestEffort
            try {
              $observedRelease = Get-OfficialRelease
              $promotion.post_write_release_revalidation.observed_release_tag = $observedRelease.release_tag
              $promotion.post_write_release_revalidation.observed_source_commit = $observedRelease.source_commit
              if ($observedRelease.release_tag -cne $release.release_tag -or $observedRelease.source_commit -cne $release.source_commit) {
                $promotion.post_write_release_revalidation.status = 'mismatch'
                $promotion.post_write_release_revalidation.failure = "latest GitHub Release changed during latest promotion: expected=$($release.release_tag)@$($release.source_commit) observed=$($observedRelease.release_tag)@$($observedRelease.source_commit)"
                Write-PromotionState -BestEffort
                throw $promotion.post_write_release_revalidation.failure
              }
              $promotion.post_write_release_revalidation.status = 'passed'
            } catch {
              if ($promotion.post_write_release_revalidation.status -eq 'started') { $promotion.post_write_release_revalidation.status = 'error'; $promotion.post_write_release_revalidation.failure = $_.Exception.Message }
              Write-PromotionState -BestEffort
              throw
            }
            Set-FinalLatestReadbacks
            $finalizationFailures = @($promotion.final_latest_images | Where-Object { $_.state -eq 'readback_error' -or $_.state -ne 'present' })
            if ($finalizationFailures.Count -gt 0) { throw "could not finalize latest registry readbacks: $($finalizationFailures[0].reference)" }
            $promotion.phase = 'completed'
            $promotion.outcome = 'success'
            Write-PromotionState
            Update-PromotionJournal -Phase $promotion.phase -Outcome $promotion.outcome -Conclusion 'success' | Out-Null
          } catch {
            $promotion.failure = $_.Exception.Message
            if ($promotion.outcome -eq 'bootstrap_required_no_write') { throw "latest promotion failed before updating a moving tag: $($promotion.failure)" }
            if ($rollbackTargets.Count -eq 0) {
              $promotion.phase = 'failed'
              if (@($previousLatest | Where-Object { $_.state -eq 'absent' }).Count -eq 0) { $promotion.outcome = 'failed_before_write' }
              Set-FinalLatestReadbacks
              Write-PromotionState -BestEffort
              Update-PromotionJournal -Phase $promotion.phase -Outcome $promotion.outcome -Conclusion 'failure' -BestEffort | Out-Null
              throw "latest promotion failed before updating a moving tag: $($promotion.failure)"
            }

            $promotion.phase = 'rolling_back'
            $promotion.rollback.attempted = $true
            Write-PromotionState -BestEffort
            Update-PromotionJournal -Phase $promotion.phase -Outcome 'mutation_pending' -BestEffort | Out-Null
            foreach ($previous in $rollbackTargets) {
              try {
                Update-PromotionJournal -Phase $promotion.phase -Outcome 'rollback_pending' -Repository ([string]$previous.repository) -Previous $previous -Intended $previous -BestEffort | Out-Null
                docker buildx imagetools create --prefer-index=false --tag $previous.reference $previous.immutable_reference
                if ($LASTEXITCODE -ne 0) { throw "could not restore $($previous.reference)" }
                $restored = Get-TagIdentity -Reference $previous.reference
                if ($restored.state -ne 'present' -or $restored.manifest_digest -cne $previous.manifest_digest) { throw "rollback readback for $($previous.reference) does not restore the captured immutable digest" }
                $restoredLatest.Add($restored)
                Set-FinalLatestImage -Repository ([string]$previous.repository) -Identity $restored
                Update-PromotionJournal -Phase $promotion.phase -Outcome 'restored' -Repository ([string]$previous.repository) -Previous $previous -Intended $previous -BestEffort | Out-Null
              } catch {
                $rollbackFailures.Add([ordered]@{ target = $previous.reference; failure = $_.Exception.Message })
                Update-PromotionJournal -Phase $promotion.phase -Outcome 'rollback_failed' -Repository ([string]$previous.repository) -Previous $previous -Intended $previous -BestEffort | Out-Null
              }
            }
            $promotion.rollback.restored_images = $restoredLatest.ToArray()
            $promotion.rollback.failures = $rollbackFailures.ToArray()
            $promotion.phase = 'failed'
            Set-FinalLatestReadbacks
            $readbackErrors = @($promotion.final_latest_images | Where-Object { $_.state -eq 'readback_error' })
            if ($rollbackFailures.Count -gt 0) {
              $promotion.rollback.outcome = 'failed'
              $promotion.outcome = 'rollback_failed'
            } elseif ($readbackErrors.Count -gt 0) {
              $promotion.rollback.outcome = 'readback_error'
              $promotion.outcome = 'rollback_readback_error'
            } else {
              $promotion.rollback.outcome = 'succeeded'
              $promotion.outcome = 'rolled_back'
            }
            Write-PromotionState -BestEffort
            $conclusion = if ($promotion.outcome -eq 'rolled_back') { 'neutral' } else { 'failure' }
            Update-PromotionJournal -Phase $promotion.phase -Outcome $promotion.outcome -Conclusion $conclusion -BestEffort | Out-Null
            throw "latest promotion failed; final outcome=$($promotion.outcome): $($promotion.failure)"
          }

      - name: Complete unstarted latest-promotion journal
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $journalID = ([string]$env:LATEST_PROMOTION_JOURNAL_ID).Trim()
          $promotionPath = Join-Path $env:RECEIPT_DIR 'promotion.json'
          if ($journalID -notmatch '^[1-9][0-9]*$' -or (Test-Path -LiteralPath $promotionPath)) { return }
          $releasePath = Join-Path $env:RECEIPT_DIR 'release.json'
          if (-not (Test-Path -LiteralPath $releasePath)) { throw 'unstarted latest-promotion journal lacks selected release state' }
          $release = Get-Content -LiteralPath $releasePath -Raw | ConvertFrom-Json
          $runID = ([string]$env:GITHUB_RUN_ID).Trim()
          $runAttempt = ([string]$env:GITHUB_RUN_ATTEMPT).Trim()
          if ($runID -notmatch '^[1-9][0-9]*$' -or $runAttempt -notmatch '^[1-9][0-9]*$' -or [string]$release.source_commit -notmatch '^[0-9a-f]{40}$') { throw 'unstarted latest-promotion journal lacks a valid identity' }
          $externalID = "latest-promotion:$runID`:$runAttempt"
          $detailsURL = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$runID"
          $summary = ([ordered]@{
              phase = 'pre_promotion'
              outcome = 'failed_before_write'
              repository = $null
              previous_identity = $null
              intended_identity = $null
              updated_summary = [ordered]@{ count = 0; images = @() }
              final_summary = [ordered]@{ count = 0; images = @() }
            } | ConvertTo-Json -Compress -Depth 10)
          $request = [ordered]@{
            status = 'completed'
            conclusion = 'failure'
            output = [ordered]@{ title = 'Latest promotion journal'; summary = $summary }
          } | ConvertTo-Json -Compress -Depth 10
          $requestPath = Join-Path $env:RECEIPT_DIR 'journal-update-request.json'
          $request | Set-Content -LiteralPath $requestPath -Encoding utf8NoBOM
          $responseLines = @(gh api --method PATCH -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$env:REPOSITORY_NAME/check-runs/$journalID" --input $requestPath)
          if ($LASTEXITCODE -ne 0) { throw 'could not terminalize unstarted latest-promotion journal check run' }
          try { $response = ($responseLines -join "`n") | ConvertFrom-Json } catch { throw 'unstarted latest-promotion journal terminalization returned invalid JSON' }
          if ([string]$response.id -cne $journalID -or [string]$response.name -cne 'latest-promotion-journal' -or [string]$response.head_sha -cne [string]$release.source_commit -or [string]$response.external_id -cne $externalID -or [string]$response.details_url -cne $detailsURL -or [string]$response.status -cne 'completed' -or [string]$response.conclusion -cne 'failure' -or [string]$response.output.title -cne 'Latest promotion journal' -or [string]$response.output.summary -cne $summary) {
            throw 'unstarted latest-promotion journal terminalization returned an unexpected check run'
          }
      - name: Logout and erase the isolated registry credential directory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hadCredentialDirectory = Test-Path -LiteralPath $env:DOCKER_CONFIG
          docker logout ghcr.io
          $logoutExit = $LASTEXITCODE
          if ($hadCredentialDirectory) {
            Remove-Item -Force -Recurse -LiteralPath $env:DOCKER_CONFIG
          }
          if (Test-Path -LiteralPath $env:DOCKER_CONFIG) {
            throw 'Docker credential directory still exists after erasure'
          }
          if ($logoutExit -ne 0 -and $hadCredentialDirectory) {
            throw 'GHCR logout failed'
          }

      - name: Write latest-promotion receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:RECEIPT_DIR -Force | Out-Null
          $prewritePath = Join-Path $env:RECEIPT_DIR 'prewrite-release-revalidation.json'
          $promotionPath = Join-Path $env:RECEIPT_DIR 'promotion.json'
          $releasePath = Join-Path $env:RECEIPT_DIR 'release.json'
          $sourcesPath = Join-Path $env:RECEIPT_DIR 'sources.json'
          $latestPath = Join-Path $env:RECEIPT_DIR 'latest.json'
          $prewrite = if (Test-Path -LiteralPath $prewritePath) { Get-Content -LiteralPath $prewritePath -Raw | ConvertFrom-Json } else { $null }
          $promotion = if (Test-Path -LiteralPath $promotionPath) { Get-Content -LiteralPath $promotionPath -Raw | ConvertFrom-Json } else { $null }
          $release = if (Test-Path -LiteralPath $releasePath) { Get-Content -LiteralPath $releasePath -Raw | ConvertFrom-Json } else { $null }
          $sources = if (Test-Path -LiteralPath $sourcesPath) { Get-Content -LiteralPath $sourcesPath -Raw | ConvertFrom-Json } else { $null }
          $latest = if (Test-Path -LiteralPath $latestPath) { Get-Content -LiteralPath $latestPath -Raw | ConvertFrom-Json } else { $null }
          $journalID = ([string]$env:LATEST_PROMOTION_JOURNAL_ID).Trim()
          $outcome = if ($null -ne $promotion) {
            [string]$promotion.outcome
          } elseif ($null -ne $prewrite -and $prewrite.status -eq 'mismatch') {
            'no_write_stale_abort'
          } elseif ($null -ne $prewrite -and $prewrite.status -eq 'error') {
            'prewrite_revalidation_error'
          } elseif ($journalID -match '^[1-9][0-9]*$') {
            'failed_before_write'
          } else {
            'not_started'
          }
          [ordered]@{
            schema_version = 2
            outcome = $outcome
            release_tag = if ($null -eq $release) { $null } else { $release.release_tag }
            source_commit = if ($null -eq $release) { $null } else { $release.source_commit }
            triggering_workflow_name = if ($null -eq $release) { $null } else { $release.triggering_workflow_name }
            triggering_workflow_head_sha = if ($null -eq $release) { $null } else { $release.triggering_workflow_head_sha }
            triggering_workflow_run_id = if ($null -eq $release) { $null } else { $release.triggering_workflow_run_id }
            triggering_workflow_job_conclusion = if ($null -eq $release) { $null } else { $release.triggering_workflow_job_conclusion }
            final_prewrite_release_revalidation = $prewrite
            source_images = if ($null -eq $sources) { @() } else { @($sources.images) }
            previous_latest_images = if ($null -eq $promotion) { @() } else { @($promotion.previous_latest_images) }
            latest_images = if ($null -eq $promotion) { if ($null -eq $latest) { @() } else { @($latest.images) } } else { @($promotion.final_latest_images) }
            attempted_latest_images = if ($null -eq $promotion) { @() } else { @($promotion.attempted_latest_images) }
            updated_latest_images = if ($null -eq $promotion) { @() } else { @($promotion.updated_latest_images) }
            intermediate_receipt_failures = if ($null -eq $promotion) { @() } else { @($promotion.intermediate_receipt_failures) }
            post_write_release_revalidation = if ($null -eq $promotion) { $null } else { $promotion.post_write_release_revalidation }
            rollback = if ($null -eq $promotion) { $null } else { $promotion.rollback }
            rollout_claimed = $false
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $env:RECEIPT_DIR 'latest-promotion-receipt.json') -Encoding utf8NoBOM

      - name: Upload latest-promotion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latest-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
