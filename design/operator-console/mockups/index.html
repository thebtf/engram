<!doctype html>
<html lang="ru" data-theme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram · Операторская станция</title>
<style>
/* ===== Dashboard design-system tokens (pasted verbatim) ===== */
:root {
  --bg: #f4f7fb; --surface: #ffffff; --surface-warm: #eef6ff;
  --fg: #111827; --fg-2: #334155; --muted: #556375; --meta: #0ea5e9;
  --border: #d8e2ee; --border-soft: #edf3f8;
  --accent: #0ea5e9; --accent-on: #04131d;
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);
  --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --font-display: Inter, system-ui, sans-serif;
  --font-body: Inter, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --text-xs: 11px; --text-sm: 13px; --text-base: 15px; --text-lg: 17px;
  --text-xl: 22px; --text-2xl: 30px; --text-3xl: 42px; --text-4xl: 56px;
  --leading-body: 1.48; --leading-tight: 1.1; --tracking-display: -0.015em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 9999px;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 18px 46px rgba(15, 23, 42, 0.10);
  --focus-ring: 0 0 0 3px rgba(14, 165, 233, 0.30);
  --motion-fast: 120ms; --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
}
/* ===== Fixed classification legend — honesty contract (stable across themes) ===== */
:root {
  --class-live:#16a34a; --class-dormant:#d97706; --class-stale:#6b7280; --class-mustbuild:#7c3aed;
  --state-danger:#dc2626; --state-warn:#ea580c;
  --heat-cited:#16a34a; --heat-uncited:#9aa3b0; --secret-tint:#fdf6ec;
  --reveal-key:#16a34a; --reveal-timer:#d97706;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --nav-w:236px; --nav-rail-w:60px; --detail-w:384px; --row-y:11px; --row-gap:11px;
}
/* ===== Dark variant (default for a control room) ===== */
[data-theme="dark"] {
  --bg:#0b0d10; --surface:#14171c; --surface-warm:#1c2027;
  --fg:#e6e9ef; --fg-2:#c2c8d2; --muted:#8b94a3; --meta:#38bdf8;
  --border:#262b33; --border-soft:#1c2027;
  --accent:#4c8dff; --accent-on:#04131d; --success:#34d399; --warn:#fbbf24; --danger:#f87171;
  --elev-ring:0 0 0 1px var(--border); --elev-raised:0 18px 46px rgba(0,0,0,0.5);
  --focus-ring:0 0 0 3px rgba(76,141,255,0.40);
  --class-live:#34d399; --class-dormant:#fbbf24; --class-stale:#6b7280; --class-mustbuild:#a78bfa;
  --state-danger:#f87171; --state-warn:#fb923c;
  --heat-cited:#34d399; --heat-uncited:#5c6470; --secret-tint:#1a1410;
  --reveal-key:#22c55e; --reveal-timer:#f59e0b;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:var(--text-base);
  line-height:var(--leading-body); -webkit-font-smoothing:antialiased; overflow:hidden; }
.mono { font-family:var(--font-mono); font-variant-ligatures:none; }
body { font-kerning:normal; }
/* Tabular figures everywhere numbers carry meaning — counts, telemetry, IDs, versions —
   so digits never shift width as values change (no badge twitch, no column drift). */
.mono, .cnt, .heat, .bignum, .gv, .metric-grid .v, .noise-chip b, .bdg.gate, .swident,
.search-meta, .dfields dd, .dl-v, .noise-ring span, tspan[data-num], .num { font-variant-numeric:tabular-nums; }
button { font-family:inherit; cursor:pointer; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:none; box-shadow:var(--focus-ring); border-radius:var(--r-sm); }

/* ===== Interactive feedback — smooth state transitions (product 120ms) ===== */
.nav-item, .erow, .tbtn, .act, .fchip, .subtab, .search-result, .dlink, .rowmenu, .identity, .swident, .seg button, .noise-chip, .health-pill {
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard); }
.tbtn:active, .act:active, .fchip:active, .rowmenu:active, .subtab:active, .seg button:active { transform: translateY(1px); }

/* ===== App grid: topbar / [nav | content] / statusbar ===== */
.app { position:relative; display:grid; grid-template-columns:var(--nav-w) 1fr; grid-template-rows:48px 1fr 26px;
  grid-template-areas:"nav topbar" "nav content" "nav statusbar"; height:100vh;
  transition:grid-template-columns var(--motion-base) var(--ease-standard); }
.app.nav-collapsed { grid-template-columns:var(--nav-rail-w) 1fr; }
.app > .topbar { grid-area:topbar; } .app > .content { grid-area:content; } .app > .statusbar { grid-area:statusbar; }
/* nav is absolutely positioned over the reserved left grid track, so the ONLY thing that
   animates is its width — no position swap, no jump. The grid column reserves the strip
   (full or rail) and animates in lockstep, so content slides smoothly as the rail shrinks. */
.app > .nav { grid-area:nav; position:absolute; top:0; bottom:0; left:0; width:var(--nav-w); z-index:30;
  transition:width var(--motion-base) var(--ease-standard); }
.app.nav-collapsed > .nav { width:var(--nav-rail-w); }
/* peek = hover-reveal while collapsed: nav width grows back to full and floats over content
   (grid column stays at rail, so content does NOT move). Managed by JS .nav-peek class. */
.app.nav-collapsed.nav-peek > .nav { width:var(--nav-w); z-index:55; box-shadow:var(--elev-raised); }

/* ===== Topbar (over content only — nav is a separate full-height column) ===== */
.topbar { display:flex; align-items:center; gap:var(--space-3); padding:0 var(--space-4);
  background:var(--surface); border-bottom:1px solid var(--border); }
.tspacer { flex:1; }
.health-pill { display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; border-radius:var(--radius-pill);
  font-size:var(--text-xs); font-weight:600; border:1px solid transparent; cursor:default; }
.health-pill .hd { width:8px; height:8px; border-radius:50%; }
.health-pill[data-h="degraded"]{ color:var(--state-warn); background:color-mix(in oklab,var(--state-warn),transparent 87%); border-color:color-mix(in oklab,var(--state-warn),transparent 60%);}
.health-pill[data-h="degraded"] .hd{ background:var(--state-warn); animation:pulse 1.9s var(--ease-standard) infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}
.noise-chip { display:inline-flex; align-items:baseline; gap:6px; padding:4px 11px; border-radius:var(--radius-pill);
  border:1px solid color-mix(in oklab,var(--state-warn),transparent 60%); background:color-mix(in oklab,var(--state-warn),transparent 90%);
  font-size:var(--text-xs); color:var(--fg-2); cursor:pointer; }
.noise-chip b { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--state-warn); }
.gsearch-wrap { position:relative; }
.gsearch { display:flex; align-items:center; gap:7px; width:min(360px,30vw); min-width:280px; background:var(--surface-warm); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:5px 10px; color:var(--muted); font-size:var(--text-sm); transition:border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
.gsearch:focus-within { background:var(--surface); border-color:var(--accent); box-shadow:var(--focus-ring); }
.gsearch input { border:0; background:transparent; color:var(--fg); font-size:var(--text-sm); width:100%; outline:none; }
.gsearch kbd { font-family:var(--font-mono); font-size:10px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--muted); }
.search-pop { position:absolute; left:0; top:calc(100% + 8px); width:min(560px, calc(100vw - 32px)); max-height:min(640px, calc(100vh - 92px)); overflow:auto; z-index:76;
  display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--elev-raised); padding:var(--space-3); }
.search-pop.show { display:block; }
.search-head { display:flex; justify-content:space-between; gap:var(--space-3); align-items:flex-start; padding:var(--space-2) var(--space-2) var(--space-3); border-bottom:1px solid var(--border-soft); }
.search-head b { display:block; font-size:var(--text-sm); color:var(--fg); }
.search-head p { margin:2px 0 0; color:var(--muted); font-size:var(--text-xs); line-height:1.35; }
.search-open { flex:none; height:28px; padding:0 9px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-warm); color:var(--fg-2); font-size:var(--text-xs); font-weight:700; }
.search-open:hover { border-color:var(--accent); color:var(--fg); }
.search-scopes { display:flex; flex-wrap:wrap; gap:6px; padding:var(--space-3) var(--space-2) var(--space-2); }
.search-scope { border:1px solid var(--border); background:var(--surface-warm); color:var(--fg-2); border-radius:var(--radius-pill); padding:4px 8px; font-size:var(--text-xs); font-weight:700; }
.search-scope[aria-pressed="true"] { background:color-mix(in oklab,var(--accent),transparent 84%); border-color:color-mix(in oklab,var(--accent),transparent 46%); color:var(--fg); }
.search-results { display:flex; flex-direction:column; gap:5px; padding:var(--space-2); }
.search-result { width:100%; display:grid; grid-template-columns:84px 1fr auto; gap:10px; align-items:center; text-align:left;
  border:1px solid transparent; background:transparent; color:var(--fg); border-radius:var(--r-md); padding:9px 10px; }
.search-result:hover, .search-result:focus-visible { background:var(--surface-warm); border-color:var(--border); box-shadow:none; }
.search-kind { display:inline-flex; justify-content:center; align-items:center; min-height:22px; border-radius:var(--radius-pill); padding:2px 7px;
  font-size:10px; font-weight:800; color:var(--fg); border:1px solid var(--border); background:var(--surface-warm); }
.search-kind[data-kind="issue"]{ color:var(--state-warn); border-color:color-mix(in oklab,var(--state-warn),transparent 58%); background:color-mix(in oklab,var(--state-warn),transparent 90%); }
.search-kind[data-kind="memory"]{ color:var(--class-live); border-color:color-mix(in oklab,var(--class-live),transparent 58%); background:color-mix(in oklab,var(--class-live),transparent 91%); }
.search-kind[data-kind="rule"]{ color:var(--class-mustbuild); border-color:color-mix(in oklab,var(--class-mustbuild),transparent 58%); background:color-mix(in oklab,var(--class-mustbuild),transparent 91%); }
.search-kind[data-kind="settings"]{ color:var(--accent); border-color:color-mix(in oklab,var(--accent),transparent 58%); background:color-mix(in oklab,var(--accent),transparent 90%); }
.search-copy { min-width:0; }
.search-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--text-sm); font-weight:700; }
.search-detail { margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:var(--text-xs); }
.search-meta { color:var(--muted); font-size:var(--text-xs); font-family:var(--font-mono); }
.search-empty { padding:12px 10px; color:var(--fg-2); font-size:var(--text-sm); line-height:1.45; }
.search-empty b { color:var(--fg); }
.tbtn { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--border); color:var(--fg-2); font-size:var(--text-xs); font-weight:600; }
.tbtn:hover { border-color:var(--accent); color:var(--fg); }
.tbtn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
.tbtn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:var(--accent-on); }
.mobile-menu-button { display:none; }
.seg { display:inline-flex; background:var(--surface-warm); border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; }
.seg button { border:0; background:transparent; padding:5px 9px; font-size:10px; font-weight:700; color:var(--muted); }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--fg); }
/* ===== Identity chip (topbar) — "who is logged in" =====
   Replaces the static "вход отключён" admin-chip with a live operator identity. */
.identity { display:inline-flex; align-items:center; gap:8px; height:32px; padding:3px 10px 3px 3px; border-radius:var(--radius-pill);
  background:var(--surface-warm); border:1px solid var(--border); color:var(--fg); font-weight:600; font-size:var(--text-xs); max-width:230px; }
.identity:hover { border-color:var(--accent); }
.identity .iav { width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:800; font-size:11px;
  color:#fff; letter-spacing:-.02em; background:var(--accent); overflow:hidden; }
.identity .iav img { width:100%; height:100%; object-fit:cover; }
.identity .iwho { display:flex; flex-direction:column; line-height:1.05; min-width:0; }
.identity .iname { font-weight:700; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.identity .imeta { font-size:9px; font-weight:600; color:var(--muted); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.identity .icaret { color:var(--muted); font-size:9px; flex:none; }
.prov-dot { width:13px; height:13px; flex:none; }

/* identity popover menu */
.idmenu { min-width:248px; padding:0; }
.idmenu .idm-head { display:flex; gap:10px; align-items:center; padding:13px 14px; border-bottom:1px solid var(--border); }
.idmenu .idm-head .iav { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px; color:#fff; background:var(--accent); flex:none; overflow:hidden; }
.idmenu .idm-head .iav img { width:100%; height:100%; object-fit:cover; }
.idmenu .idm-id { min-width:0; }
.idmenu .idm-id b { display:block; font-size:var(--text-sm); color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.idmenu .idm-id span { font-size:var(--text-xs); color:var(--muted); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.idmenu .idm-via { display:inline-flex; align-items:center; gap:5px; margin-top:4px; font-size:10px; font-weight:700; color:var(--fg-2);
  padding:2px 7px; border-radius:var(--radius-pill); background:var(--surface-warm); border:1px solid var(--border); }
.idmenu .idm-list { padding:6px; }
.idmenu .idm-item { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:transparent; color:var(--fg-2);
  padding:8px 9px; border-radius:var(--r-sm); font-size:var(--text-sm); font-weight:600; }
.idmenu .idm-item:hover { background:var(--surface-warm); color:var(--fg); }
.idmenu .idm-item.danger { color:var(--danger); }
.idmenu .idm-item.danger:hover { background:color-mix(in oklab,var(--danger),transparent 90%); }
.idmenu .idm-item svg { width:15px; height:15px; flex:none; }
.idmenu .idm-sep { height:1px; background:var(--border); margin:5px 0; }

/* ===== Login gate (full-screen, above app) ===== */
.authgate { position:fixed; inset:0; z-index:90; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  background:var(--bg); overflow:auto; }
.authgate[hidden] { display:none; }
.ag-form-col { display:flex; flex-direction:column; justify-content:center; padding:clamp(28px,6vh,72px) clamp(24px,5vw,88px); min-width:0; }
.ag-aside { position:relative; background:var(--surface); border-left:1px solid var(--border); padding:clamp(28px,6vh,72px) clamp(24px,4vw,64px);
  display:flex; flex-direction:column; justify-content:center; gap:var(--space-5); overflow:hidden; }
.ag-aside::before { content:""; position:absolute; inset:0; background:
  radial-gradient(120% 90% at 88% 8%, color-mix(in oklab,var(--accent),transparent 88%), transparent 60%); pointer-events:none; }
.ag-card { width:100%; max-width:430px; margin:0 auto; }
.ag-brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em; font-size:var(--text-lg); margin-bottom:6px; }
.ag-brand .glyph { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--accent); color:#fff; font-weight:800; font-size:15px; }
.ag-h1 { font-size:var(--text-2xl); font-weight:800; letter-spacing:var(--tracking-display); margin:18px 0 6px; line-height:1.12; }
.ag-sub { color:var(--muted); font-size:var(--text-sm); margin-bottom:var(--space-5); line-height:1.5; }
.ag-tabs { display:inline-flex; gap:2px; padding:3px; border-radius:var(--r-sm); background:var(--surface-warm); border:1px solid var(--border); margin-bottom:var(--space-5); }
.ag-tab { border:0; background:transparent; color:var(--muted); font-weight:700; font-size:var(--text-xs); padding:7px 14px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; }
.ag-tab[aria-selected="true"] { background:var(--surface); color:var(--fg); box-shadow:var(--elev-ring); }
.ag-tab .lockico { width:13px; height:13px; }
.ag-providers { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:var(--space-4); }
.ag-prov { display:inline-flex; align-items:center; justify-content:center; gap:9px; height:42px; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--fg); font-weight:600; font-size:var(--text-sm); }
.ag-prov:hover { border-color:var(--accent); background:var(--surface-warm); }
.ag-prov.full { grid-column:1 / -1; }
.ag-prov svg, .ag-prov img, .ag-prov .pg { width:18px; height:18px; flex:none; }
.ag-divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:var(--text-xs); margin:var(--space-4) 0; }
.ag-divider::before, .ag-divider::after { content:""; height:1px; flex:1; background:var(--border); }
.ag-field { display:flex; flex-direction:column; gap:6px; margin-bottom:var(--space-3); }
.ag-field label { font-size:var(--text-xs); font-weight:700; color:var(--fg-2); }
.ag-field .agrow { display:flex; align-items:center; justify-content:space-between; }
.ag-field .agforgot { font-size:var(--text-xs); font-weight:600; }
.ag-input { height:42px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); color:var(--fg);
  font-size:var(--text-sm); padding:0 12px; width:100%; font-family:var(--font-body); }
.ag-input.mono { font-family:var(--font-mono); }
.ag-input:focus-visible { border-color:var(--accent); }
.ag-input::placeholder { color:var(--muted); }
.ag-pass-wrap { position:relative; }
.ag-pass-wrap .ag-peek { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:var(--muted); font-size:11px; font-weight:700; padding:4px 6px; border-radius:5px; }
.ag-pass-wrap .ag-peek:hover { color:var(--fg); background:var(--surface-warm); }
.ag-remember { display:flex; align-items:center; gap:8px; font-size:var(--text-sm); color:var(--fg-2); margin:6px 0 var(--space-4); }
.ag-submit { width:100%; height:44px; border:1px solid var(--accent); border-radius:var(--r-sm); background:var(--accent); color:#fff; font-weight:700; font-size:var(--text-sm); }
.ag-submit:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.ag-foot { margin-top:var(--space-4); font-size:var(--text-sm); color:var(--muted); }
.ag-legacy-note { display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:var(--r-md); margin-bottom:var(--space-4);
  border:1px solid color-mix(in oklab,var(--warn),transparent 55%); background:color-mix(in oklab,var(--warn),transparent 90%); color:var(--fg-2); font-size:var(--text-xs); line-height:1.45; }
.ag-legacy-note b { color:var(--fg); }
.ag-legacy-note .mk { width:18px; height:18px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--warn); color:#1a1205; font-weight:800; font-size:11px; }
.ag-legacy-off { padding:22px; border:1px dashed var(--border); border-radius:var(--r-md); background:var(--surface-warm); color:var(--muted); font-size:var(--text-sm); line-height:1.5; text-align:center; }
.ag-err { display:none; margin-bottom:var(--space-3); padding:9px 12px; border-radius:var(--r-sm); font-size:var(--text-xs); font-weight:600;
  border:1px solid color-mix(in oklab,var(--danger),transparent 55%); background:color-mix(in oklab,var(--danger),transparent 88%); color:var(--danger); }
.ag-err.show { display:block; }
/* aside passport */
.ag-passport { position:relative; }
.ag-passport .agp-kick { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--meta); letter-spacing:.04em; text-transform:uppercase; }
.ag-passport h2 { font-size:var(--text-xl); font-weight:800; letter-spacing:var(--tracking-display); margin:8px 0 14px; line-height:1.25; max-width:22ch; }
.ag-passport .agp-lede { color:var(--fg-2); font-size:var(--text-sm); line-height:1.55; margin:0 0 22px; max-width:34ch; }
.ag-passport .agp-pts { display:flex; flex-direction:column; gap:14px; }
.ag-passport .agp-pt { display:flex; gap:11px; align-items:flex-start; }
.ag-passport .agp-pt .pmk { width:26px; height:26px; flex:none; border-radius:8px; display:grid; place-items:center; color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 86%); border:1px solid color-mix(in oklab,var(--accent),transparent 60%); }
.ag-passport .agp-pt .pmk svg { width:15px; height:15px; }
.ag-passport .agp-pt b { display:block; font-size:var(--text-sm); color:var(--fg); }
.ag-passport .agp-pt span { font-size:var(--text-xs); color:var(--muted); line-height:1.45; }
.ag-dot { width:8px; height:8px; border-radius:50%; flex:none; }
.ag-dot.ok { background:var(--success); } .ag-dot.warn { background:var(--warn); }
@media (max-width:900px){ .authgate { grid-template-columns:1fr; } .ag-aside { display:none; } }

/* ===== Profile modal ===== */
.profile-shell { width:min(640px,94vw); }
.profile-hero { display:flex; gap:14px; align-items:center; padding:var(--space-5); border-bottom:1px solid var(--border); }
.profile-hero .iav { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; background:var(--accent); flex:none; overflow:hidden; }
.profile-hero .iav img { width:100%; height:100%; object-fit:cover; }
.profile-hero h2 { margin:0; font-size:var(--text-xl); font-weight:800; }
.profile-hero p { margin:3px 0 0; color:var(--muted); font-size:var(--text-sm); font-family:var(--font-mono); }
.profile-body { max-height:min(560px,70vh); overflow:auto; padding:var(--space-2) var(--space-5) var(--space-5); }
.psession { display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--border-soft); }
.psession:first-child { border-top:0; }
.psession .ps-ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--surface-warm); border:1px solid var(--border); color:var(--fg-2); flex:none; }
.psession .ps-meta { flex:1; min-width:0; }
.psession .ps-meta b { display:block; font-size:var(--text-sm); }
.psession .ps-meta span { font-size:var(--text-xs); color:var(--muted); font-family:var(--font-mono); }
.psession .ps-cur { font-size:10px; font-weight:800; color:var(--success); text-transform:uppercase; letter-spacing:.05em; }

/* ===== Nav = full-height left column (Gemini layout). The .app grid sizes its width;
   the panel just fills its grid cell. Logo + collapse button share the header row. ===== */
.nav { background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
/* header row: brand glyph+wordmark on the left, collapse button pinned right (NOT a corner) */
.navhead { display:flex; align-items:center; gap:6px; flex:none; height:48px; padding:0 8px 0 14px; border-bottom:1px solid var(--border); }
.navbrand { display:flex; align-items:center; gap:9px; flex:1; min-width:0; border:0; background:transparent; cursor:pointer; padding:5px 6px; border-radius:var(--r-sm);
  color:var(--fg); font-weight:700; letter-spacing:-.02em; font-size:var(--text-base); white-space:nowrap; overflow:hidden; }
.navbrand:hover { background:var(--surface-warm); }
.navbrand .glyph { width:26px; height:26px; border-radius:7px; display:grid; place-items:center; flex:none; color:var(--accent-on); font-weight:800; font-size:13px;
  background:var(--accent); box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent-on),transparent 80%); }
.navbrand-wm { transition:opacity var(--motion-fast) var(--ease-standard); overflow:hidden; }
.navcollapse { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; flex:none;
  border:1px solid transparent; border-radius:var(--r-sm); background:transparent; color:var(--fg-2); cursor:pointer;
  transition:color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
.navcollapse:hover { background:var(--surface-warm); color:var(--fg); }
.navcollapse svg line { transition:opacity var(--motion-fast) var(--ease-standard); }
.app.nav-collapsed .navcollapse { color:var(--accent); }
.app.nav-collapsed .navcollapse svg line { opacity:.35; }
.nav-scroll { flex:1; min-height:0; overflow-y:auto; padding:var(--space-3) var(--space-2) var(--space-6); }
.nav-grp { margin-bottom:var(--space-4); }
.nav-grp .gl { font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700; padding:4px 10px 6px; white-space:nowrap; }

/* ===== Collapsed = ICON RAIL (not gone). Icons larger, labels/counts/group-titles hidden,
   colored status dots kept as a corner badge. Hovering the rail temporarily expands the
   panel to full width OVER the content (Gemini-style), without shifting the layout.
   "rail" state = collapsed AND not peeking; .nav-peek (set by JS on hover) restores full. ===== */
/* text bits fade with the width animation rather than popping (overflow clips them as the
   rail narrows; opacity makes the fade graceful) */
.nav-item .lbl, .nav-item .cnt, .nav-item .flag, .nav-item .lock,
.navbrand-wm, .nav-grp .gl { transition:opacity var(--motion-fast) var(--ease-standard); }
/* rail header: wordmark hides, collapse button centers under the glyph row */
.app.nav-collapsed:not(.nav-peek) > .nav .navhead { padding:0 10px 0 0; justify-content:flex-end; }
.app.nav-collapsed:not(.nav-peek) > .nav .navbrand { flex:none; justify-content:center; padding:5px 0; }
.app.nav-collapsed:not(.nav-peek) > .nav .navbrand-wm { opacity:0; width:0; }
.app.nav-collapsed:not(.nav-peek) > .nav .navcollapse { display:none; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-grp .gl { height:0; padding:0; margin:0; opacity:0; overflow:hidden; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item { justify-content:flex-end; padding:9px 10px 9px 0; gap:6px; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .lbl,
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .cnt,
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .flag,
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .lock { opacity:0; width:0; padding:0; margin:0; overflow:hidden; pointer-events:none; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .nav-ico { width:19px; height:19px; opacity:.78; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item[aria-current="page"] .nav-ico { opacity:1; }
/* status dot stays inline, to the LEFT of the icon (its natural flow) — dot + icon center as a
   group. No absolute positioning: that detached the dots into a column and broke the rail. */
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item .ndot { width:6px; height:6px; }
.app.nav-collapsed:not(.nav-peek) > .nav .nav-item.sub { padding-left:0; }
.nav-item { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:0; background:transparent; color:var(--fg-2);
  font-size:var(--text-sm); font-weight:500; padding:7px 10px; border-radius:var(--r-sm); }
.nav-item:hover { background:var(--surface-warm); color:var(--fg); }
.nav-item[aria-current="page"] { background:color-mix(in oklab,var(--accent),transparent 86%); color:var(--fg); font-weight:600; }
.nav-item .ndot { width:7px; height:7px; border-radius:50%; flex:none; }
.nav-item .nav-ico { width:15px; height:15px; flex:none; opacity:.62; transition:opacity var(--motion-fast) var(--ease-standard); }
.nav-item:hover .nav-ico { opacity:.85; }
.nav-item[aria-current="page"] .nav-ico { opacity:1; color:var(--accent); }
.nav-item.tomb .nav-ico { opacity:.4; }
.ndot[data-s="mustbuild"]{ background:var(--class-mustbuild); }
.ndot[data-s="active"]{ background:var(--class-live); } .ndot[data-s="gated"]{ background:var(--class-dormant); } .ndot[data-s="off"]{ background:var(--class-stale); opacity:.5; }
.nav-item .lbl { flex:1; }
.nav-item .cnt { font-family:var(--font-mono); font-size:10px; font-weight:700; padding:1px 6px; border-radius:var(--radius-pill);
  background:var(--accent); color:var(--accent-on); }
.nav-item .flag { font-size:11px; color:var(--muted); }
.nav-item .lock { font-size:11px; color:var(--muted); }
.nav-item.sub { padding-left:26px; font-size:var(--text-xs); }
.nav-item.tomb { color:var(--muted); }

.content { overflow:hidden; min-width:0; display:flex; flex-direction:column; }

/* ===== Area header ===== */
.area-head { padding:var(--space-4) var(--space-6) 0; border-bottom:1px solid var(--border); background:var(--surface); }
.area-title { display:flex; align-items:center; gap:10px; }
.area-title h1 { font-size:var(--text-xl); margin:0; font-weight:700; letter-spacing:var(--tracking-display); text-wrap:balance; }
.area-title .ab { font-size:10px; font-weight:700; color:var(--accent); border:1px solid color-mix(in oklab,var(--accent),transparent 60%);
  background:color-mix(in oklab,var(--accent),transparent 90%); padding:2px 7px; border-radius:var(--radius-pill); }
.area-sub { color:var(--muted); font-size:var(--text-xs); margin-top:3px; }
.subtabs { display:flex; gap:2px; margin-top:var(--space-3); }
.subtab { border:0; background:transparent; color:var(--muted); font-size:var(--text-sm); font-weight:600; padding:8px 12px;
  border-bottom:2px solid transparent; }
.subtab:hover { color:var(--fg); }
.subtab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); }
.subtab .mini { font-size:10px; color:var(--muted); margin-left:5px; }

/* ===== Area body (grid + detail) ===== */
.area-body { flex:1; display:grid; grid-template-columns:1fr; min-height:0; }
.area-body.with-detail { grid-template-columns:minmax(0,1fr) var(--detail-w); }
.pane { overflow-y:auto; min-width:0; padding:var(--space-4) var(--space-6) 90px; }
.detail { border-left:1px solid var(--border); background:var(--surface-warm); overflow-y:auto; padding:var(--space-5); position:relative; }
.detail-grip { position:absolute; top:0; left:-3px; width:7px; height:100%; cursor:col-resize; z-index:6; touch-action:none; }
.detail-grip::before { content:""; position:absolute; left:2px; top:0; width:1px; height:100%; background:transparent; transition:background var(--motion-fast) var(--ease-standard); }
.detail-grip:hover::before, .detail-grip.drag::before, .detail-grip:focus-visible::before { background:var(--accent); width:2px; }
.detail-grip:focus-visible { outline:none; }
.detail-close { position:absolute; top:12px; right:12px; width:26px; height:26px; border:0; border-radius:var(--r-sm); background:transparent; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; z-index:5; }
.detail-close:hover { background:var(--surface); color:var(--fg); }
.book-detail h2 { padding-right:30px; }

/* ===== Filter bar ===== */
.filterbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:var(--space-3); }
.fchip { font-size:var(--text-xs); font-weight:600; padding:5px 11px; border-radius:var(--radius-pill); border:1px solid var(--border);
  background:var(--surface); color:var(--fg-2); }
.fchip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
.fchip.preset { border-style:dashed; }
.fsel { font-size:var(--text-xs); border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:var(--r-sm); padding:5px 9px; }
.fcount { margin-left:auto; font-size:var(--text-xs); color:var(--muted); }
.list-ops { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; margin:0 0 var(--space-3); }
.list-ops-left, .list-ops-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.list-ops .hint { color:var(--muted); font-size:var(--text-xs); }
.pager { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:var(--text-xs); flex-wrap:wrap; justify-content:flex-end; }
.pager .page-state { font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
.pager button[disabled], .list-ops button[disabled] { opacity:.4; cursor:not-allowed; }
.page-size { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.page-size select { font-size:var(--text-xs); padding:4px 6px; }
.page-nav { display:inline-flex; align-items:center; gap:3px; }
.page-nav .tbtn { height:30px; min-width:30px; padding:0 7px; justify-content:center; }
.page-num { height:30px; min-width:30px; padding:0 6px; border:1px solid transparent; border-radius:var(--r-sm); background:transparent;
  color:var(--fg-2); font-size:var(--text-xs); font-weight:600; font-variant-numeric:tabular-nums;
  transition:background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard); }
.page-num:hover { background:var(--surface-warm); color:var(--fg); }
.page-num.on { background:var(--accent); border-color:var(--accent); color:var(--accent-on); cursor:default; }
.page-gap { min-width:18px; text-align:center; color:var(--muted); }
@media (pointer:coarse){ .page-nav .tbtn, .page-num { min-height:40px; height:40px; min-width:40px; } }

/* ===== Design system catalog ===== */
.design-pane { display:flex; flex-direction:column; gap:var(--space-4); }
.ds-section { margin-bottom:var(--space-3); }
.ds-section-title { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:6px; }
.ds-token-row { display:grid; grid-template-columns:auto minmax(140px,200px) 1fr; gap:var(--space-2); padding:4px 0; border-bottom:1px solid var(--border-soft); align-items:baseline; font-size:var(--text-xs); }
.ds-token-row:last-child { border-bottom:0; }
.ds-token-row code { font-size:11px; color:var(--fg); white-space:nowrap; }
.ds-token-row .ds-val { font-size:11px; color:var(--fg-2); font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; }
.ds-token-row .ds-use { color:var(--muted); font-size:11px; }
.ds-typo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--space-2); }
.ds-typo-cell { padding:8px 10px; background:var(--surface-warm); border:1px solid var(--border-soft); border-radius:var(--r-sm); color:var(--fg); }
.ds-typo-cell.mono { font-family:var(--font-mono); }
.ds-comp-group { margin-bottom:var(--space-3); }
.ds-comp-group-title { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:4px; }
.ds-comp-row { display:grid; grid-template-columns:auto 1fr; gap:var(--space-2); padding:3px 0; align-items:baseline; font-size:var(--text-xs); }
.ds-comp-row code { font-size:11px; color:var(--fg); white-space:nowrap; }
.ds-comp-row .ds-comp-desc { color:var(--fg-2); font-size:11px; }
@media (max-width:1100px){ .ds-token-row { grid-template-columns:1fr; gap:2px; padding:5px 0; } .ds-token-row code { font-size:var(--text-xs); } }
.ds-hero { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr); gap:var(--space-4); align-items:stretch; }
.ds-brief, .ds-principles, .ds-panel { border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); }
.ds-brief { padding:var(--space-5); }
.ds-brief h2, .ds-panel h2 { margin:0; font-size:var(--text-lg); }
.ds-brief p { margin:var(--space-2) 0 0; color:var(--fg-2); font-size:var(--text-sm); line-height:var(--leading-body); max-width:76ch; }
.ds-principles { padding:var(--space-4); display:grid; gap:var(--space-2); }
.ds-rule { display:grid; grid-template-columns:120px 1fr; gap:var(--space-3); padding:var(--space-2) 0; border-bottom:1px solid var(--border-soft); }
.ds-rule:last-child { border-bottom:0; }
.ds-rule b { font-size:var(--text-xs); color:var(--fg); }
.ds-rule span { font-size:var(--text-xs); color:var(--muted); line-height:1.4; }
.ds-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-4); }
.ds-panel { overflow:hidden; }
.ds-panel.span2 { grid-column:span 2; }
.ds-panel-head { padding:var(--space-4); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:var(--space-3); align-items:flex-start; }
.ds-panel-head small { display:block; margin-top:3px; color:var(--muted); font-size:var(--text-xs); line-height:1.35; max-width:68ch; }
.ds-panel-body { padding:var(--space-4); display:grid; gap:var(--space-3); }
.ds-row { display:grid; grid-template-columns:160px 1fr minmax(140px,.45fr); gap:var(--space-3); align-items:start; padding:var(--space-3) 0; border-bottom:1px solid var(--border-soft); }
.ds-row:last-child { border-bottom:0; }
.ds-row .name { font-weight:700; font-size:var(--text-sm); color:var(--fg); }
.ds-row .usage { color:var(--fg-2); font-size:var(--text-sm); line-height:1.4; }
.ds-row .avoid { color:var(--muted); font-size:var(--text-xs); line-height:1.35; }
.ds-swatch-row { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
.ds-swatch { display:flex; align-items:center; gap:7px; font-size:var(--text-xs); color:var(--fg-2); }
.ds-swatch i { width:12px; height:12px; border-radius:50%; border:1px solid var(--border); display:inline-block; }
.ds-preview { border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-warm); padding:var(--space-3); }
.ds-preview .list-ops { margin-bottom:var(--space-2); }
.ds-empty { text-align:center; color:var(--muted); font-size:var(--text-sm); padding:var(--space-6); border:1px dashed var(--border); border-radius:var(--r-sm); background:var(--surface); }
.ds-message { display:flex; align-items:flex-start; gap:var(--space-3); padding:var(--space-3); border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); }
.ds-message .dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; }
.ds-message b { display:block; font-size:var(--text-sm); }
.ds-message span { display:block; color:var(--muted); font-size:var(--text-xs); margin-top:2px; line-height:1.35; }
.ds-pattern-list { display:grid; gap:var(--space-2); }
.ds-pattern { display:flex; justify-content:space-between; gap:var(--space-3); align-items:center; padding:var(--space-3); border:1px solid var(--border-soft); border-radius:var(--r-sm); }
.ds-pattern b { font-size:var(--text-sm); }
.ds-pattern span { color:var(--muted); font-size:var(--text-xs); }

/* ===== ENTITY GRID + ROW (keystone) ===== */
.grid { border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface); }
.grid-h { display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--border); font-size:10px;
  text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
.erow { display:flex; align-items:flex-start; gap:var(--row-gap); padding:var(--row-y) 14px; border-bottom:1px solid var(--border-soft); cursor:pointer; position:relative; }
.erow:last-child { border-bottom:0; }
.erow:hover { background:var(--surface-warm); }
.erow.sel { background:color-mix(in oklab,var(--accent),transparent 92%); box-shadow:inset 2px 0 0 var(--accent); }
.erow.open { background:color-mix(in oklab,var(--accent),transparent 88%); box-shadow:inset 3px 0 0 var(--accent); }
.erow.stale { opacity:.6; cursor:default; }
[data-density="comfortable"] { --nav-w:260px; --detail-w:432px; --row-y:14px; --row-gap:13px; }
[data-density="compact"] { --nav-w:216px; --detail-w:352px; --row-y:6px; --row-gap:8px; }
[data-density="comfortable"] .epreview { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
[data-density="comfortable"] .nav-item { padding:8px 12px; }
[data-density="comfortable"] .pane { padding:var(--space-5) var(--space-6) 96px; }
[data-density="comfortable"] .grid-h { padding:10px 16px; }
[data-density="compact"] .erow { padding:6px 12px; }
[data-density="compact"] .erow .emeta { display:none; }
[data-density="compact"] .epreview { font-size:12px; }
[data-density="compact"] .nav-scroll { padding:8px 6px 18px; }
[data-density="compact"] .nav-item { padding:5px 8px; gap:7px; }
[data-density="compact"] .nav-item.sub { padding-left:20px; }
[data-density="compact"] .pane { padding:12px 14px 72px; }
[data-density="compact"] .grid-h { padding:6px 12px; }
[data-density="compact"] .card { padding:14px; }
.echk { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border); background:var(--surface); flex:none; margin-top:2px; display:grid; place-items:center; color:var(--accent-on); font-size:11px; }
.echk.on { background:var(--accent); border-color:var(--accent); }
.estate { width:9px; height:9px; border-radius:50%; flex:none; margin-top:5px; }
.estate[data-s="active"]{ background:var(--class-live); } .estate[data-s="flagged"]{ background:var(--state-warn); }
.estate[data-s="superseded"]{ background:transparent; box-shadow:inset 0 0 0 2px var(--class-stale); }
.estate[data-s="pending"]{ background:var(--class-dormant); } .estate[data-s="resolved"]{ background:var(--class-live); }
.estate[data-s="open"]{ background:var(--accent); } .estate[data-s="closed"]{ background:var(--class-stale); }
.ebody { flex:1; min-width:0; }
.epreview { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.emeta { font-size:var(--text-xs); color:var(--muted); margin-top:4px; display:flex; gap:9px; flex-wrap:wrap; }
.eside { display:flex; align-items:center; gap:10px; flex:none; }
.heat { font-family:var(--font-mono); font-size:var(--text-xs); display:flex; align-items:center; gap:5px; padding:2px 8px; border-radius:var(--radius-pill); border:1px solid var(--border); }
.heat .cv { color:var(--heat-cited); font-weight:700; } .heat .iv { color:var(--heat-uncited); }
.heat[data-noise="true"] { border-color:color-mix(in oklab,var(--state-warn),transparent 60%); background:color-mix(in oklab,var(--state-warn),transparent 92%); }
.bdg { font-size:10px; font-weight:700; letter-spacing:.06em; padding:2px 7px; border-radius:5px; text-transform:uppercase; border:1px solid transparent; display:inline-flex; gap:4px; align-items:center; }
.bdg.gate { color:var(--class-dormant); background:color-mix(in oklab,var(--class-dormant),transparent 88%); border-color:color-mix(in oklab,var(--class-dormant),transparent 62%); font-family:var(--font-mono); text-transform:none; }
.bdg.mb { color:var(--class-mustbuild); background:color-mix(in oklab,var(--class-mustbuild),transparent 88%); border-color:color-mix(in oklab,var(--class-mustbuild),transparent 60%); }
.bdg.scope-global { color:var(--state-danger); background:color-mix(in oklab,var(--state-danger),transparent 90%); border-color:color-mix(in oklab,var(--state-danger),transparent 60%); }
.bdg.scope-project { color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 90%); border-color:color-mix(in oklab,var(--accent),transparent 60%); }
.bdg.pri-critical { color:var(--state-danger); background:color-mix(in oklab,var(--state-danger),transparent 90%); }
.bdg.pri-high { color:var(--state-warn); background:color-mix(in oklab,var(--state-warn),transparent 90%); }
.bdg.status { color:var(--fg-2); background:var(--surface-warm); border-color:var(--border); }
.bdg.live { color:var(--class-live); background:color-mix(in oklab,var(--class-live),transparent 88%); border-color:color-mix(in oklab,var(--class-live),transparent 62%); text-transform:none; }
.rowmenu { border:0; background:transparent; color:var(--muted); font-size:18px; line-height:1; padding:0 4px; border-radius:var(--r-sm); }
.rowmenu:hover { background:var(--border); color:var(--fg); }

/* ===== Detail panel ===== */
.detail h2 { font-size:var(--text-base); margin:0 0 4px; }
.detail .dident { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--muted); }
.detail .dcontent { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:11px 13px; margin:var(--space-3) 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.dfields dd, .dl-v, .swident { overflow-wrap:anywhere; min-width:0; }
.dfields { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:var(--text-xs); margin:var(--space-3) 0; }
.dfields dt { color:var(--muted); } .dfields dd { margin:0; font-family:var(--font-mono); color:var(--fg-2); }
.dsection { margin-top:var(--space-4); }
.dsection .dsh { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:8px; }
.dlink { display:flex; align-items:center; gap:8px; font-size:var(--text-xs); padding:7px 10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:5px; cursor:pointer; }
.dlink:hover { border-color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 94%); }
.dlink:hover .dl-v { color:var(--accent); }
.dlink .dl-k { color:var(--muted); } .dlink .dl-v { font-family:var(--font-mono); color:var(--fg-2); margin-left:auto; }
.dactions { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--space-4); }
.act { font-size:var(--text-xs); font-weight:600; padding:6px 11px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface); color:var(--fg-2); display:inline-flex; gap:5px; align-items:center; }
.act:hover { border-color:var(--accent); color:var(--fg); }
.act.danger { color:var(--state-danger); border-color:color-mix(in oklab,var(--state-danger),transparent 60%); }
.act.danger:hover { background:color-mix(in oklab,var(--state-danger),transparent 90%); }
.act:disabled { opacity:.45; cursor:not-allowed; }
.act .mbp { font-size:9px; color:var(--class-mustbuild); }

/* ===== Rules: drag-to-reorder (order is the input, priority is derived) ===== */
.rule-row { align-items:center; gap:10px; }
.rule-row { transition:box-shadow var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard); }
.rule-row.dragging { opacity:.5; }
.rule-row.drag-over { box-shadow:inset 0 2px 0 var(--accent); }
.rule-row.drag-over-bottom { box-shadow:inset 0 -2px 0 var(--accent); }
.rule-grip { flex:none; width:26px; height:30px; display:grid; place-items:center; border:0; background:transparent;
  color:var(--muted); cursor:grab; border-radius:var(--r-sm); line-height:1; font-size:15px; touch-action:pan-y; }
.rule-grip:hover { background:var(--surface-warm); color:var(--fg); }
.rule-grip:active { cursor:grabbing; }
.rule-rank { flex:none; width:26px; height:26px; border-radius:var(--radius-pill); display:grid; place-items:center;
  font-family:var(--font-mono); font-size:var(--text-sm); font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 88%); border:1px solid color-mix(in oklab,var(--accent),transparent 62%); }
.rule-prio { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--muted); font-variant-numeric:tabular-nums; }
.rule-prio b { color:var(--fg-2); font-weight:600; }
.rule-editor { display:grid; gap:8px; padding:10px 0 2px; }
.rule-editor textarea { width:100%; min-height:60px; resize:vertical; font-family:var(--font-body); font-size:var(--text-sm);
  border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); color:var(--fg); padding:8px 10px; }
.rule-editor textarea:focus { border-color:var(--accent); }
.rule-editor-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.rule-reorder-note { display:flex; align-items:center; gap:7px; font-size:var(--text-xs); color:var(--fg-2);
  background:color-mix(in oklab,var(--accent),transparent 92%); border:1px solid color-mix(in oklab,var(--accent),transparent 70%);
  border-radius:var(--r-sm); padding:7px 11px; margin-bottom:var(--space-3); }
.rule-reorder-note b { color:var(--accent); font-weight:600; }
.gauge-mini { display:flex; align-items:center; gap:10px; margin-top:var(--space-2); }
.gauge-mini .gv { font-family:var(--font-mono); font-size:var(--text-lg); font-weight:700; }
.confbar { height:6px; border-radius:4px; background:var(--border); overflow:hidden; flex:1; }
.confbar i { display:block; height:100%; background:var(--class-live); }
.detail-empty { color:var(--muted); font-size:var(--text-sm); text-align:center; padding:var(--space-12) var(--space-4); }

/* ===== Backend gaps ===== */
.mb-card { border:1px solid color-mix(in oklab,var(--class-mustbuild),transparent 62%); background:color-mix(in oklab,var(--class-mustbuild),transparent 95%);
  border-radius:var(--r-sm); padding:var(--space-4); text-align:left; color:var(--fg); font-size:var(--text-sm); }
.mb-card .mid { font-size:var(--text-xs); margin-top:5px; color:var(--fg-2); line-height:1.4; }
.gate-off { border:1px solid color-mix(in oklab,var(--class-dormant),transparent 55%); background:color-mix(in oklab,var(--class-dormant),transparent 92%);
  border-radius:var(--r-md); padding:var(--space-6); text-align:center; color:var(--class-dormant); font-size:var(--text-sm); }
.gate-off .ge { font-family:var(--font-mono); font-size:var(--text-xs); margin-top:6px; }

/* ===== Sticky bulk bar ===== */
.bulkbar { position:absolute; left:var(--space-6); right:calc(var(--detail-w) + var(--space-6)); bottom:var(--space-5); z-index:20;
  display:none; align-items:center; gap:var(--space-3); padding:10px var(--space-4); background:var(--surface);
  border:1px solid var(--accent); border-radius:var(--r-md); box-shadow:var(--elev-raised); }
.area-body:not(.with-detail) .bulkbar { right:var(--space-6); }
.bulkbar.show { display:flex; animation:bulkbar-in var(--motion-base) var(--ease-standard); }
@keyframes bulkbar-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.bulkbar .bc { font-size:var(--text-sm); font-weight:700; }
.bulkbar .bsp { flex:1; }

/* ===== Panels / stats ===== */
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:0; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface); }
.card { background:transparent; border:0; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); border-radius:0; padding:var(--space-5); }
.card h3 { margin:0 0 var(--space-3); font-size:var(--text-sm); font-weight:700; display:flex; align-items:center; gap:8px; }
.card .src { margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--muted); font-weight:500; }
.card.span2 { grid-column:span 2; }
.noise-ring { width:88px; height:88px; border-radius:50%; flex:none; position:relative; display:grid; place-items:center;
  background:conic-gradient(var(--state-warn) calc(var(--p)*1%), var(--border) 0); }
.noise-ring::after { content:""; position:absolute; width:68px; height:68px; border-radius:50%; background:var(--surface); }
.noise-ring span { position:relative; font-family:var(--font-mono); font-weight:700; font-size:var(--text-lg); }
.bignum { font-family:var(--font-mono); font-size:var(--text-2xl); font-weight:700; line-height:1; }
.metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:10px; }
.metric-grid .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.metric-grid .v { font-family:var(--font-mono); font-size:var(--text-lg); font-weight:600; }
.subsys { display:flex; flex-wrap:wrap; gap:6px; }
.subsys .s { font-size:var(--text-xs); padding:3px 9px; border-radius:var(--radius-pill); border:1px solid var(--border); display:inline-flex; gap:5px; align-items:center; }
.subsys .s .sd { width:6px; height:6px; border-radius:50%; }
.subsys .s[data-s="ok"] .sd{background:var(--class-live)} .subsys .s[data-s="warn"] .sd{background:var(--state-warn)} .subsys .s[data-s="off"] .sd{background:var(--class-stale)}

/* ===== Top-cited / sweep lists ===== */
.minilist { display:flex; flex-direction:column; gap:1px; }
.mli { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-sm); }
.mli:hover { background:var(--surface-warm); }
.mli .mlc { font-family:var(--font-mono); font-size:var(--text-sm); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mli .mln { font-family:var(--font-mono); font-size:var(--text-xs); }
.mli .mln.cited { color:var(--heat-cited); } .mli .mln.uncited { color:var(--state-warn); }

/* ===== Spine instrument: noise-ratio hero (reference instrument) ===== */
.instr { display:flex; gap:var(--space-6); align-items:center; flex-wrap:wrap; padding-top:2px; }
.gauge { --p:0; width:172px; height:172px; border-radius:50%; flex:none; position:relative; display:grid; place-items:center;
  background:conic-gradient(var(--state-warn) calc(var(--p)*1%), color-mix(in oklab,var(--heat-cited),transparent 50%) 0); }
.gauge::after { content:""; position:absolute; inset:13px; border-radius:50%; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border-soft); }
.gauge .gc { position:relative; display:flex; flex-direction:column; align-items:center; }
.gauge .gv { font-family:var(--font-mono); font-weight:700; font-size:48px; line-height:1; letter-spacing:-.02em; color:var(--fg); }
.gauge .gl { margin-top:5px; font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
.instr-rail { flex:1; min-width:240px; display:flex; flex-direction:column; gap:var(--space-4); }
.instr-figs { display:flex; gap:var(--space-8); flex-wrap:wrap; }
.fig .fn { font-family:var(--font-mono); font-weight:700; font-size:var(--text-2xl); line-height:1; }
.fig .fl { font-size:11px; color:var(--muted); margin-top:5px; }
.fig.cited .fn { color:var(--heat-cited); } .fig.uncited .fn { color:var(--state-warn); }
.propbar { height:12px; border-radius:var(--radius-pill); overflow:hidden; display:flex; background:var(--border-soft); }
.propbar i { display:block; height:100%; transition:width var(--motion-base) var(--ease-standard); }
.propbar .pc { background:var(--heat-cited); } .propbar .pu { background:var(--state-warn); }
.prop-key { display:flex; gap:var(--space-5); font-size:11px; color:var(--muted); }
.prop-key i.dot { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:middle; }
.prop-key i.cited { background:var(--heat-cited); } .prop-key i.uncited { background:var(--state-warn); }
.ghost-trend { display:flex; align-items:center; gap:14px; color:var(--class-mustbuild); }
.ghost-trend .ghost-spark { width:240px; height:36px; flex:none; max-width:40%; }
.ghost-trend .gt-txt { color:var(--fg-2); font-size:var(--text-xs); }
@media (prefers-reduced-motion:reduce){ .propbar i { transition:none; } }
/* gauge where high = good (health, coverage): green fills, warn is the remainder */
.gauge.good { background:conic-gradient(var(--heat-cited) calc(var(--p)*1%), color-mix(in oklab,var(--state-warn),transparent 64%) 0); }
/* horizontal instrument band for list screens (queue depth, issue load) */
.instr-band { display:flex; align-items:center; gap:var(--space-6); flex-wrap:wrap; padding:14px 18px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); margin-bottom:14px; }
.instr-band .lead { display:flex; flex-direction:column; gap:3px; padding-right:var(--space-6); border-right:1px solid var(--border-soft); }
.instr-band .lead .ln { font-family:var(--font-mono); font-weight:700; font-size:var(--text-3xl); line-height:.92; letter-spacing:-.02em; color:var(--fg); }
.instr-band .lead .ll { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
.instr-band .bfigs { display:flex; gap:var(--space-6); flex-wrap:wrap; }
.instr-band .bfig .bn { font-family:var(--font-mono); font-weight:700; font-size:var(--text-xl); line-height:1; color:var(--fg); }
.instr-band .bfig .bl { font-size:11px; color:var(--muted); margin-top:4px; }
.instr-band .bfig.good .bn { color:var(--heat-cited); } .instr-band .bfig.warn .bn { color:var(--state-warn); } .instr-band .bfig.bad .bn { color:var(--state-danger); }
.instr-band .bspacer { flex:1; min-width:0; }

/* ===== Books-as-context ===== */
.book-row .bk-auth { color:var(--muted); }
.bk-state { font-weight:600; }
.bk-state[data-s="active"]{ color:var(--class-live); } .bk-state[data-s="review"]{ color:var(--state-warn); }
.bk-state[data-s="processing"]{ color:var(--class-dormant); } .bk-state[data-s="loaded"]{ color:var(--fg-2); } .bk-state[data-s="stale"]{ color:var(--class-stale); }
.bk-dom { color:var(--fg-2); }
.bk-sg, .bk-prog { font-size:10px; color:var(--class-mustbuild); font-weight:700; }
.bk-flag { color:var(--state-warn); font-family:var(--font-mono); }
.bk-statechip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:var(--radius-pill); border:1px solid var(--border); background:var(--surface-warm); font-size:var(--text-xs); color:var(--fg-2); }
.bk-statechip .estate { width:7px; height:7px; }
/* book workspace — full-width, vertical facet nav (no off-screen tabs) */
.book-ws { display:flex; flex-direction:column; min-height:0; height:100%; }
.bw-head { display:flex; align-items:center; gap:12px; padding:14px var(--space-6); flex-wrap:wrap; }
.bw-back { flex:none; }
.bw-flagchip { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--state-warn); padding:4px 10px; border-radius:var(--radius-pill); border:1px solid color-mix(in oklab,var(--state-warn),transparent 65%); background:color-mix(in oklab,var(--state-warn),transparent 92%); }
.bw-grid { flex:1; min-height:0; display:grid; grid-template-columns:236px minmax(0,1fr); border-top:1px solid var(--border); }
.bw-nav { display:flex; flex-direction:column; gap:2px; padding:14px 10px; border-right:1px solid var(--border); background:color-mix(in oklab,var(--surface),var(--bg) 28%); overflow-y:auto; }
.bw-tab { appearance:none; text-align:left; border:0; background:transparent; cursor:pointer; padding:9px 12px; border-radius:var(--r-sm); display:flex; flex-direction:column; gap:2px; color:var(--fg-2); transition:background var(--motion-fast) var(--ease-standard); }
.bw-tab:hover { background:color-mix(in oklab,var(--surface),var(--fg) 4%); }
.bw-tab[aria-selected="true"]{ background:color-mix(in oklab,var(--accent),transparent 88%); }
.bw-tab[aria-selected="true"] .bw-tab-lbl { color:var(--accent); }
.bw-tab-lbl { display:flex; align-items:center; gap:7px; font-size:var(--text-sm); font-weight:650; color:var(--fg); }
.bw-tab-n { font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--muted); }
.bw-tab[aria-selected="true"] .bw-tab-n { color:var(--accent); }
.bw-tab-dot { width:7px; height:7px; border-radius:50%; background:var(--class-mustbuild); }
.bw-tab-sub { font-size:11px; color:var(--muted); }
.bw-body { padding:18px var(--space-6) var(--space-8); overflow-y:auto; min-width:0; }
.bw-body > .bk-run:first-child, .bw-body > .operator-note:first-child { margin-top:0; }
@media (max-width:980px){ .bw-grid { grid-template-columns:1fr; } .bw-nav { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--border); } .bw-tab { flex:1 1 auto; } .bw-tab-sub { display:none; } }
/* process facet */
.bk-run { display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:14px; }
.bk-runfig { text-align:center; } .bk-runfig .rf-n { font-family:var(--font-mono); font-weight:700; font-size:var(--text-xl); line-height:1; } .bk-runfig .rf-l { font-size:10px; color:var(--muted); margin-top:4px; }
.bk-arrow { color:var(--muted); font-size:18px; }
.bk-runcost { margin-left:auto; text-align:right; font-family:var(--font-mono); font-weight:700; font-size:var(--text-sm); } .bk-runcost span { display:block; font-family:var(--font-body); font-weight:400; font-size:10px; color:var(--muted); }
.pipeline { display:flex; align-items:center; gap:0; margin:8px 0 16px; }
.pl-step { display:flex; align-items:center; gap:8px; } .pl-step .pl-dot { width:11px; height:11px; border-radius:50%; flex:none; border:2px solid var(--border); background:var(--surface); }
.pl-step .pl-txt { display:flex; flex-direction:column; line-height:1.15; } .pl-step .pl-txt b { font-size:var(--text-sm); } .pl-step .pl-txt span { font-size:10px; color:var(--muted); }
.pl-step.done .pl-dot { background:var(--class-live); border-color:var(--class-live); }
.pl-step.now .pl-dot { background:var(--class-dormant); border-color:var(--class-dormant); box-shadow:0 0 0 3px color-mix(in oklab,var(--class-dormant),transparent 78%); }
.pl-step.todo .pl-txt b, .pl-step.todo .pl-txt span { color:var(--muted); }
.pl-bar { flex:1; height:2px; background:var(--border); margin:0 8px; align-self:flex-start; margin-top:5px; }
/* wiki facet */
.bk-layers { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.bk-layer { padding:8px 11px; border:1px solid var(--border); border-radius:var(--r-sm); font-size:var(--text-sm); color:var(--fg-2); } .bk-layer i { color:var(--muted); font-style:normal; font-size:var(--text-xs); }
.bk-layer .ly-n { font-family:var(--font-mono); font-weight:700; color:var(--muted); margin-right:8px; }
.bk-layer.on { border-color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 92%); } .bk-layer.on .ly-n { color:var(--accent); }
.bk-concepts { display:flex; flex-direction:column; gap:8px; }
.bk-concept { padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-sm); }
.bc-head { display:flex; align-items:center; gap:8px; } .bc-head b { font-size:var(--text-sm); flex:1; }
.bc-conf { font-family:var(--font-mono); font-size:10px; font-weight:700; padding:1px 6px; border-radius:var(--radius-pill); }
.bc-conf[data-lvl="ok"]{ color:var(--heat-cited); background:color-mix(in oklab,var(--heat-cited),transparent 88%); }
.bc-conf[data-lvl="mid"]{ color:var(--state-warn); background:color-mix(in oklab,var(--state-warn),transparent 88%); }
.bc-conf[data-lvl="low"]{ color:var(--state-danger); background:color-mix(in oklab,var(--state-danger),transparent 88%); }
.bc-links { display:flex; flex-wrap:wrap; gap:5px; margin:7px 0 5px; }
.bc-link { font-family:var(--font-mono); font-size:10px; color:var(--accent); background:var(--surface-warm); padding:1px 6px; border-radius:4px; }
.bc-src { font-size:10px; color:var(--muted); }
/* terms facet */
.bk-terms { display:flex; flex-direction:column; gap:8px; }
.bk-term { padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-sm); }
.bt-canon { display:flex; align-items:center; gap:8px; margin-bottom:7px; } .bt-canon b { font-size:var(--text-sm); }
.bt-mark { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:4px; }
.bt-mark.edited { color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 88%); } .bt-mark.auto { color:var(--muted); background:var(--surface-warm); }
.bt-alias { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.bt-chip { display:inline-flex; align-items:center; gap:4px; font-size:var(--text-xs); padding:2px 4px 2px 9px; border-radius:var(--radius-pill); border:1px solid var(--border); background:var(--surface); }
.bt-x { appearance:none; border:0; background:transparent; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; padding:0 2px; } .bt-x:hover { color:var(--state-danger); }
.bt-add { appearance:none; border:1px dashed var(--border); background:transparent; cursor:pointer; color:var(--muted); font-size:var(--text-xs); padding:3px 9px; border-radius:var(--radius-pill); } .bt-add:hover { color:var(--accent); border-color:var(--accent); }
/* domains facet */
.bk-dom-card { padding:14px; border:1px solid var(--border); border-radius:var(--r-md); }
.bk-dom-card.on { border-color:color-mix(in oklab,var(--class-live),transparent 50%); }
.bk-dom-card.sg { border-color:color-mix(in oklab,var(--class-mustbuild),transparent 50%); background:color-mix(in oklab,var(--class-mustbuild),transparent 95%); }
.bd-top { display:flex; align-items:center; gap:14px; }
.bd-conf { font-family:var(--font-mono); font-weight:700; font-size:var(--text-2xl); line-height:1; flex:none; }
.bk-dom-card.on .bd-conf { color:var(--class-live); } .bk-dom-card.sg .bd-conf { color:var(--class-mustbuild); }
.bd-meta b { display:block; font-size:var(--text-sm); } .bd-meta span { font-size:var(--text-xs); color:var(--muted); }
.bd-state.on { margin-top:12px; color:var(--class-live); font-size:var(--text-sm); font-weight:600; }
.bd-actions { display:flex; gap:8px; margin-top:14px; }
/* add-book modal */
.addbook { padding:4px 2px; }
.ab-drop { display:flex; align-items:center; gap:14px; padding:18px; border:1.5px dashed var(--border); border-radius:var(--r-md); margin-bottom:16px; }
.ab-drop .ab-dropi { width:34px; height:34px; color:var(--muted); flex:none; } .ab-drop .ab-dropi .nav-ico { width:34px; height:34px; }
.ab-drop .ab-hint { font-size:var(--text-xs); color:var(--muted); margin-top:3px; }
.ab-f { display:flex; flex-direction:column; gap:5px; } .ab-f span { font-size:var(--text-xs); color:var(--fg-2); font-weight:600; }
.ab-cost { display:flex; justify-content:space-between; align-items:center; padding:10px 13px; margin:14px 0; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface-warm); } .ab-cost span { font-size:var(--text-sm); color:var(--fg-2); } .ab-cost b { font-family:var(--font-mono); }
@media (prefers-reduced-motion:reduce){ .pl-step.now .pl-dot { box-shadow:none; } }

/* ===== Settings (Switch Row) ===== */
.swgroup { margin-top:var(--space-5); }
.gh { font-size:var(--text-sm); font-weight:700; margin-bottom:var(--space-1); }
.swgroup .gh { font-size:var(--text-sm); font-weight:700; margin-bottom:var(--space-1); }
.swgroup .gd { font-size:var(--text-xs); color:var(--muted); margin-bottom:var(--space-3); }
.swrows { border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface); }
.swrow { display:grid; grid-template-columns:1fr minmax(170px,250px); gap:var(--space-4); padding:13px var(--space-5); border-bottom:1px solid var(--border-soft); align-items:start; }
.swrow:last-child { border-bottom:0; }
.swrow.dirty { background:color-mix(in oklab,var(--accent),transparent 94%); }
.swrow.stale { background:color-mix(in oklab,var(--class-stale),transparent 95%); }
.swrow.disabled .swctrl { opacity:.5; pointer-events:none; }
.swtop { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.cdot { width:9px; height:9px; border-radius:50%; flex:none; }
.cdot[data-c="live"]{background:var(--class-live)} .cdot[data-c="dormant"]{background:var(--class-dormant)}
.cdot[data-c="stale"]{background:transparent;box-shadow:inset 0 0 0 2px var(--class-stale)} .cdot[data-c="mustbuild"]{background:var(--class-mustbuild)}
.swlabel { font-weight:600; font-size:var(--text-sm); }
.swident { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--fg-2); background:var(--surface-warm); border:1px solid var(--border); padding:2px 7px; border-radius:5px; cursor:copy; transition:border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
.swident:hover { border-color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 92%); }
.sweffect { font-size:var(--text-xs); color:var(--fg-2); margin-top:6px; max-width:62ch; }
.swdep { font-size:var(--text-xs); margin-top:6px; color:var(--class-dormant); } .swdep.ok { color:var(--class-live); } .swdep .g { font-family:var(--font-mono); }
.swmeta { font-size:var(--text-xs); color:var(--muted); margin-top:6px; display:flex; gap:10px; } .swmeta .ev { font-family:var(--font-mono); }
.swside { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.swbadges { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
.rbadge { font-size:9px; font-weight:700; padding:3px 7px; border-radius:5px; text-transform:uppercase; border:1px solid transparent; }
.rbadge.live { color:var(--class-live); background:color-mix(in oklab,var(--class-live),transparent 88%); border-color:color-mix(in oklab,var(--class-live),transparent 65%); }
.rbadge.restart { color:var(--state-warn); background:color-mix(in oklab,var(--state-warn),transparent 88%); border-color:color-mix(in oklab,var(--state-warn),transparent 60%); }
.rbadge.noeffect { color:var(--class-stale); background:color-mix(in oklab,var(--class-stale),transparent 90%); }
.swctrl { display:flex; flex-direction:column; align-items:flex-end; gap:5px; width:100%; }
.toggle { width:42px; height:24px; border-radius:var(--radius-pill); background:var(--border); border:0; position:relative; flex:none; transition:background var(--motion-fast); }
.toggle::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform var(--motion-fast); }
.toggle[aria-checked="true"] { background:var(--class-live); } .toggle[aria-checked="true"]::after { transform:translateX(18px); }
.toggle.danger[aria-checked="true"] { background:var(--state-danger); }
.stepper { display:inline-flex; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; background:var(--surface); }
.stepper button { border:0; background:var(--surface-warm); width:28px; height:30px; color:var(--fg-2); font-size:15px; }
.stepper input { border:0; width:64px; text-align:center; font-family:var(--font-mono); font-size:var(--text-sm); background:transparent; color:var(--fg); }
.txt,.sel2 { border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); color:var(--fg); font-size:var(--text-sm); padding:6px 9px; width:100%; font-family:var(--font-mono); }
.sel2:disabled { background:var(--surface-warm); color:var(--muted); }
.secret .srow { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
/* Inline secret reveal — mirrors live VaultView: token = bg-muted/border pill (text-xs green),
   timer = text-[10px] amber, ghost icon-sm actions; the line sits mt-2 under the name. */
.reveal-inline { display:flex; align-items:center; gap:8px; margin-top:8px; animation:revealIn var(--motion-fast) var(--ease-standard); }
.reveal-inline .rv-key { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--reveal-key); padding:4px 8px; border:1px solid var(--border); border-radius:5px; background:var(--surface-warm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:20rem; user-select:all; }
.reveal-inline .rv-timer { font-family:var(--font-body); font-size:10px; color:var(--reveal-timer); white-space:nowrap; }
.reveal-inline .rv-ic { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; flex:none; border:0; border-radius:var(--r-sm); background:transparent; color:var(--muted); cursor:pointer; }
.reveal-inline .rv-ic:hover { color:var(--fg-2); background:var(--surface-warm); }
@keyframes revealIn { from { opacity:0; } to { opacity:1; } }

/* Vault status card — full width, 3 fields spread across (mirrors live Card + grid grid-cols-3 gap-6) */
.vault-status { border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:var(--space-5); margin-bottom:16px; }
.vault-status .vs-title { font-size:var(--text-sm); font-weight:500; color:var(--muted); margin:0 0 var(--space-4); }
.vault-status .vs-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.vault-status .vs-field .vs-k { font-size:var(--text-xs); color:var(--muted); margin:0 0 5px; }
.vault-status .vs-field .vs-v { font-size:var(--text-sm); font-family:var(--font-mono); color:var(--fg); }
.vault-status .vs-field .vs-v.sans { font-family:var(--font-body); }
/* Fingerprint — masked by default; identifying material is revealed only on explicit action. */
.fp-field { display:flex; align-items:center; gap:6px; }
.fp-field .fp-val { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--fg); letter-spacing:.04em; user-select:all; }
.fp-field .fp-val[data-masked] { color:var(--muted); letter-spacing:.18em; user-select:none; }
.fp-ic { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; flex:none; border:0; border-radius:var(--r-sm); background:transparent; color:var(--muted); cursor:pointer; }
.fp-ic:hover { color:var(--fg-2); background:var(--surface-warm); }
.fp-edit { margin-left:4px; font-size:var(--text-xs); font-weight:500; color:var(--reveal-timer); background:transparent; border:0; cursor:pointer; padding:3px 6px; border-radius:var(--r-sm); }
.fp-edit:hover { background:color-mix(in oklab,var(--reveal-timer),transparent 88%); }
/* Key-rotation modal bits */
.rk-warn { display:flex; gap:10px; align-items:flex-start; border:1px solid color-mix(in oklab,var(--state-danger),transparent 55%); background:color-mix(in oklab,var(--state-danger),transparent 92%); border-radius:var(--r-md); padding:11px 13px; margin-bottom:16px; }
.rk-warn .rk-ic { color:var(--state-danger); flex:none; margin-top:1px; }
.rk-warn p { margin:0; font-size:var(--text-sm); color:var(--fg-2); line-height:1.5; }
.rk-warn b { color:var(--fg); }
.rk-steps { list-style:none; margin:0 0 16px; padding:0; counter-reset:rk; }
.rk-steps li { position:relative; padding:0 0 0 28px; margin:0 0 8px; font-size:var(--text-sm); color:var(--fg-2); line-height:1.45; counter-increment:rk; }
.rk-steps li::before { content:counter(rk); position:absolute; left:0; top:0; width:19px; height:19px; border-radius:50%; background:var(--surface-warm); border:1px solid var(--border); color:var(--muted); font-size:11px; font-weight:700; display:grid; place-items:center; }
.rk-field { display:block; margin-bottom:13px; }
.rk-field .rk-lab { font-size:var(--text-sm); font-weight:500; color:var(--fg); margin-bottom:5px; display:block; }
.rk-field input.txt { width:100%; }
.rk-check { display:flex; gap:9px; align-items:flex-start; font-size:var(--text-sm); color:var(--fg-2); line-height:1.45; margin-bottom:14px; cursor:pointer; }
.rk-check input { margin-top:2px; flex:none; width:15px; height:15px; accent-color:var(--state-danger); }
.tbtn.danger { background:var(--state-danger); border-color:var(--state-danger); color:#fff; }
.tbtn.danger:disabled { opacity:.42; cursor:not-allowed; }
.rk-fpline { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--muted); margin:0 0 4px; }

/* ── Overview (home) — summary across every section, each card links deeper ── */
.ov-hero { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.ov-hero .ov-hi h1 { margin:0 0 4px; font-size:var(--text-2xl); font-weight:700; letter-spacing:var(--tracking-display); }
.ov-hero .ov-hi p { margin:0; font-size:var(--text-sm); color:var(--muted); }
.ov-hero .ov-id { display:flex; gap:8px; align-items:center; }
.ov-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:14px; }
.ov-card { border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:var(--space-4) var(--space-5); text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:3px; font:inherit; color:inherit; transition:border-color var(--motion-fast) var(--ease-standard); }
.ov-card:hover { border-color:var(--accent); background:var(--surface-warm); }
.ov-card .ov-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.ov-ico { width:18px; height:18px; flex:none; }
.ov-card .ov-ico { color:var(--accent); }
.ov-card .ov-name { font-size:var(--text-sm); font-weight:600; color:var(--fg); }
.ov-card .ov-arr { margin-left:auto; color:var(--muted); font-size:13px; }
.ov-card .ov-big { font-size:var(--text-2xl); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.05; }
.ov-card .ov-sub { font-size:var(--text-xs); color:var(--muted); line-height:1.4; }
.ov-card .ov-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
.ov-attention { border:1px solid color-mix(in oklab,var(--state-warn),transparent 60%); border-radius:var(--r-md); background:color-mix(in oklab,var(--state-warn),transparent 93%); padding:var(--space-4) var(--space-5); margin-bottom:16px; }
.ov-attention h3 { margin:0 0 9px; font-size:var(--text-sm); font-weight:700; color:var(--state-warn); display:flex; align-items:center; gap:7px; }
.ov-att-list { display:flex; flex-direction:column; gap:7px; }
.ov-att-row { display:flex; align-items:center; gap:10px; font-size:var(--text-sm); color:var(--fg-2); background:transparent; border:0; padding:5px 0; cursor:pointer; text-align:left; width:100%; }
.ov-att-row:hover { color:var(--fg); }
.ov-att-row .oa-dot { width:7px; height:7px; border-radius:50%; flex:none; }
.ov-att-row .oa-go { margin-left:auto; font-size:var(--text-xs); color:var(--muted); }
.ov-section-t { font-size:var(--text-xs); font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:22px 0 11px; }

/* ── Overview visuals — built from honest snapshots of live arrays (no fabricated history) ── */
.ov-viz { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; margin-bottom:6px; }
.ov-viz .vz { border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:var(--space-4) var(--space-5); }
.ov-viz .vz h4 { margin:0 0 14px; font-size:var(--text-sm); font-weight:600; color:var(--fg); display:flex; align-items:center; gap:7px; }
.ov-viz .vz h4 .src { margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--muted); font-weight:500; }
/* donut (conic) — composition by category */
.donut-row { display:flex; align-items:center; gap:18px; }
.donut { --p:0; width:118px; height:118px; border-radius:50%; flex:none; position:relative; display:grid; place-items:center; background:conic-gradient(var(--c1,var(--accent)) calc(var(--s1,0)*1%), var(--c2,var(--class-live)) 0 calc(var(--s2,0)*1%), var(--c3,var(--state-warn)) 0 calc(var(--s3,0)*1%), var(--c4,var(--muted)) 0); }
.donut::after { content:""; position:absolute; inset:15px; border-radius:50%; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border-soft); }
.donut .dn { position:relative; font-family:var(--font-mono); font-weight:700; font-size:var(--text-xl); line-height:1; }
.donut .dl { position:relative; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:3px; }
.donut-legend { display:flex; flex-direction:column; gap:7px; flex:1; min-width:0; }
.dlg { display:flex; align-items:center; gap:8px; font-size:var(--text-sm); }
.dlg .sw { width:10px; height:10px; border-radius:3px; flex:none; }
