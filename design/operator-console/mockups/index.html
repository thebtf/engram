}

/* Vault fingerprint: masked by default, revealed only on explicit action; auto re-masks after 30s.
   "Изменить" opens the key-rotation flow (rotation = decrypt-all → re-encrypt under the new key). */
function wireVaultFingerprint(pane){
  const fp=pane.querySelector('#vaultFp'); if(!fp) return;
  const val=fp.querySelector('.fp-val'), reveal=fp.querySelector('#fpReveal'), copy=fp.querySelector('#fpCopy'), edit=fp.querySelector('#fpEdit');
  let timer=null;
  function mask(){ val.setAttribute('data-masked',''); val.textContent='•••• •••• •••• ••••'; reveal.innerHTML=SVG_EYE; reveal.title='Показать'; copy.hidden=true; if(timer){ clearTimeout(timer); timer=null; } }
  function show(){ val.removeAttribute('data-masked'); val.textContent=VAULT_KEY.fingerprint.replace(/(.{4})(?=.)/g,'$1 ').trim(); reveal.innerHTML=SVG_EYEOFF; reveal.title='Скрыть'; copy.hidden=false; if(timer) clearTimeout(timer); timer=setTimeout(mask,30000); }
  reveal.onclick=()=>{ val.hasAttribute('data-masked')?show():mask(); };
  copy.onclick=()=>{ try{ navigator.clipboard?.writeText(VAULT_KEY.fingerprint); }catch(_){} copy.innerHTML=SVG_CHECK; copy.style.color='var(--reveal-key)'; setTimeout(()=>{ copy.innerHTML=SVG_COPY; copy.style.color=''; },2000); };
  edit.onclick=openKeyRotationModal;
}

/* Key rotation — потенциально разрушительное действие. Контракт: смена отпечатка НЕ переписывает
   поле, а запускает rotate = расшифровать каждый секрет старым ключом и заново зашифровать новым.
   UI требует: текущий ключ (для decrypt) + новый ключ (×2 для encrypt) + явное подтверждение. */
function openKeyRotationModal(){
  const n=CREDS.length;
  openModal(`<h2>Ротация ключа vault</h2>
    <div class="mb">
      <div class="rk-warn"><span class="rk-ic">${SVG_TRASH.replace('width="14" height="14"','width="18" height="18"')}</span>
        <p><b>Опасное действие.</b> Отпечаток — производная от мастер-ключа, его нельзя просто «вписать». Смена ключа перешифровывает <b>все ${n} секрет(ов)</b>: каждый расшифровывается текущим ключом и заново шифруется новым. Если текущий ключ неверен — расшифровка невозможна, и секреты будут потеряны.</p></div>
      <ol class="rk-steps">
        <li>Текущий ключ расшифровывает каждый секрет в памяти.</li>
        <li>Каждый секрет заново шифруется новым ключом.</li>
        <li>Новый отпечаток вычисляется из нового ключа (не вводится вручную).</li>
        <li>Старый ключ уничтожается. Операция записывается в Журнал доступа.</li>
      </ol>
      <p class="rk-fpline">текущий отпечаток · <span id="rkCurFp">скрыт</span> <button class="fp-edit" id="rkShowCur" style="color:var(--reveal-timer)">показать</button></p>
      <label class="rk-field"><span class="rk-lab">Текущий ключ vault (для расшифровки)</span><input class="txt" id="rkCur" type="password" placeholder="ENGRAM_VAULT_KEY — текущее значение"></label>
      <label class="rk-field"><span class="rk-lab">Новый ключ vault</span><input class="txt" id="rkNew" type="password" placeholder="новый мастер-ключ"></label>
      <label class="rk-field"><span class="rk-lab">Повторите новый ключ</span><input class="txt" id="rkNew2" type="password" placeholder="ещё раз, для сверки"></label>
      <label class="rk-check"><input type="checkbox" id="rkAck"><span>Понимаю, что все ${n} секрет(ов) будут перешифрованы, и подтверждаю наличие резервной копии текущего ключа.</span></label>
    </div>
    <div class="mf"><button class="tbtn" onclick="closeModal()">Отмена</button><button class="tbtn danger" id="rkGo" disabled>Перешифровать и сменить ключ</button></div>`);
  const cur=$('#rkCur'), nw=$('#rkNew'), nw2=$('#rkNew2'), ack=$('#rkAck'), go=$('#rkGo');
  let curShown=false;
  $('#rkShowCur').onclick=(e)=>{ curShown=!curShown; $('#rkCurFp').textContent=curShown?VAULT_KEY.fingerprint:'скрыт'; e.target.textContent=curShown?'скрыть':'показать'; };
  function validate(){ go.disabled=!(cur.value.trim() && nw.value.trim() && nw.value===nw2.value && ack.checked); }
  [cur,nw,nw2].forEach(i=>i.oninput=validate); ack.onchange=validate;
  go.onclick=()=>{
    if(nw.value!==nw2.value){ toast('Новый ключ не совпадает'); return; }
    closeModal();
    // mock: derive a new fingerprint from the (mock) new key, re-encrypt happens server-side
    const fpHex='0123456789abcdef';
    let nf=''; for(let i=0;i<16;i++) nf+=fpHex[(nw.value.charCodeAt(i%nw.value.length)+i*7)%16];
    VAULT_KEY.fingerprint=nf;
    toast(`Ключ сменён · ${n} секрет(ов) перешифровано · записано в Журнал`);
    renderArea();   // re-render so the field re-masks under the new fingerprint
  };
}

/* Left-rail collapse (desktop) — persists across refresh, like detail width.
   Collapsed nav shows an icon rail; hovering it "peeks" the full panel back over content.
   The peek is JS-managed (not :hover) so that clicking "collapse" — which leaves the cursor
   sitting on the nav — does NOT instantly re-expand it: peek is suppressed until the pointer
   actually leaves the rail once. */
const NAV_COLLAPSE_KEY='engram.console.navCollapsed';
const appEl=document.querySelector('.app'), navEl=$('#nav');
let peekSuppressed=false;
function setNavCollapsed(on){
  appEl.classList.toggle('nav-collapsed', on);
  if(!on){ appEl.classList.remove('nav-peek'); peekSuppressed=false; }
  const btn=$('#navCollapse');
  if(btn){ btn.setAttribute('aria-pressed', on?'true':'false'); btn.title = on?'Развернуть меню':'Свернуть меню'; btn.setAttribute('aria-label', btn.title); }
  try{ localStorage.setItem(NAV_COLLAPSE_KEY, on?'1':'0'); }catch(_){}
}
$('#navCollapse').onclick=()=>{
  const collapsing=!appEl.classList.contains('nav-collapsed');
  if(collapsing) peekSuppressed=true;   // cursor stays on nav after the click — don't peek until it leaves
  setNavCollapsed(collapsing);
};
navEl.addEventListener('pointerenter',()=>{ if(appEl.classList.contains('nav-collapsed') && !peekSuppressed) appEl.classList.add('nav-peek'); });
navEl.addEventListener('pointerleave',()=>{ appEl.classList.remove('nav-peek'); peekSuppressed=false; });
try{ if(localStorage.getItem(NAV_COLLAPSE_KEY)==='1') setNavCollapsed(true); }catch(_){}

        <button class="ag-submit" type="submit">Войти</button>
      </form>
      <div class="ag-foot">Нет аккаунта? Оператор заводится администратором engram-сервера.</div>`;
    pane.querySelectorAll('[data-prov]').forEach(b=>b.onclick=()=>doLogin(b.dataset.prov));
    const rem=$('#agRemember'); if(rem) rem.onclick=()=>rem.setAttribute('aria-checked', rem.getAttribute('aria-checked')!=='true');
    $('#agPeek').onclick=()=>{ agPeek=!agPeek; renderAuthPane(); };
    $('#agForgot').onclick=(e)=>{ e.preventDefault(); toast('Сброс пароля уходит на email оператора'); };
    $('#agPwForm').onsubmit=(e)=>{
      e.preventDefault();
      const email=$('#agEmail').value.trim(), pw=$('#agPw').value;
      if(!email || !pw){ authErr('Заполните email и пароль.'); return; }
      doLogin('password');
    };
  } else {
    pane.innerHTML=`
      <div class="ag-legacy-note"><span class="mk">!</span><div><b>Запасной вход.</b> Прямой вход админским API-ключом в обход OAuth. Ключ один на сервер, не привязан к оператору и не оставляет личного следа. Используйте, только когда OAuth недоступен. Отключается в Настройках → Общие → Доступ.</div></div>
      <form id="agKeyForm">
        <div class="ag-field"><label for="agKey">Админский API-ключ</label>
          <input class="ag-input mono" id="agKey" type="password" placeholder="engram_admin_••••••••••••••••" autocomplete="off"></div>
        <button class="ag-submit" type="submit">Войти по ключу</button>
      </form>
      <div class="ag-foot">Ключ задаётся переменной окружения сервера и проверяется на стороне engram.</div>`;
    $('#agKeyForm').onsubmit=(e)=>{
      e.preventDefault();
      const k=$('#agKey').value.trim();
      if(k.length<8){ authErr('Ключ слишком короткий — проверьте значение.'); return; }
      doLogin('legacy');
    };
  }
}

/* ---- identity chip (topbar) ---- */
function avatarHtml(user, cls='iav'){
  return `<span class="${cls}">${escapeHtml(user?.initials||'·')}</span>`;
}
function renderIdentityChip(){
  const chip=$('#identityChip'); if(!chip) return;
  if(!AUTH.signedIn || !AUTH.user){
    chip.innerHTML=`<span class="iav" style="background:var(--muted)">·</span><span class="iwho"><span class="iname">Не выполнен вход</span><span class="imeta">гость</span></span>`;
    chip.title='Войти в консоль'; chip.onclick=showAuthGate; return;
  }
  const u=AUTH.user;
  chip.innerHTML=`${avatarHtml(u)}<span class="iwho"><span class="iname">${escapeHtml(u.name)}</span><span class="imeta">${escapeHtml(providerName(u.via))}</span></span><span class="icaret">▾</span>`;
  chip.title=`${u.name} · ${u.email}`;
  chip.onclick=(e)=>{ e.stopPropagation(); openIdentityMenu(chip); };
}
function openIdentityMenu(anchor){
  const u=AUTH.user; if(!u) return;
  const provMark = PROVIDER_MARK[u.via] || '';
  const html=`<div class="idmenu">
    <div class="idm-head">
      ${avatarHtml(u)}
      <div class="idm-id">
        <b>${escapeHtml(u.name)}</b><span>${escapeHtml(u.email)}</span>
        <span class="idm-via">${provMark}${escapeHtml(providerName(u.via))}</span>
      </div>
    </div>
    <div class="idm-list">
      <button class="idm-item" data-act="profile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.4c0-2.5 2.2-4 5-4s5 1.5 5 4"/></svg>Профиль и настройки</button>
      <button class="idm-item" data-act="sessions"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="3.4" width="11.6" height="7.4" rx="1.3"/><path d="M5.6 13.4h4.8M8 10.8v2.6"/></svg>Активные сеансы<span class="cnt" style="margin-left:auto">${AUTH_SESSIONS.length}</span></button>
      <button class="idm-item" data-act="settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8V3.4M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6 11.3 4.7M4.7 11.3 3.6 12.4M12.4 12.4 11.3 11.3M4.7 4.7 3.6 3.6"/></svg>Настройки консоли</button>
      <div class="idm-sep"></div>
      <button class="idm-item danger" data-act="logout"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11.5v1.4a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1V3.1a1 1 0 0 1 1-1H9a1 1 0 0 1 1 1v1.4"/><path d="M7 8h7M11.6 5.4 14.2 8l-2.6 2.6"/></svg>Выйти из консоли</button>
    </div>
  </div>`;
  openPopoverAt(anchor, html);
  $('#popover').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act; closePopover();
    if(a==='profile') openProfileModal();
    else if(a==='sessions') openProfileModal('sessions');
    else if(a==='settings') openSettingsModal('general');
    else if(a==='logout') doLogout();
  });
}
/* anchor a popover under a topbar element */
function openPopoverAt(anchor, html){
  const pop=$('#popover'); pop.innerHTML=html; pop.classList.add('show');
  const r=anchor.getBoundingClientRect(), pw=pop.offsetWidth||260;
  let left=Math.min(r.right-pw, window.innerWidth-pw-10); left=Math.max(10,left);
  pop.style.left=left+'px'; pop.style.top=(r.bottom+8)+'px';
}
function closePopover(){ $('#popover').classList.remove('show'); }

/* ---- profile modal ---- */
function openProfileModal(scrollTo){
  const u=AUTH.user; if(!u){ showAuthGate(); return; }
  const p=AUTH.prefs;
  openModal(`<div class="profile-shell">
    <div class="profile-hero">
      ${avatarHtml(u,'iav')}
      <div style="flex:1;min-width:0"><h2>${escapeHtml(u.name)}</h2><p>${escapeHtml(u.email)} · вход через ${escapeHtml(providerName(u.via))}</p></div>
      <button class="tbtn" onclick="closeModal()" aria-label="Закрыть">×</button>
    </div>
    <div class="profile-body" id="profileBody"></div>
  </div>`, 'settings-modal');
  const body=$('#profileBody');

  body.appendChild(settingsSection('Профиль', [
    settingRow('Отображаемое имя','Как оператор подписывается в задачах, тредах и аудите.',
      `<input class="txt" id="pfName" value="${escapeHtml(u.name)}" style="width:240px">`),
    settingRow('Email','Адрес из провайдера входа. Меняется на стороне провайдера.',
      `<span class="tag">${escapeHtml(u.email)}</span>`),
    settingRow('Роль','Объём прав в консоли. Один оператор — обычно «operator».',
      `<div class="seg"><button data-role="operator" aria-pressed="${p.role==='operator'}">operator</button><button data-role="viewer" aria-pressed="${p.role==='viewer'}">viewer</button></div>`),
  ]));

  body.appendChild(settingsSection('Уведомления', [
    settingRow('Сводка дня','Утренний дайджест: память на проверке, шум, состояние сервера.',
      `<span class="toggle" id="pfDigest" role="switch" aria-checked="${p.notifyDigest}"></span>`),
    settingRow('Упоминания','Когда агент адресует задачу или тред оператору.',
      `<span class="toggle" id="pfMent" role="switch" aria-checked="${p.notifyMentions}"></span>`),
    settingRow('Инциденты','Деградация здоровья, всплеск шума, сбой ingest-очереди.',
      `<span class="toggle" id="pfInc" role="switch" aria-checked="${p.notifyIncidents}"></span>`),
  ]));

  const lang=p.lang;
  body.appendChild(settingsSection('Предпочтения', [
    settingRow('Язык интерфейса','Операторские подписи; технические идентификаторы остаются как есть.',
      `<div class="seg"><button data-plang="ru" aria-pressed="${lang==='ru'}">Русский</button><button data-plang="en" aria-pressed="${lang==='en'}">English</button></div>`),
    settingRow('Тема','Личная тема перекрывает общесистемную при входе.',
      `<div class="seg"><button data-ptheme="dark" aria-pressed="${(document.documentElement.dataset.theme||'dark')==='dark'}">Тёмная</button><button data-ptheme="light" aria-pressed="${(document.documentElement.dataset.theme)==='light'}">Светлая</button></div>`),
  ]));

  const sess=el('section','settings-section'); sess.id='pfSessions';
  sess.innerHTML=`<div class="settings-section-title">Активные сеансы</div>`+
    AUTH_SESSIONS.map(s=>`<div class="psession">
      <span class="ps-ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="3.2" width="11.6" height="7.6" rx="1.2"/><path d="M5.6 13.4h4.8M8 10.8v2.6"/></svg></span>
      <div class="ps-meta"><b>${escapeHtml(s.dev)}</b><span>${escapeHtml(s.ua)} · ${escapeHtml(s.when)}</span></div>
      ${s.current?`<span class="ps-cur">текущий</span>`:`<button class="act" data-revoke="${s.id}">Завершить</button>`}
    </div>`).join('')+
    `<div style="margin-top:14px"><button class="tbtn" id="pfRevokeAll">Завершить все другие сеансы</button></div>`;
  body.appendChild(sess);

  // wiring
  $('#pfName').oninput=(e)=>{ AUTH.user.name=e.target.value; };
  body.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ AUTH.prefs.role=b.dataset.role; saveAuth(); body.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  const tog=(id,key)=>{ const t=$('#'+id); if(t) t.onclick=()=>{ const v=t.getAttribute('aria-checked')!=='true'; t.setAttribute('aria-checked',v); AUTH.prefs[key]=v; saveAuth(); }; };
  tog('pfDigest','notifyDigest'); tog('pfMent','notifyMentions'); tog('pfInc','notifyIncidents');
  body.querySelectorAll('[data-plang]').forEach(b=>b.onclick=()=>{ AUTH.prefs.lang=b.dataset.plang; saveAuth(); body.querySelectorAll('[data-plang]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  body.querySelectorAll('[data-ptheme]').forEach(b=>b.onclick=()=>{ document.documentElement.dataset.theme=b.dataset.ptheme; body.querySelectorAll('[data-ptheme]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  body.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{ b.closest('.psession').style.opacity='.4'; b.disabled=true; b.textContent='Завершён'; toast('Сеанс завершён'); });
  $('#pfRevokeAll').onclick=()=>{ body.querySelectorAll('[data-revoke]').forEach(b=>{ b.closest('.psession').style.opacity='.4'; b.disabled=true; b.textContent='Завершён'; }); toast('Все другие сеансы завершены'); };
  $('#pfName').onchange=()=>{ saveAuth(); renderIdentityChip(); };

  if(scrollTo==='sessions') setTimeout(()=>{ const s=$('#pfSessions'); if(s) body.scrollTop=s.offsetTop-12; },0);
}
window.openProfileModal=openProfileModal;

/* close identity popover on outside click / escape */
document.addEventListener('mousedown',e=>{
  if($('#popover').classList.contains('show') && !e.target.closest?.('#popover') && !e.target.closest?.('#identityChip')) closePopover();
});

/* boot */
setDensity('compact');
renderNav(); renderArea();
renderIdentityChip();
if(!AUTH.signedIn) showAuthGate();
</script>
</body>
</html>
