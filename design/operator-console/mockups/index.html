.dlg .dv { margin-left:auto; font-family:var(--font-mono); font-weight:600; color:var(--fg-2); }
.dlg .dn2 { color:var(--fg-2); }
/* horizontal bars — counts by status */
.hbars { display:flex; flex-direction:column; gap:11px; }
.hbar { display:grid; grid-template-columns:96px 1fr 34px; align-items:center; gap:10px; font-size:var(--text-sm); }
.hbar .hl { color:var(--fg-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hbar .ht { height:9px; border-radius:var(--radius-pill); background:var(--border-soft); overflow:hidden; }
.hbar .ht i { display:block; height:100%; width:0; border-radius:var(--radius-pill); transition:width var(--motion-base) var(--ease-standard); }
.hbar .hv { font-family:var(--font-mono); font-weight:600; color:var(--fg); text-align:right; }
/* segmented status bar (model health) */
.segbar { display:flex; height:14px; border-radius:var(--radius-pill); overflow:hidden; background:var(--border-soft); margin-bottom:12px; }
.segbar i { height:100%; transition:width var(--motion-base) var(--ease-standard); }
.seg-legend { display:flex; gap:16px; flex-wrap:wrap; font-size:var(--text-xs); color:var(--muted); }
.seg-legend span { display:inline-flex; align-items:center; gap:6px; }
.seg-legend .sw { width:9px; height:9px; border-radius:2px; }
/* must-build trend placeholder — honest: no daily history endpoint yet */
.vz-trend { display:flex; align-items:center; gap:12px; margin-top:13px; padding-top:12px; border-top:1px solid var(--border-soft); }
.vz-trend svg { width:120px; height:30px; flex:none; color:var(--class-mustbuild); }
.vz-trend .tt { font-size:var(--text-xs); color:var(--muted); line-height:1.4; }

/* Secrets table — mirrors the live vault layout: name = font-medium text-sm + amber key 14px, ghost actions */
.vault-tbl { width:100%; border-collapse:collapse; }
.vault-tbl thead th { text-align:left; font-size:var(--text-xs); font-weight:500; color:var(--muted); padding:0 14px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
.vault-tbl thead th.r { text-align:right; }
.vault-tbl td { padding:13px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
.vault-tbl tr:last-child td { border-bottom:0; }
.vault-tbl tr:hover td { background:var(--surface-warm); }
.vault-name { display:flex; align-items:center; gap:8px; font-size:var(--text-sm); font-weight:500; color:var(--fg); }
.vault-name .vk { flex:none; color:color-mix(in oklab,var(--class-dormant),transparent 30%); display:inline-flex; }
.vault-tbl .vcol { font-size:var(--text-xs); color:var(--muted); white-space:nowrap; }
.vault-tbl .vcol.mono { font-family:var(--font-mono); }
.vault-tbl .vact { display:flex; align-items:center; justify-content:flex-end; gap:4px; }
.vault-show { display:inline-flex; align-items:center; gap:7px; font-size:var(--text-sm); font-weight:500; color:var(--fg); background:transparent; border:1px solid var(--border); border-radius:var(--r-sm); padding:5px 11px; cursor:pointer; }
.vault-show:hover { background:var(--surface-warm); }
.vault-del { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; flex:none; border:0; border-radius:var(--r-sm); background:transparent; color:var(--muted); cursor:pointer; }
.vault-del:hover { color:var(--state-danger); background:var(--surface-warm); }
.bdg.scope-sec { color:var(--fg-2); background:var(--surface-warm); border-color:var(--border); text-transform:none; font-family:var(--font-body); font-weight:600; letter-spacing:0; font-size:10px; }
.vset { font-size:var(--text-xs); color:var(--class-live); font-weight:600; } .vempty { font-size:var(--text-xs); color:var(--muted); font-weight:600; }
.editb { font-size:var(--text-xs); color:var(--accent); background:transparent; border:0; font-weight:600; }

.md-preview { border:1px solid var(--border-soft); border-radius:var(--r-sm); background:var(--surface-warm); padding:10px 12px; min-height:56px; }
[data-density="compact"] .issue-workspace { padding:12px 14px 72px; }
[data-density="compact"] .issue-open-grid { grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr); gap:10px; }

@media (max-width:1100px){
  .settings-shell { grid-template-columns:1fr; }
  .settings-rail { border-right:0; border-bottom:1px solid var(--border); }
  .settings-row { grid-template-columns:1fr; }
  .setting-control { justify-content:flex-start; }

  .issue-modal-body { grid-template-columns:1fr; overflow:auto; }

  .issue-description-card .md-editor { grid-template-columns:1fr; grid-template-rows:auto minmax(280px,42vh) minmax(180px,auto); }
  .issue-description-card .md-toolbar,
  .issue-description-card .md-preview { grid-column:auto; }
  .issue-description-card textarea.txt { min-height:280px; }

  .issue-template-row { grid-template-columns:1fr 1fr; }
  .issue-open-grid { grid-template-columns:1fr; }
  .issue-open-head { flex-direction:column; }
  .issue-open-left { width:100%; }
  .issue-danger-actions { margin-left:0; }
  .search-page { grid-template-columns:1fr; overflow:auto; }
  .search-page-rail { border-right:0; border-bottom:1px solid var(--border); }
  .search-page-top { grid-template-columns:1fr; }
}

/* danger zone */
.danger-zone { border:1px solid color-mix(in oklab,var(--state-danger),transparent 60%); border-radius:var(--r-md); margin-top:var(--space-5); overflow:hidden; }
.danger-zone .dzh { background:color-mix(in oklab,var(--state-danger),transparent 92%); color:var(--state-danger); font-size:var(--text-sm); font-weight:700; padding:9px var(--space-5); }

/* legend strip */
.legend { display:flex; flex-wrap:wrap; gap:var(--space-4); padding:9px var(--space-5); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:var(--space-4); font-size:var(--text-xs); align-items:center; }
.legend .lk { display:inline-flex; align-items:center; gap:6px; color:var(--fg-2); } .legend .lk b { color:var(--fg); }
.legend .ld { width:9px; height:9px; border-radius:50%; }

/* tombstones */
.tomb-table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
.tomb-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px var(--space-4); border-bottom:1px solid var(--border); }
.tomb-table td { padding:11px var(--space-4); border-bottom:1px solid var(--border-soft); color:var(--fg-2); vertical-align:top; }
.tomb-table td.nm { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--class-stale); white-space:nowrap; }
.tomb-table td.ev { font-family:var(--font-mono); font-size:11px; color:var(--muted); }

/* status bar */
.statusbar { display:flex; align-items:center; gap:var(--space-4); padding:0 var(--space-4); background:var(--surface); border-top:1px solid var(--border); font-size:11px; color:var(--muted); font-family:var(--font-mono); }
.statusbar .si { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.statusbar button.si { appearance:none; border:0; background:transparent; padding:0; font:inherit; color:inherit; cursor:pointer; }
.statusbar .si .dot { width:6px; height:6px; border-radius:50%; background:var(--class-live); }
.statusbar .si.warn { color:var(--state-warn); }
.statusbar .si.warn .dot { background:var(--state-warn); }
.statusbar .si.bad { color:var(--state-danger); }
.statusbar .si.bad .dot { background:var(--state-danger); }
.statusbar .ssp { flex:1; }

/* overlay / modal */
.overlay { position:fixed; inset:0; background:rgba(8,12,20,.55); z-index:60; display:none; align-items:center; justify-content:center; padding:var(--space-5); }
.overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); width:min(540px,100%); max-height:84vh; overflow:auto; box-shadow:var(--elev-raised); }
.modal.settings-modal { width:min(960px,calc(100vw - 48px)); max-height:min(760px,88vh); overflow:hidden; border-radius:var(--r-lg); }
.modal.issue-create-modal { width:min(1280px,calc(100vw - 32px)); height:min(920px,calc(100vh - 32px)); max-height:calc(100vh - 32px); overflow:hidden; }
.search-pane { display:flex; flex-direction:column; }
.search-shell { flex:1; min-height:0; overflow:hidden; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); }
.search-page { display:grid; grid-template-columns:220px 1fr; height:100%; min-height:0; }
.search-page-rail { border-right:1px solid var(--border); background:var(--surface-warm); padding:var(--space-4); }
.search-page-rail h2 { padding:0; margin:0 0 4px; font-size:var(--text-xl); }
.search-page-rail p { margin:0 0 var(--space-4); color:var(--fg-2); font-size:var(--text-sm); line-height:1.4; }
.search-page-scope { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; border:0; background:transparent; color:var(--fg-2);
  padding:8px 9px; border-radius:var(--r-sm); font-weight:700; font-size:var(--text-sm); text-align:left; }
.search-page-scope:hover, .search-page-scope[aria-pressed="true"] { background:var(--surface); color:var(--fg); }
.search-page-scope small { color:var(--muted); font-family:var(--font-mono); }
.search-page-main { display:flex; flex-direction:column; min-width:0; }
.search-page-top { padding:var(--space-4); border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr auto; gap:var(--space-3); align-items:center; }
.search-page-top .txt { flex:1; }
.search-page-list { padding:var(--space-3) var(--space-4) var(--space-4); overflow:auto; }
.search-page-list .search-result { grid-template-columns:92px 1fr 96px; border-color:var(--border-soft); margin-bottom:6px; background:var(--surface); }
.modal.issue-create-modal .issue-modal-head h2 { padding:0; margin:0 0 5px; font-size:var(--text-xl); letter-spacing:var(--tracking-display); }
.modal h2 { font-size:var(--text-lg); margin:0; padding:var(--space-5) var(--space-5) var(--space-2); }
.modal .mb { padding:0 var(--space-5) var(--space-4); font-size:var(--text-sm); color:var(--fg-2); }
.modal .mf { padding:var(--space-4) var(--space-5); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:var(--space-2); }
.callout { border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 13px; font-size:var(--text-sm); color:var(--fg-2); background:var(--surface-warm); margin-top:var(--space-2); }
.callout.danger { border-color:color-mix(in oklab,var(--state-danger),transparent 58%); background:color-mix(in oklab,var(--state-danger),transparent 93%); }
.callout.good { border-color:color-mix(in oklab,var(--class-live),transparent 58%); background:color-mix(in oklab,var(--class-live),transparent 94%); }
.confirm-input { width:100%; margin-top:10px; font-family:var(--font-mono); }
.blast { list-style:none; padding:0; margin:10px 0; font-family:var(--font-mono); font-size:var(--text-xs); color:var(--fg-2); }
.blast li { padding:3px 0; } .blast li::before { content:"– "; color:var(--state-danger); }

/* ===== Issue hover preview — full title, formatted body, conversation stats ===== */
.issue-hover { position:fixed; z-index:72; width:min(440px, calc(100vw - 24px)); max-height:min(560px, calc(100vh - 24px)); overflow:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--elev-raised);
  padding:14px 16px; display:none; pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard); }
.issue-hover.show { display:block; opacity:1; transform:none; pointer-events:auto; }
.issue-hover .ih-head { display:flex; align-items:flex-start; gap:8px; }
.issue-hover .ih-id { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--muted); flex:none; padding-top:2px; }
.issue-hover .ih-title { font-size:var(--text-base); font-weight:700; line-height:1.32; color:var(--fg); }
.issue-hover .ih-meta { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 4px; align-items:center; }
.issue-hover .ih-route { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--muted); }
.issue-hover .ih-body { border-top:1px solid var(--border-soft); margin-top:11px; padding-top:11px; }
.issue-hover .ih-body.md { font-size:var(--text-sm); color:var(--fg-2); }
.issue-hover .ih-stats { border-top:1px solid var(--border-soft); margin-top:11px; padding-top:11px; }
.issue-hover .ih-stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px 12px; }
.issue-hover .ih-stat .k { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.issue-hover .ih-stat .v { font-family:var(--font-mono); font-size:var(--text-base); font-weight:700; font-variant-numeric:tabular-nums; color:var(--fg); }
.issue-hover .ih-kinds { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
.issue-hover .ih-kind { font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; border:1px solid var(--border); background:var(--surface-warm); color:var(--fg-2); font-variant-numeric:tabular-nums; }
.issue-hover .ih-kind.alarm { color:var(--state-warn); border-color:color-mix(in oklab,var(--state-warn),transparent 60%); background:color-mix(in oklab,var(--state-warn),transparent 90%); }
.issue-hover .ih-empty { font-size:var(--text-xs); color:var(--muted); margin-top:10px; }
@media (pointer:coarse){ .issue-hover { display:none !important; } }

.popover { position:fixed; z-index:70; max-width:300px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--elev-raised); padding:var(--space-4); font-size:var(--text-sm); display:none; }
.popover.show { display:block; }
.popover .pm { display:flex; flex-direction:column; gap:2px; }
.popover button { text-align:left; border:0; background:transparent; color:var(--fg-2); font-size:var(--text-sm); padding:7px 9px; border-radius:var(--r-sm); display:flex; align-items:center; gap:8px; }
.popover button:hover { background:var(--surface-warm); color:var(--fg); }
.popover button:disabled { color:var(--muted); cursor:not-allowed; }
.popover button .gp { font-family:var(--font-mono); font-size:10px; color:var(--class-dormant); margin-left:auto; }
.popover button .mp { font-family:var(--font-mono); font-size:10px; color:var(--class-mustbuild); margin-left:auto; }

.toast { position:fixed; bottom:50px; left:50%; transform:translateX(-50%) translateY(8px); z-index:80; background:var(--fg); color:var(--bg); padding:9px 15px; border-radius:var(--r-sm); font-size:var(--text-sm); font-weight:600; box-shadow:var(--elev-raised); opacity:0; pointer-events:none; transition:opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast .undo { color:var(--accent); margin-left:12px; cursor:pointer; }

@media (max-width:980px){
  /* Below the breakpoint the nav becomes a slide-in overlay; the shell collapses to one
     column (topbar / content / statusbar stacked). The rail/hover model is neutralized. */
  .app, .app.nav-collapsed { grid-template-columns:1fr; grid-template-areas:"topbar" "content" "statusbar"; }
  .mobile-menu-button { display:inline-flex; }
  .gsearch { min-width:0; width:min(360px,48vw); }
  .app > .nav { position:fixed; top:0; bottom:0; left:0; width:236px; transform:translateX(-100%); transition:transform var(--motion-base); z-index:60; }
  .app > .nav.open { transform:none; }
  .navcollapse { display:none; }
  .area-body.with-detail { grid-template-columns:1fr; }
  .detail { display:none; }
  .area-body.with-detail.detail-open .detail { display:block; position:fixed; right:0; top:48px; bottom:26px; width:340px; z-index:40; }
  .bulkbar { right:var(--space-6) !important; }
}

/* ===== Touch input (wall display / touchscreen laptop): lift targets to the 44px floor.
   Hover states are enhancement-only and the row-action menu is click-triggered,
   so nothing here is functionally hover-dependent — this only sizes the hit areas. ===== */
@media (pointer:coarse){
  .rowmenu { min-width:44px; min-height:44px; padding:0 10px; font-size:20px; }
  .tbtn, .act, .seg button, .fchip, .subtab { min-height:40px; }
  .nav-item { min-height:44px; }
  .echk { width:22px; height:22px; }
  .toggle { width:52px; height:30px; }
  .toggle::after { width:24px; height:24px; }
  .toggle[aria-checked="true"]::after { transform:translateX(22px); }
  .dlink, .search-result { min-height:44px; }
  .gsearch { padding:9px 10px; }
}

/* ===== Custom scrollbar — skinny, matches Grafana/Linear surface aesthetic ===== */
.nav::-webkit-scrollbar, .pane::-webkit-scrollbar, .detail::-webkit-scrollbar,
.issue-workspace::-webkit-scrollbar, .settings-body::-webkit-scrollbar,
.search-pop::-webkit-scrollbar, .search-page-list::-webkit-scrollbar {
  width:8px; height:8px;
}
.nav::-webkit-scrollbar-track, .pane::-webkit-scrollbar-track, .detail::-webkit-scrollbar-track,
.issue-workspace::-webkit-scrollbar-track, .settings-body::-webkit-scrollbar-track {
  background:transparent;
}
.nav::-webkit-scrollbar-thumb, .pane::-webkit-scrollbar-thumb, .detail::-webkit-scrollbar-thumb,
.issue-workspace::-webkit-scrollbar-thumb, .settings-body::-webkit-scrollbar-thumb {
  background:color-mix(in oklab,var(--border),transparent 40%);
  border-radius:var(--radius-pill);
}
.nav::-webkit-scrollbar-thumb:hover, .pane::-webkit-scrollbar-thumb:hover {
  background:color-mix(in oklab,var(--border),transparent 10%);
}

/* ===== ACCESS — self-hosted user administration (Settings → Доступ) ===== */
/* role badges (extend the .bdg classification vocabulary) */
.bdg.role-owner{ color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 86%); border-color:color-mix(in oklab,var(--accent),transparent 60%); text-transform:none; }
.bdg.role-admin{ color:var(--class-mustbuild); background:color-mix(in oklab,var(--class-mustbuild),transparent 86%); border-color:color-mix(in oklab,var(--class-mustbuild),transparent 60%); text-transform:none; }
.bdg.role-op{ color:var(--fg-2); background:var(--surface-warm); border-color:var(--border); text-transform:none; }
.bdg.role-view{ color:var(--muted); background:var(--surface-warm); border-color:var(--border); text-transform:none; }
.bdg.warn{ color:var(--state-warn); background:color-mix(in oklab,var(--state-warn),transparent 86%); border-color:color-mix(in oklab,var(--state-warn),transparent 60%); text-transform:none; }
.bdg.off{ color:var(--muted); background:var(--surface-warm); border-color:var(--border); text-transform:none; }

/* provider cards */
.ac-prov-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:11px; }
.ac-pcard{ border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:12px; }
.ac-pcard.on{ border-color:color-mix(in oklab,var(--class-live),transparent 58%); }
.ac-pcard.wide{ grid-column:1/-1; max-width:760px; }
.ac-ph{ display:flex; align-items:center; gap:11px; }
.ac-pmark{ width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:var(--surface-warm); border:1px solid var(--border); flex:none; }
.ac-pmark svg, .ac-pmark .pg{ width:18px; height:18px; }
.ac-pname{ font-weight:700; font-size:var(--text-sm); }
.ac-psub{ font-size:var(--text-xs); color:var(--muted); font-family:var(--font-mono); }
.ac-pfields{ display:flex; flex-direction:column; gap:9px; border-top:1px solid var(--border-soft); padding-top:12px; }
.ac-pfields.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
.ac-lab{ display:flex; flex-direction:column; gap:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.ac-lab .txt{ text-transform:none; letter-spacing:0; font-weight:500; }
.ac-lab.span2{ grid-column:1/-1; }
.ac-redir{ display:flex; gap:6px; align-items:center; }
.ac-redir .txt{ font-size:11px; color:var(--fg-2); }

/* policy radios */
.ac-policy-opt{ display:flex; gap:12px; align-items:flex-start; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:13px 15px; margin-bottom:9px; cursor:pointer; }
.ac-policy-opt.sel{ border-color:var(--accent); background:color-mix(in oklab,var(--accent),transparent 92%); }
.ac-policy-opt b{ display:block; font-size:var(--text-sm); }
.ac-policy-opt p{ margin:3px 0 0; color:var(--muted); font-size:var(--text-xs); line-height:1.45; }
.ac-radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex:none; margin-top:1px; position:relative; }
.ac-policy-opt.sel .ac-radio{ border-color:var(--accent); }
.ac-policy-opt.sel .ac-radio::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.ac-domains{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }

/* toolbar + search */
.ac-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.ac-search{ display:flex; align-items:center; gap:7px; height:32px; padding:0 11px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface); color:var(--muted); min-width:230px; }
.ac-search input{ border:0; background:transparent; color:var(--fg); font-size:var(--text-sm); width:100%; outline:none; font-family:inherit; }

/* access tables */
.ac-tbl{ width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
.ac-tbl th{ text-align:left; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:10px 13px; background:color-mix(in oklab,var(--surface),var(--bg) 35%); border-bottom:1px solid var(--border); }
.ac-tbl td{ padding:11px 13px; border-bottom:1px solid var(--border-soft); font-size:var(--text-sm); vertical-align:middle; }
.ac-tbl tr:last-child td{ border-bottom:0; }
.ac-tbl tbody tr:hover td{ background:color-mix(in oklab,var(--surface-warm),transparent 45%); }
.ac-tbl .r{ text-align:right; }
.ac-tbl .muted{ color:var(--muted); }
.ac-tbl .warn-t{ color:var(--state-warn); }
.ac-tbl td.mono, .ac-tbl .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.ac-empty{ text-align:center; color:var(--muted); padding:22px; }
.muted-dash{ color:var(--muted); }
.ac-uc{ display:flex; align-items:center; gap:10px; }
.ac-uc .um{ min-width:0; }
.ac-uc .un{ font-weight:600; color:var(--fg); }
.ac-uc .ue{ font-size:var(--text-xs); color:var(--muted); font-family:var(--font-mono); }
.ac-av{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:12px; flex:none; }
.ac-av.sm{ width:24px; height:24px; font-size:10px; }
.ac-provchips{ display:inline-flex; gap:4px; align-items:center; }
.ac-provchip{ display:inline-grid; place-items:center; }
.ac-provchip svg, .ac-provchip .pg{ width:15px; height:15px; }
.ac-rowact{ display:inline-flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }

/* roles ladder */
.ac-ladder{ display:flex; flex-direction:column; gap:9px; }
.ac-rung{ display:flex; gap:13px; align-items:flex-start; border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface); padding:13px 15px; }
.ac-level{ width:6px; align-self:stretch; border-radius:4px; flex:none; }
.ac-rl{ width:96px; flex:none; }
.ac-rd{ color:var(--muted); font-size:var(--text-sm); line-height:1.5; flex:1; }
.ac-rc{ margin-left:auto; flex:none; font-family:var(--font-mono); font-size:var(--text-xs); color:var(--fg-2); white-space:nowrap; }
@media (max-width:760px){ .ac-pfields.two{ grid-template-columns:1fr; } .ac-rl{ width:auto; } .ac-rung{ flex-wrap:wrap; } }

  { id:121, title:"US13: session-start inject + version negotiation + FR-17 client cache (NEW feature)", status:"closed", priority:"medium", type:"feature", from:"67e398f8", to:"engram", comments:7, age:"23.04", labels:["captured-from-save", "unrecorded-work", "v5-feature", "grpc"], body:"Deferred from 2026-04-19 session. NOT cleanup вЂ” new feature implementation.\n\nScope:\n- Implement `GetSessionStartContext` gRPC method (server side, composite SQL query)\n- Implement `NegotiateVersion` gRPC method + interceptor enforcing compatibility (FR-15)\n- Implement client-side cache per FR-17 (file-based, `${ENGRAM_DATA_DIR}/cache/session-start-{project}.json`)\n- Wire into existing session-start flow (currently client fetches behavioral_rules + memories separately)\n\nBenefits:\n- Single gRPC round-trip for session-start (instead of N calls)\n- Version compatibility enforcement (client/server mismatch в†’ graceful error)\n- Client cache reduces latency for repeat sessions\n\nRequires: proto file additions, gRPC server handler impl, client-side integration, tests." },
  { id:72, title:"Project identity: replace dirName_hash slug with pure hash ID", status:"closed", priority:"high", type:"improvement", from:"67e398f8", to:"engram", comments:1, age:"15.04", labels:["project-identity", "architecture"], body:"ResolveProjectSlug currently returns dirName + \"_\" + hash[:8] (e.g. \"engram_67e398f8\"). Per the project-identity design (.agent/specs/project-identity/architecture.md), it should return just the hash (e.g. \"67e398f8\") as the internal ID, with display name from .engram-project anchor file.\n\nDesign docs exist:\n- .agent/specs/project-identity/architecture.md (ADR-001 through ADR-004)\n- .agent/specs/project-identity/design.md (UUID + Claims brainstorm)\n\nChanges needed:\n1. ResolveProjectSlug в†’ return pure hash, not dirName_hash\n2. .engram-project anchor file support (name for display, id for non-git)\n3. Migration: update all observations/issues with old slugs via legacy_ids\n4. Update lib.js (hooks) to match Go algorithm\n5. Dashboard: show display_name, send hash ID" },
  { id:119, title:"US9: refactor recall MCP tool to trivial SQL (drop internal/search/*)", status:"closed", priority:"high", type:"task", from:"67e398f8", to:"engram", comments:1, age:"19.04", labels:["captured-from-save", "unrecorded-work", "v5-cleanup", "refactor"], body:"US9 is deferred from 2026-04-19 session. This is NOT a pure deletion вЂ” requires rewrite of `recall` MCP tool to trivial SQL (project + LIMIT + created_at DESC + optional FTS).\n\nScope:\n- Delete packages: `internal/search/*` (12 files, ~118KB) incl. manager, lanes, llm_filter, rrf + `internal/search/expansion/*` (expander, hyde + tests)\n- 210 refs across 15 consumer files (worker + mcp + config)\n- Rewrite `handleRecall` in `internal/mcp/tools_recall.go` to simple SQL instead of UnifiedSearch\n- Rewrite any callers of `search.Manager.UnifiedSearch` / `Decisions` / `Changes`\n- `go mod tidy` removes any remaining search-specific deps\n- Worktree `v5-us9-search` was prepared but abandoned вЂ” branch still exists\n\nBlocks: US3-PR-B (observations table drop вЂ” observations referenced by search fil…" },
  { id:299, title:"recall_memory format=detailed crashes: Time.MarshalJSON year outside range [0,9999]", status:"open", priority:"medium", type:"bug", from:"a01eaad6", to:"engram", comments:0, age:"14ч", labels:[], body:"Hit during nvmd-ai-kit cross-session retro on 2026-06-17.\n\n`mcp__plugin_engram_engram__recall_memory` with `format: \"detailed\"` returns a hard error:\n\n```\nmarshal hybrid detailed result: json: error calling MarshalJSON for type *time.Time:\nTime.MarshalJSON: year outside of range [0,9999]\n```\n\n**Repro:** call `recall_memory({ query: \"...\", format: \"detailed\", limit: 10 })` against the current corpus.\n\n**Impact:** `format: \"detailed\"` is unusable; callers must fall back to `format: \"items\"` or default (both work fine). Likely a memory row carrying a zero/overflow `*time.Time` (TTL/expiry or a far-future computed date) that marshals out of Go's RFC3339 year range. The default/items path probably skips that field or the offending row.\n\n**Suggested fix:** guard the time marshal in the detailed…" },

  { id:83, title:"Plugin: add env-var fallback for ENGRAM_API_TOKEN to survive CC credential store corruption", status:"resolved", priority:"medium", type:"improvement", from:"67e398f8", to:"engram", comments:0, age:"18.04", labels:["plugin", "reliability", "upstream-workaround", "mitigation"], body:"## Problem\n\nEngram plugin's `api_token` (stored via `userConfig.sensitive: true` в†’ `~/.claude/.credentials.json` `pluginSecrets[\"engram@engram\"]`) gets silently wiped by Claude Code's shared credential store race condition. User reports \"РїРѕСЃС‚РѕСЏРЅРЅРѕ РѕС‚РІР°Р»РёРІР°РµС‚СЃСЏ\" (constantly falls off) вЂ” after any concurrent MCP OAuth write, `/login`, or CC update, the stored secret can disappear.\n\n## Upstream bug (verified)\n\nActive open issue: https://github.com/anthropics/claude-code/issues/45551\n\n> Claude Code stores **both** claudeAiOauth and all MCP server OAuth tokens (mcpOAuth) in a **single Keychain entry / credentials.json blob**. When an MCP OAuth write occurs with a stale cache, null read, or concurrent read-modify-write race, the resulting JSON is written back **without**…" },
  { id:120, title:"US3-PR-B: drop observations + raw_logs tables (migration)", status:"resolved", priority:"high", type:"task", from:"67e398f8", to:"engram", comments:44, age:"22.04", labels:["captured-from-save", "unrecorded-work", "v5-cleanup", "migration", "breaking"], body:"Deferred from 2026-04-19 session. Depends on US9 merge (search package still reads observations via `filterSearch`/`UnifiedSearch`).\n\nScope:\n- DB migration to DROP `observations`, `raw_logs` tables CASCADE\n- Remove `internal/db/gorm/observation_store.go`, `raw_event_store.go`, `observation_relation_store.go`\n- Go sweep: remove all `ObservationStore`/`IndexedSession`/`PromptStore` type refs across internal/worker, internal/mcp\n- Replace observation-based retrieval with memory-based (memories + behavioral_rules tables)\n- Update MCP tools that returned observations to return memories\n\nBlocked by: US9 (dependency). Once US9 merged, this becomes the BIGGEST PR of v5 cleanup." },
  { id:87, title:"Bump muxcore to v0.19.7 (drop-in, defensive hardening + minor fixes)", status:"closed", priority:"medium", type:"improvement", from:"a1777ae2", to:"engram", comments:0, age:"19.04", labels:["muxcore", "dependency"], body:"Three mcp-mux releases have landed since v0.19.3. Drop-in for engram вЂ” zero consumer code modifications required.\n\n## Upgrade\n\n```bash\ncd D:/Dev/engram\ngo get github.com/thebtf/mcp-mux/muxcore@v0.19.7\ngo mod tidy\n```\n\n## Why MEDIUM priority for engram\n\nEngram uses the legacy `Handler` path (not `SessionHandler`) and does not host the mcp-mux daemon itself, so the two primary production bugs that motivated the chain (`mux-reconnect` keepalive violating MCP spec + zombie-listener after daemon restart) are not directly triggerable in engram's current architecture.\n\nHowever: the release also contains one low-risk correctness fix that engram benefits from even on the legacy path:\n\n- **`upstream.Process.ReadLine` now normalises `os.ErrClosed` в†’ `io.EOF`.** `exec.Cmd.StdoutPipe` closes the pi…" },
  { id:40, title:"Bug: source_project for issues must be determined server-side from deterministic current project identity", status:"closed", priority:"high", type:"task", from:"nvmd-ai-kit", to:"engram", comments:1, age:"13.04", labels:["bug", "autopilot", "project-identity", "safety"], body:"## Summary\n\nIssue creation currently trusts the calling agent too much for `project` / source-project identity. In a cross-project autopilot session this is unsafe: an agent can accidentally ask for or act on another project's issue backlog, then drift into the wrong repository and start work in a foreign main directory.\n\nThis should be treated as a high-priority safety bug.\n\n## Problem\n\nObserved failure mode in practice:\n1. A session starts in orchestrator repo `nvmd-ai-kit`\n2. Engram issues from other target projects (`engram`, `aimux`, `pr-review-mcp`) appear in context or are fetched during triage\n3. Autopilot sees an actionable Engram issue and keeps insisting on `/issues-tracker --act engram:#...`\n4. The agent can then wrongly interpret the target project as if it were the current pr…" },
  { id:287, title:"Engram SessionStart duplicates static behavior rule body and leaks Claude-specific provenance into Codex", status:"open", priority:"medium", type:"bug", from:"e2d787", to:"engram", comments:0, age:"2д", labels:["captured-from-save", "unrecorded-work", "codex", "hooks", "static-rules"], body:"During nvmd-ai-kit session-save capture on 2026-06-15, Codex hook output was attributed to Engram 6.6.1:\n\n- `hooks/session-start.js` renders `<user-behavior-rules>` and `<engram-static-memories>`.\n- For `D:/Dev/mcp-launcher`, Engram project id was `42d57c`.\n- Cache file `C:/Users/btf/.codex/plugins/data/engram-engram-marketplace/cache/session-start-42d57c.json` contained rule `id: 50` with `title`, `narrative`, and `content` all equal.\n- Renderer prints `title` as `## ...` and then prints `narrative`, so the `NO MANUAL DRIFT` text appears duplicated.\n- The rule text also says it was added as `~/.claude/rules/core-critical.md`, which is stale Claude-specific provenance shown inside a Codex session.\n\nExpected fix:\n\n- Avoid printing duplicate body when `title == narrative` or when both are co…" },
  { id:298, title:"FR: adopt muxcore auto-managed engine namespace", status:"open", priority:"medium", type:"feature", from:"92a84e", to:"engram", comments:2, age:"22ч", labels:["feature", "muxcore", "migration", "reliability"], body:"## Source\n\nProvider repo: `D:\\Dev\\mcp-mux`\nProvider commit: `f1c953d muxcore: auto-manage engine namespaces`\n\nThis depends on the next muxcore release tag that includes that commit. Do not consume from an unreleased pseudo-version unless the release path is blocked.\n\n## Problem\n\nMuxcore consumers should not have to hand-pick pipe/daemon namespace strings or avoid collisions by copying another product's naming rules. The provider now separates the human-visible engine label from the transport namespace.\n\n`engine.Config.Name` remains the status/registry label. The daemon control socket, owner sockets, daemon locks, stale cleanup, snapshot restore, and reconnect behavior use muxcore's resolved namespace.\n\n## Required implementation\n\n- Upgrade `github.com/thebtf/mcp-mux/muxcore` to the next re…" },
  { id:296, title:"Adopt muxcore v0.26.5 occupied-pipe and owner-fanout fixes", status:"open", priority:"medium", type:"task", from:"92a84e", to:"engram", comments:1, age:"15ч", labels:["muxcore", "upgrade", "reliability", "windows"], body:"## Context\n\nmcp-mux released `v0.26.5` and `muxcore/v0.26.5` on 2026-06-17.\n\nProvider evidence:\n\n```bash\ngo list -m -json github.com/thebtf/mcp-mux/muxcore@v0.26.5\n# Origin.Ref: refs/tags/muxcore/v0.26.5\n# Origin.Hash: c6418a126267ab8f703c2f875b9e7d7c0f811e9d\n```\n\nReleases:\n\n- https://github.com/thebtf/mcp-mux/releases/tag/v0.26.5\n- https://github.com/thebtf/mcp-mux/releases/tag/muxcore/v0.26.5\n\n## What changed upstream\n\n- No muxcore API breaking change.\n- v0.26.4: Windows occupied but unresponsive control pipe now waits/fails clearly instead of spawning a competing daemon.\n- v0.26.5: reduced owner/process fanout after startup storms:\n  - forced-isolated retry counters are cleaned when the final owner in a retry family is removed;\n  - shared/global env bucketing ignores ordinary launch noi…" },
  { id:281, title:"recall_memory (hybrid FR-5) returns \"No memories found\" when matching memories exist вЂ” primary agent read path is dead", status:"resolved", priority:"high", type:"bug", from:"67e398f8", to:"engram", comments:1, age:"2д", labels:["recall", "hybrid-retrieval", "vnext", "write-only-memory", "high-impact"], body:"## Symptom\n\n`recall_memory` (the vNext hybrid FTS+vector retrieval tool, PRD FR-5 вЂ” the primary semantic recall path agents depend on) returns **\"No memories found\"** even when matching memories provably exist. Neighboring agents hit this constantly: they call `recall_memory`/`recall`, get `{\"count\":0,\"memories\":[]}`, retry with `project`, still `count:0`.\n\n## Reproduction (VERIFIED this session, project=engram)\n\n```\nrecall_memory(query=\"injection quality noise scope leak\", project=\"engram\", limit=5)\n  в†’ \"No memories found matching the query.\"\n\nrecall_memory(query=\"provenance cleanup\", project=\"engram\", limit=5)\n  в†’ \"No memories found matching the query.\"\n\n# But the dumb substring tool finds them fine:\nrecall(action=\"search\", query=\"injection\", project=\"engram\", limit=5)\n  в†’ count:…" },
  { id:238, title:"LLM Wiki v2: governance, privacy filtering, audit trail, and reversible bulk operations", status:"resolved", priority:"high", type:"feature", from:"a01eaad6", to:"engram", comments:2, age:"2д", labels:["engram-vnext", "privacy", "governance", "audit"], body:"## Source\n\n- Gist: https://gist.github.com/rohitg00/2067ab416f7bbe447c1977edaaa681e2\n- Recovered NVMD session-log decision: durable memory ingestion needs governance by design, especially when importing local session logs.\n- Local evidence handle: `C:\\Users\\btf\\.codex\\sessions\\2026\\05\\13\\rollout-2026-05-13T00-03-44-019e1e00-b7e6-74a1-a18f-3f2cb890969e.jsonl`, lines 63240 and 63289.\n\n## Request\n\nAdd governance and privacy controls to Engram vNext before large-scale session-log ingestion and crystallization are enabled.\n\n## Motivation\n\nSession logs can contain secrets, private user data, project-local details, and transient context that should not become durable shared memory. Agents need reversible, auditable operations rather than irreversible memory drift.\n\n## Proposed Feature\n\nEngram sho…" },
  { id:65, title:"РќСѓР¶РЅР° Р°РІС‚РѕСЂРёР·Р°С†РёСЏ РѕРїРµСЂР°С‚РѕСЂР° С‡РµСЂРµР· user / pass, sso, oauth.", status:"resolved", priority:"medium", type:"improvement", from:"dashboard", to:"engram", comments:3, age:"14.04", labels:[], body:"РЎРІРѕР±РѕРґРЅСѓСЋ СЂРµРіРёСЃС‚СЂР°С†РёСЋ РїРѕ РґРµС„РѕР»С‚Сѓ Р·Р°РєСЂС‹С‚СЊ. РЎРґРµР»Р°С‚СЊ СЃРёСЃС‚РµРјСѓ РїСЂРёРіР»Р°С€РµРЅРёР№. SSO РїРѕРґРґРµСЂР¶РєР° - authentik primary." },
  { id:71, title:"Wire muxcore upgrade.Swap for graceful binary restart", status:"resolved", priority:"high", type:"task", from:"67e398f8", to:"engram", comments:2, age:"15.04", labels:["daemon", "muxcore", "upgrade"], body:"Engram client doesn't implement muxcore's upgrade.Swap procedure. When binary is rebuilt (go install), the running daemon keeps the old binary in memory. Only a full CC restart picks up the new binary.\n\nmuxcore provides:\n- upgrade.Swap(currentExe, newExe) вЂ” atomic binary replacement\n- upgrade.CleanStale(exePath) вЂ” cleanup old binaries\n- Snapshot serialization for graceful restart (daemon saves state, new process restores)\n\nNeed to wire:\n1. Signal handler (SIGHUP or custom) to trigger upgrade check\n2. upgrade.Swap to atomically replace the binary\n3. Graceful restart with snapshot serialization (muxcore engine supports this)\n4. ensure-binary.sh should trigger the upgrade signal after downloading new version\n\nWithout this: plugin updates require manual CC restart to take effect." },

const PAGE_SIZE_LS_KEY='engram.console.pageSizes';
function loadPageSizes(){
  try{
    const raw=localStorage.getItem(PAGE_SIZE_LS_KEY); if(!raw) return;
    const saved=JSON.parse(raw); if(!saved || typeof saved!=='object') return;
    const allowed=new Set(PAGE_SIZE_OPTIONS);
    for(const key of Object.keys(listState)){
      const v=saved[key];
      if(typeof v==='number' && allowed.has(v)) listState[key].pageSize=v;
    }
  }catch(_){ /* private mode / quota / corrupt value — fall back to defaults */ }
}
function savePageSize(key, size){
  try{
    let saved={};
    try{ saved=JSON.parse(localStorage.getItem(PAGE_SIZE_LS_KEY)||'{}')||{}; }catch(_){ saved={}; }
    saved[key]=size;
    localStorage.setItem(PAGE_SIZE_LS_KEY, JSON.stringify(saved));
  }catch(_){ /* persistence unavailable — selection still applies for this session */ }
}
loadPageSizes();
function pageSizeFor(key){
  const st=listState[key]; if(st && st.pageSize!=null) return st.pageSize;
  return LIST_PAGE_SIZE[key] || 10;
}
function pageList(key, items){
  const state=listState[key] || (listState[key]={page:1});
  const raw=pageSizeFor(key);
  const total=items.length;
  const size=raw===0 ? Math.max(total,1) : raw;       // 0 = «Все»
  const pages=Math.max(1, Math.ceil(total/size));
  state.page=Math.min(Math.max(1, state.page||1), pages);
  const start=(state.page-1)*size;
  return { items:items.slice(start,start+size), total, page:state.page, pages, start, end:Math.min(start+size,total), size:raw };
}
// page-number window with ellipses: 1 … 4 5 [6] 7 8 … 10
function pageWindow(page, pages){
  if(pages<=7) return Array.from({length:pages},(_,i)=>i+1);
  const out=new Set([1,2,pages-1,pages,page-1,page,page+1]);
  const sorted=[...out].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
  const win=[]; let prev=0;
  for(const n of sorted){ if(n-prev>1) win.push('…'); win.push(n); prev=n; }
  return win;
}

    n==='…' ? `<span class="page-gap">…</span>`

      <button class="tbtn" data-page-prev="${key}" ${info.page<=1?'disabled':''} aria-label="Назад">‹</button>

}

function runSearch(query, scope='all', limit=20){
  const q=normalizeSearch(query).trim();
  const parts=q.split(/\s+/).filter(Boolean);
  if(!parts.length) return [];
  const scored=buildSearchIndex().filter(item=>scope==='all'||item.scope===scope).map(item=>{
    let score=0;
    parts.forEach(part=>{
      if(normalizeSearch(item.title).includes(part)) score+=6;
      if(normalizeSearch(item.detail).includes(part)) score+=3;
      if(item.text.includes(part)) score+=1;
    });
    return { item, score };
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || a.item.title.localeCompare(b.item.title,'ru'));
  return scored.slice(0,limit).map(x=>x.item);
}

    document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; grip.classList.add('drag');
    const move=(ev)=>{ const w=Math.max(320, Math.min(720, w0 + (x0 - ev.clientX))); document.documentElement.style.setProperty('--detail-w', w+'px'); };
    const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.body.style.cursor=''; document.body.style.userSelect=''; grip.classList.remove('drag');
      const cur=getComputedStyle(document.documentElement).getPropertyValue('--detail-w').trim(); try{ localStorage.setItem(DETAIL_W_KEY, parseInt(cur,10)); }catch(_){} };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  };
  grip.addEventListener('pointerdown',startDrag);
  grip.tabIndex=0;
  grip.addEventListener('keydown',(e)=>{

/* ============================================================
   MARKDOWN — local safe subset for Issues
   ============================================================ */
function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g, ch=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}
function inlineMarkdown(v){
  let s=escapeHtml(v);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s=s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s=s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}
function renderMarkdown(md){
  const lines=String(md||'').replace(/\r\n/g,'\n').split('\n');
  const out=[]; let list=null, inCode=false, code=[];
  const closeList=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  const openList=(type)=>{ if(list!==type){ closeList(); list=type; out.push(`<${type}>`); } };
  lines.forEach(raw=>{
    const line=raw.replace(/\s+$/,'');
    if(line.startsWith('```')){
      if(inCode){ out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); code=[]; inCode=false; }
      else { closeList(); inCode=true; }
      return;
    }
    if(inCode){ code.push(line); return; }
    if(!line.trim()){ closeList(); return; }
    const h=line.match(/^###\s+(.+)/);
    if(h){ closeList(); out.push(`<h3>${inlineMarkdown(h[1])}</h3>`); return; }
    const q=line.match(/^>\s+(.+)/);
    if(q){ closeList(); out.push(`<blockquote>${inlineMarkdown(q[1])}</blockquote>`); return; }
    const task=line.match(/^[-*]\s+\[([ xX])\]\s+(.+)/);
    if(task){ openList('ul'); out.push(`<li>${task[1].trim()? '☑':'☐'} ${inlineMarkdown(task[2])}</li>`); return; }
    const bullet=line.match(/^[-*]\s+(.+)/);
    if(bullet){ openList('ul'); out.push(`<li>${inlineMarkdown(bullet[1])}</li>`); return; }
    const ordered=line.match(/^\d+\.\s+(.+)/);
    if(ordered){ openList('ol'); out.push(`<li>${inlineMarkdown(ordered[1])}</li>`); return; }
    closeList(); out.push(`<p>${inlineMarkdown(line)}</p>`);
  });
  closeList();
  if(inCode) out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
  return `<div class="md">${out.join('')}</div>`;
}
function markdownEditor(id, placeholder, initial=''){
  return `<div class="md-editor">
    <div class="md-toolbar" data-for="${id}">
      <button type="button" data-md="bold" title="Жирный">B</button>
      <button type="button" data-md="italic" title="Курсив">I</button>
      <button type="button" data-md="quote" title="Цитата">Цитата</button>
      <button type="button" data-md="code" title="Inline code">code</button>
      <button type="button" data-md="list" title="Список">• Список</button>
      <button type="button" data-md="task" title="Чеклист">☐ Задача</button>
      <button type="button" data-md="link" title="Ссылка">Ссылка</button>
    </div>
    <textarea class="txt" id="${id}" placeholder="${escapeHtml(placeholder)}">${escapeHtml(initial)}</textarea>
    <div class="md-preview" id="${id}Preview">${renderMarkdown(initial||'')}</div>
  </div>`;
}
function insertMarkdown(ta, before, after='', fallback='текст'){
  const start=ta.selectionStart||0, end=ta.selectionEnd||0;
  const value=ta.value;
  const selected=value.slice(start,end)||fallback;
  ta.value=value.slice(0,start)+before+selected+after+value.slice(end);
  ta.focus();
  ta.selectionStart=start+before.length;
  ta.selectionEnd=start+before.length+selected.length;
  ta.dispatchEvent(new Event('input'));
}
function wireMarkdownEditor(id){
  const ta=$('#'+id), preview=$('#'+id+'Preview');
  if(!ta||!preview) return;
  ta.oninput=()=>{ preview.innerHTML=renderMarkdown(ta.value); };
  document.querySelectorAll(`.md-toolbar[data-for="${id}"] [data-md]`).forEach(btn=>{
    btn.onclick=()=>{
      const a=btn.dataset.md;
      if(a==='bold') insertMarkdown(ta,'**','**','важное');
      if(a==='italic') insertMarkdown(ta,'*','*','уточнение');
      if(a==='quote') insertMarkdown(ta,'> ','','цитата');
      if(a==='code') insertMarkdown(ta,'`','`','ENV_VAR');
      if(a==='list') insertMarkdown(ta,'- ','','пункт');
      if(a==='task') insertMarkdown(ta,'- [ ] ','','задача');
      if(a==='link') insertMarkdown(ta,'[','](https://)','ссылка');
    };
  });
}

function optionLabel(value){ return HUMAN_OPTION_LABELS[value] || value; }
function optionList(options, selected){
  return uniqueValues(options).map(o=>`<option value="${escapeHtml(o)}"${String(o)===String(selected)?' selected':''}>${escapeHtml(optionLabel(o))}</option>`).join('');
}
function issueTone(kind, value){
  const v=String(value||'');
  if(kind==='priority') return ['critical','high','medium','low'].includes(v)?v:'low';
  if(kind==='status') return ['open','acknowledged','reopened','resolved','closed','rejected'].includes(v)?v:'open';
  if(kind==='type') return ['bug','feature','task','improvement','handoff','question'].includes(v)?v:'task';
  return 'low';
}
function issueChip(kind, value, label=optionLabel(value)){
  return `<span class="issue-chip" data-tone="${issueTone(kind,value)}">${escapeHtml(label)}</span>`;
}
function issueLabelChips(labels=[], max=3){
  const shown=(labels||[]).slice(0,max);
  const rest=Math.max(0,(labels||[]).length-shown.length);
  return shown.map(x=>`<span class="issue-chip subtle">${escapeHtml(x)}</span>`).join('')+(rest?`<span class="issue-chip subtle">+${rest}</span>`:'');
}
function selectField(kind, field, label, value, options, help=''){
  return `<label class="edit-field"><span>${escapeHtml(label)}</span><select class="txt edit-select" data-${kind}-field="${escapeHtml(field)}">${optionList(options,value)}</select>${help?`<small class="field-help">${escapeHtml(help)}</small>`:''}</label>`;
}
function chipPicker(kind, field, selected, options){
  const set=new Set(selected||[]);
  return `<div class="chip-picker">${uniqueValues([...(selected||[]), ...options]).map(x=>`<button type="button" class="tag-option${set.has(x)?' on':''}" data-${kind}-chip="${escapeHtml(field)}" data-value="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}</div>`;
}
function wireEntitySelects(scope, kind, entity, labels={}){
  const key=kind+'Field';
  scope.querySelectorAll(`[data-${kind}-field]`).forEach(ctrl=>{
    ctrl.onchange=()=>{
      const field=ctrl.dataset[key];
      entity[field]=ctrl.value;
      toast(`${labels[field]||field}: ${ctrl.value}`);
      renderArea();
    };
  });
}
function wireEntityChips(scope, kind, entity, field, label){
  scope.querySelectorAll(`[data-${kind}-chip="${field}"]`).forEach(btn=>{
    btn.onclick=()=>{
      const value=btn.dataset.value;
      const current=new Set(entity[field]||[]);
      current.has(value)?current.delete(value):current.add(value);
      entity[field]=[...current];
      toast(`${label}: ${entity[field].length}`);
      renderArea();
    };
  });
}

function memoryFilterActive(){
  const st=listState.memories;
  return st.project!=='all' || st.filters.size>0;
}
function filteredMemories(){
  const st=listState.memories;
  return MEMORIES.filter(m=>{
    if(st.project!=='all' && m.project!==st.project) return false;
    if(st.filters.has('active') && m.status!=='active') return false;
    if(st.filters.has('flagged') && m.status!=='flagged') return false;
    if(st.filters.has('stale') && !String(m.age).includes('21')) return false;
    if(st.filters.has('low') && m.conf>=0.8) return false;
    if(st.filters.has('chain') && !m.superBy) return false;
    return true;
  });
}

function fmtThin(n){ return Math.round(n).toLocaleString('ru-RU').replace(/ /g,' '); }
// Animate [data-count] (count-up), [data-gauge] (conic fill), and .propbar i[data-w] (proportion).
// Numbers that MEASURE, not labels: the rise is the signal that the surface is live.
function instrAnimate(root, instant){
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches || instant, DUR=900;
  root.querySelectorAll('[data-count]').forEach(node=>{
    const to=parseFloat(node.dataset.count), dec=node.dataset.dec?+node.dataset.dec:0;
    const set=v=>node.textContent = dec? v.toFixed(dec) : fmtThin(v);
    if(rm||!isFinite(to)){ set(to); return; }
    const t0=performance.now();
    const tick=t=>{ const k=Math.min(1,(t-t0)/DUR), e=1-Math.pow(1-k,4); set(to*e); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  root.querySelectorAll('[data-gauge]').forEach(g=>{
    const to=+g.dataset.gauge;
    if(rm){ g.style.setProperty('--p',to); return; }
    const t0=performance.now();
    const tick=t=>{ const k=Math.min(1,(t-t0)/DUR), e=1-Math.pow(1-k,4); g.style.setProperty('--p',(to*e).toFixed(2)); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  root.querySelectorAll('.propbar i[data-w], .hbar .ht i[data-w], .segbar i[data-w]').forEach(seg=>{ requestAnimationFrame(()=>{ seg.style.width=seg.dataset.w+'%'; }); });
}

let ruleEditing = null;     // id of rule open in inline editor
let ruleDragId = null;      // id of rule currently dragged

// Priority is DERIVED from order — the operator never types it.
// Top of the list injects first; the system assigns clean descending numbers.
function reindexRulePriorities(){ RULES.forEach((r,i)=>{ r.priority = (RULES.length - i) * 10; }); }
function moveRule(fromIdx, toIdx){
  if(toIdx<0||toIdx>=RULES.length||fromIdx===toIdx) return false;
  const [r]=RULES.splice(fromIdx,1); RULES.splice(toIdx,0,r); reindexRulePriorities(); return true;
}

function renderRules(c){
  c.appendChild(areaHead('Правила поведения','Правила попадают в контекст каждой новой сессии сверху вниз. Порядок задаёте перетаскиванием — что выше, то применяется раньше.', false, [{id:'rules',label:'Правила'},{id:'inst',label:'Старые инстинкты'}], sub||'rules'));

    c.appendChild(el('div','area-body').appendChild(pane).parentElement); return;
  }

  note.innerHTML=`<span>⠿</span><span>Порядок задаёте перетаскиванием или стрелками ↑↓ на захвате. <b>Числовой приоритет</b> система считает сама из порядка — вручную его не вводят.</span>`;
  pane.appendChild(note);
  pane.appendChild(el('div','callout good','Правка и перестановка сохраняются через живой <span class="mono">PATCH /api/rules/{id}</span> (принимает content + пересчитанный priority). Оставшийся разрыв: <span class="mono">GET /api/rules</span> отдаёт 404 — листинг и создание пока только через MCP; включение/выключение требует колонки <span class="mono">enabled</span> (must-build).'));

  const grid=el('div','grid');
  grid.appendChild(el('div','grid-h','порядок · правило · область · приоритет (вычислен) · версия'));
  RULES.forEach((r,idx)=>{
    const row=el('div','erow rule-row'); row.dataset.id=r.id; row.draggable=(ruleEditing!==r.id);

    if(ruleEditing===r.id){
      const scopeOpts=['global',...PROJECTS.map(p=>p.id)];
      row.innerHTML=`<div class="ebody" style="grid-column:1/-1">
        <div class="rule-editor">
          <textarea id="ruleEditText">${r.content}</textarea>
          <div class="rule-editor-row">
            <select class="fsel" id="ruleEditScope">${scopeOpts.map(s=>`<option value="${s}" ${s===r.scope?'selected':''}>${s==='global'?'глобально':s}</option>`).join('')}</select>
            <span class="rule-prio">приоритет <b>${r.priority}</b> · позиция #${idx+1}</span>
            <span style="flex:1"></span>
            <button class="act" id="ruleEditCancel">Отмена</button>
            <button class="act" id="ruleEditSave" style="border-color:var(--accent);color:var(--accent)">Сохранить</button>
          </div>
        </div></div>`;
      grid.appendChild(row);
      row.querySelector('#ruleEditCancel').onclick=()=>{ ruleEditing=null; renderArea(); };
      row.querySelector('#ruleEditSave').onclick=()=>{ r.content=row.querySelector('#ruleEditText').value.trim()||r.content; r.scope=row.querySelector('#ruleEditScope').value; r.version=(r.version||1)+1; ruleEditing=null; renderArea(); toast('Правило обновлено · v'+r.version); };
      row.querySelector('#ruleEditText').focus();
      return;
    }

    const grip=el('button','rule-grip'); grip.innerHTML='⠿'; grip.title='Перетащить или ↑↓ для перемещения';
    grip.setAttribute('aria-label',`Переместить правило, позиция ${idx+1} из ${RULES.length}`);
    grip.onkeydown=(e)=>{
      if(e.key==='ArrowUp'){ e.preventDefault(); if(moveRule(idx,idx-1)){ renderArea(); focusGrip(r.id); toast('Поднято · приоритет '+RULES[idx-1].priority); } }
      else if(e.key==='ArrowDown'){ e.preventDefault(); if(moveRule(idx,idx+1)){ renderArea(); focusGrip(r.id); toast('Опущено · приоритет '+RULES[idx+1].priority); } }
    };
    const rank=el('span','rule-rank', String(idx+1)); rank.title='Порядок инъекции';

    const body=el('div','ebody');
    body.innerHTML=`<div class="epreview" style="white-space:normal">${r.content}</div>
      <div class="emeta"><span class="bdg scope-${r.scope}">${r.scope==='global'?'глобально':r.scope}</span>
        <span class="rule-prio">приоритет <b>${r.priority}</b> · авто</span>
        <span>v${r.version}</span><span>${r.sessions} сессий</span></div>`;
    const side=el('div','eside');
    const editBtn=el('button','act','Изменить'); editBtn.onclick=()=>{ ruleEditing=r.id; renderArea(); };
    const tg=el('button','toggle'); tg.setAttribute('aria-checked','true'); tg.disabled=true; tg.title='Включение/выключение требует колонки enabled (must-build P1)';
    const del=el('button','act danger','Удалить'); del.onclick=()=>confirmModal('Удалить правило',`Правило <span class="mono">${r.id}</span> будет мягко удалено. Сейчас это единственный способ деактивации.`,()=>{ const i=RULES.findIndex(x=>x.id===r.id); if(i>=0){ RULES.splice(i,1); reindexRulePriorities(); } renderArea(); toast('Правило удалено'); });
    side.append(editBtn,tg,del);
    row.append(grip,rank,body,side);

    // ---- drag-to-reorder ----
    row.ondragstart=(e)=>{ ruleDragId=r.id; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
    row.ondragend=()=>{ row.classList.remove('dragging'); grid.querySelectorAll('.rule-row').forEach(x=>x.classList.remove('drag-over','drag-over-bottom')); };
    row.ondragover=(e)=>{ e.preventDefault(); const b=row.getBoundingClientRect(); const below=e.clientY>b.top+b.height/2; row.classList.toggle('drag-over',!below); row.classList.toggle('drag-over-bottom',below); };
    row.ondragleave=()=>row.classList.remove('drag-over','drag-over-bottom');
    row.ondrop=(e)=>{ e.preventDefault(); if(!ruleDragId||ruleDragId===r.id) return; const from=RULES.findIndex(x=>x.id===ruleDragId); let to=RULES.findIndex(x=>x.id===r.id); const b=row.getBoundingClientRect(); if(e.clientY>b.top+b.height/2) to+=1; if(from<to) to-=1; moveRule(from,to); ruleDragId=null; renderArea(); toast('Порядок изменён · приоритеты пересчитаны системой'); };

    grid.appendChild(row);
  });
  pane.appendChild(grid);
  c.appendChild(el('div','area-body').appendChild(pane).parentElement);
}

/* ---- Issues (hero 5) ---- */
function issueSelKey(id){ return `issue:${id}`; }
function selectedIssueIds(){ return ISSUES.filter(is=>selected.has(issueSelKey(is.id))).map(is=>is.id); }
function clearIssueSelection(){ selectedIssueIds().forEach(id=>selected.delete(issueSelKey(id))); }
function issueFilterActive(){ return listState.issues.status!=='all'; }
function filteredIssues(){
  const mode=listState.issues.status;
  if(mode==='all') return ISSUES;
  const groups = {
    open:['open'],
    work:['acknowledged','reopened'],
    closed:['resolved','closed'],
    rejected:['rejected'],
  };
  return ISSUES.filter(is=>(groups[mode]||[]).includes(is.status));
}
/* ===== Issue hover preview ===== */
const ISSUE_KIND_RU = { evidence:'evidence', triage:'разбор', fix:'фикс', verify:'проверка', reopen:'переоткрытие', attempt:'попытка', stop:'стоп', close:'закрытие', comment:'коммент', proposal:'предложение', review:'ревью', report:'репорт', resolve:'решение', mb:'must-build', ack:'принято', note:'заметка', reject:'отклонение' };
const ISSUE_KIND_ALARM = new Set(['reopen','attempt','stop','reject']); // признаки болезненной истории
function issueConvoStats(is){
  const thread = ISSUE_THREADS[is.id] || [];
  const participants = new Set(thread.map(t=>t.who));
  const kinds = {};
  thread.forEach(t=>{ kinds[t.kind]=(kinds[t.kind]||0)+1; });
  const last = thread.length ? thread[thread.length-1] : null;
  return { count: is.comments||thread.length, participants: participants.size, kinds, last, hasThread: thread.length>0 };
}
let issueHoverEl=null, issueHoverTimer=null;
function getIssueHover(){
  if(!issueHoverEl){ issueHoverEl=el('div','issue-hover'); document.body.appendChild(issueHoverEl); }
  return issueHoverEl;
}
function buildIssueHover(is){
  const s=issueConvoStats(is);
  const kindsHtml = Object.entries(s.kinds).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
    `<span class="ih-kind${ISSUE_KIND_ALARM.has(k)?' alarm':''}">${ISSUE_KIND_RU[k]||k} ${n}</span>`).join('');
  const bodyHtml = is.body ? renderMarkdown(is.body) : '<p style="color:var(--muted)">Тело задачи пустое.</p>';
  return `<div class="ih-head"><span class="ih-id">#${is.id}</span><span class="ih-title">${escapeHtml(is.title)}</span></div>
    <div class="ih-meta">${issueChip('priority',is.priority)}${issueChip('type',is.type)}${issueChip('status',is.status)}
      <span class="ih-route">${escapeHtml(is.from)} → ${escapeHtml(is.to)} · ${escapeHtml(is.age)}</span></div>
    <div class="ih-body md">${bodyHtml}</div>
    <div class="ih-stats">
      <div class="ih-stats-grid">
        <div class="ih-stat"><div class="k">сообщений</div><div class="v">${s.count}</div></div>
        <div class="ih-stat"><div class="k">участников</div><div class="v">${s.participants||'—'}</div></div>
        <div class="ih-stat"><div class="k">последнее</div><div class="v" style="font-size:13px">${s.last?escapeHtml(s.last.at):'—'}</div></div>
      </div>
      ${s.hasThread ? `<div class="ih-kinds">${kindsHtml}</div>` : `<div class="ih-empty">Переписки пока нет — внутри только тело задачи.</div>`}
    </div>`;
}
function showIssueHover(rowEl, is){
  const h=getIssueHover();
  h.innerHTML=buildIssueHover(is);
  h.classList.add('show');
  const r=rowEl.getBoundingClientRect(), hw=Math.min(440, innerWidth-24), hh=h.getBoundingClientRect().height;
  let left=r.right+12; if(left+hw>innerWidth-12) left=Math.max(12, r.left-hw-12);
  let top=clampIssueHoverTop(r.top, hh);
  h.style.left=left+'px'; h.style.top=top+'px';
}
function clampIssueHoverTop(anchorTop, measuredHeight=Math.min(560, innerHeight-24)){
  const safeHeight=Math.min(measuredHeight, innerHeight-24);
  const maxTop=Math.max(12, innerHeight-safeHeight-12);
  return Math.max(12, Math.min(anchorTop, maxTop));
}
function hideIssueHover(){ if(issueHoverEl) issueHoverEl.classList.remove('show'); }

function fillBookFacet(b){
  const host=document.getElementById('bkFacetBody'); if(!host) return;
  if(bookFacet==='process') host.innerHTML=bookFacetProcess(b);
  else if(bookFacet==='concepts') host.innerHTML=bookFacetConcepts(b);
  else if(bookFacet==='terms') host.innerHTML=bookFacetTerms(b);
  else host.innerHTML=bookFacetDomains(b);
  // count-up on any instr in the facet
  instrAnimate(host);
  wireBookFacet(b, host);
}
function bookFacetProcess(b){

    return `<div class="pl-step ${cls}"><span class="pl-dot"></span><div class="pl-txt"><b>${s.label}</b><span>${s.desc}</span></div></div>`;

  return `<div class="bk-run">
      <div class="bk-runfig"><div class="rf-n"><span data-count="${b.chunks}">0</span></div><div class="rf-l">source-чанков</div></div>

    </div>
    <div class="pipeline">${steps}</div>

    ${b.state==='review'?'<div class="dactions"><button class="act" id="bkApprove">Принять прогон</button><button class="act" id="bkRerun">Перезапустить</button></div>'

function wireBookFacet(b, host){

  host.querySelector('#bkCancel')?.addEventListener('click',()=>confirmModal('Прервать обработку','Текущий compile остановится, частичные концепты не сохранятся в базе.',()=>{ b.state='loaded'; toast('Обработка прервана'); renderArea(); }));

}

function renderSettingsModalBody(){

  else if(settingsSub==='acAudit') renderAccessAudit(pane);

        ()=>{ ACCESS.blockSelfReg=false; renderSettingsModalBody(); toast('Свободная регистрация разрешена'); });
    } else { ACCESS.blockSelfReg=true; renderSettingsModalBody(); toast('Свободная регистрация запрещена'); }
  };

  const sec=el('section','settings-section'+(blocked?' ac-disabled':''));
  sec.innerHTML=`<div class="settings-section-title">Кто может войти сам${blocked?' <span class="bdg off" style="margin-left:6px">не действует</span>':''}</div>`;
  if(blocked) sec.appendChild(el('div','ac-policy-locknote','Правила ниже включатся, когда свободная регистрация разрешена. Сейчас вход — только по приглашению или создании администратором.'));
  opts.forEach(o=>{
    const sel=ACCESS.policy===o.id;
    const row=el('div','ac-policy-opt'+(sel?' sel':''));
    row.innerHTML=`<span class="ac-radio"></span><div style="flex:1"><b>${o.t}</b><p>${o.d}</p>
      ${o.id==='domains'&&sel?`<div class="ac-domains">${ACCESS.domains.map(d=>`<span class="tag">${escapeHtml(d)}</span>`).join('')}<button class="act" id="acAddDomain">+ домен</button></div>`:''}</div>`;
    if(!blocked){
      row.querySelector('.ac-radio').onclick=()=>{ ACCESS.policy=o.id; renderSettingsModalBody(); };
      row.addEventListener('click',e=>{ if(e.target.closest('.act')) return; if(!e.target.closest('input')){ ACCESS.policy=o.id; renderSettingsModalBody(); } });
    }
    sec.appendChild(row);
  });
  pane.appendChild(sec);
  pane.appendChild(settingsSection('Роль новым пользователям', [
    settingRow('Роль по умолчанию','Назначается каждому, кто входит впервые в рамках выбранной политики.',
      `<div class="seg">${['operator','viewer'].map(r=>`<button data-defrole="${r}" aria-pressed="${ACCESS.defaultRole===r}">${ROLE_META[r].label}</button>`).join('')}</div>`),
  ]));
  pane.querySelector('#acAddDomain')?.addEventListener('click',()=>toast('Добавление домена в allowlist'));
  pane.querySelectorAll('[data-defrole]').forEach(b=>b.onclick=()=>{ ACCESS.defaultRole=b.dataset.defrole; pane.querySelectorAll('[data-defrole]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  pane.appendChild(el('div','operator-note','<span class="mark">!</span><div>Owner назначается при установке и не может быть понижен через эту панель.</div>'));
}

        : `<button class="act" data-act="role">Роль</button><button class="act" data-act="sess">Сессии</button><button class="act danger" data-act="susp">Отключить</button>`;

      <td>${roleBadge(u.role)}</td><td><span class="ac-provchips">${provs}</span></td><td>${status}</td>

      else if(a==='enable'){ u.status='active'; renderSettingsModalBody(); toast('Доступ восстановлен'); }

  openModal(`<h2>Создать пользователя</h2><div class="mb">
    <div class="ac-create-grid">
      <label class="ac-lab span2">Имя<input class="txt" id="cuName" placeholder="Имя Фамилия"></label>

      <label class="ac-lab">Роль<div class="seg" id="cuRole" style="margin-top:4px">${['admin','operator','viewer'].map((r,i)=>`<button data-r="${r}" aria-pressed="${i===1}">${ROLE_META[r].label}</button>`).join('')}</div></label>
      <label class="ac-lab">Способ входа<div class="seg" id="cuMethod" style="margin-top:4px"><button data-m="invite" aria-pressed="true">Письмо для входа</button><button data-m="password" aria-pressed="false">Задать пароль</button></div></label>
      <label class="ac-lab span2" id="cuPwWrap" style="display:none">Временный пароль<input class="txt" id="cuPw" type="text" placeholder="пользователь сменит при первом входе"></label>
    </div>
    <div class="operator-note" style="margin-top:14px"><span class="mark">i</span><div>Создание вручную обходит политику свободной регистрации: аккаунт появляется сразу активным. При «письме для входа» пользователь задаёт пароль/провайдера сам по ссылке.</div></div>
    </div><div class="mf"><button class="tbtn" onclick="closeModal()">Отмена</button><button class="tbtn primary" id="cuCreate">Создать</button></div>`);
  let role='operator', method='invite';
  $('#cuRole').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ role=b.dataset.r; $('#cuRole').querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  $('#cuMethod').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ method=b.dataset.m; $('#cuMethod').querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed', x===b)); $('#cuPwWrap').style.display = method==='password'?'flex':'none'; });
  $('#cuCreate').onclick=()=>{
    const name=$('#cuName').value.trim(), email=$('#cuEmail').value.trim();
    if(!name){ toast('Укажите имя'); return; }
    if(!email||!email.includes('@')){ toast('Укажите корректный email'); return; }
    const initials=name.split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'·';
    const av=['#0ea5e9','#a855f7','#10b981','#f59e0b','#64748b'][ACCESS.users.length%5];
    ACCESS.users.unshift({ id:'u_'+Math.abs(email.split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)).toString(36), name, email, initials, av, role, providers:[], status:'active', last:'только что' });
    closeModal(); settingsSub='acUsers'; renderSettingsModalBody();
    toast(method==='password'?`Пользователь ${name} создан с паролем`:`Пользователь ${name} создан · письмо для входа отправлено`);
  };
}
function openRoleMenu(anchor,u){
  const rows=['admin','operator','viewer'].map(r=>`<button class="idm-item" data-r="${r}">${ROLE_META[r].label}${u.role===r?' ·  текущая':''}</button>`).join('');
  openPopoverAt(anchor, `<div class="idmenu"><div class="idm-list"><div class="sr-label" style="padding:6px 9px">Сменить роль</div>${rows}</div></div>`);
  $('#popover').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ u.role=b.dataset.r; closePopover(); renderSettingsModalBody(); toast(`${u.name}: роль → ${ROLE_META[u.role].label}`); });
}

function settingRow(title, desc, control){
  return `<div class="settings-row"><div class="setting-copy"><b>${title}</b><p>${desc}</p></div><div class="setting-control">${control}</div></div>`;
}
function settingsSection(title, rows){
  const node=el('section','settings-section');
  node.innerHTML=`<div class="settings-section-title">${title}</div>${rows.join('')}`;
  return node;
}
function credentialUsage(name){
  const modelIds=AI_MODELS.filter(m=>m.credential===name).map(m=>m.id);
  const roleIds=AI_BINDINGS.filter(b=>modelIds.includes(b.model)).map(b=>b.role);
  return uniqueValues([...modelIds, ...roleIds]);
}
function modelOptions(){ return AI_MODELS.map(m=>m.id); }
function credentialOptions(){ return AI_CREDENTIALS.map(c=>c.name); }
function healthBadge(v){
  const cls=v==='ok'?'live':(v==='degraded'?'dormant':'stale');
  return `<span class="bdg status"><span class="cdot" data-c="${cls}"></span> ${escapeHtml(optionLabel(v))}</span>`;
}

  else badges.appendChild(el('span','rbadge noeffect','не влияет'));

function swControl(s, disabled){
  const c=s.ctrl||(s.secret?'secret':'toggle'); const v=dirty.has(s.id)?dirty.get(s.id):(pending.has(s.id)?pending.get(s.id):s.value);
  if(c==='toggle'){ const b=el('button','toggle'+(s.danger?' danger':'')); b.setAttribute('role','switch'); b.setAttribute('aria-checked', v?'true':'false'); b.disabled=disabled;
    b.onclick=()=>stage(s, !v); return b; }
  if(c==='stepper'){ const w=el('div','stepper'); const dec=el('button',null,'−'),inc=el('button',null,'+'),inp=el('input'); inp.value=v; inp.disabled=disabled;
    dec.onclick=()=>stage(s, Math.max(s.min??0, Number(v)-(s.step||1))); inc.onclick=()=>stage(s, Math.min(s.max??1e9, Number(v)+(s.step||1))); inp.onchange=()=>stage(s, Number(inp.value)||0); w.append(dec,inp,inc); return w; }
  if(c==='url'||c==='text'||c==='path'){ const i=el('input','txt'); i.value=v??''; i.disabled=disabled; i.placeholder=c==='url'?'https://…':''; i.onchange=()=>stage(s,i.value); return i; }
  if(c==='locked'){ const sel=el('select','sel2'); sel.disabled=true; ['1536','0'].forEach(o=>{const op=el('option',null,o); if(o===String(v))op.selected=true; sel.appendChild(op);}); const wr=el('div'); wr.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:4px'; wr.appendChild(sel); wr.appendChild(el('div','swnote','заблокировано схемой')); return wr; }
  if(c==='secret'){ const wr=el('div','secret'); const rw=el('div','srow'); rw.appendChild(el('span', s.valueSet?'vset':'vempty', s.valueSet?'ключ задан':'не задан')); const eb=el('button','editb', s.valueSet?'заменить':'задать'); eb.disabled=disabled; eb.onclick=()=>{ rw.innerHTML=''; const i=el('input','txt'); i.placeholder='ввод без чтения'; const ok=el('button','editb','✓'); ok.onclick=()=>{ s.valueSet=true; stage(s,'***set***'); }; rw.append(i,ok); i.focus(); }; rw.appendChild(eb); wr.appendChild(rw); return wr; }
  return el('span','swnote', String(v));
}

   BULK BAR
   ============================================================ */
function bulkBar(kind){
  const bar=el('div','bulkbar'); bar.id='bulkbar';
  return bar;
}
function updateBulk(){
  const bar=$('#bulkbar'); if(!bar) return;
  let count=selected.size;
  let isReview = current==='queue' || (current==='memories' && listState.memories?.reviewMode);
  let verbs = isReview ? ['Сохранить выбранные','Отклонить устаревшие'] : ['Скрыть как шум','Заменить версией'];
  let note='<span class="mono" style="font-size:11px;color:var(--muted)">сначала снимок · затем применение</span>';
  if(current==='issues'){
    count=selectedIssueIds().length;
    verbs=['Состояние…','Срочность…','Тип…','Куда отправить…','Метки…','Отклонить выбранные'];
    note='<span class="mono" style="font-size:11px;color:var(--muted)">групповая правка задач · комментарий обязателен для отклонения</span>';
  }
  if(count===0){ bar.classList.remove('show'); bar.innerHTML=''; return; }
  bar.innerHTML=`<span class="bc">${count} выбрано</span><span class="bsp"></span>`+
    verbs.map(v=>`<button class="act">${v}</button>`).join('')+
    `${note}<button class="tbtn" id="bulkCancel">Отмена</button>`;
  bar.classList.add('show');
  bar.querySelectorAll('.act').forEach(b=>b.onclick=()=>{
    if(current==='issues'){ issueBulkAction(b.textContent, count); return; }
    if(!flags.VNEXT_F){ toast(b.textContent+' требует включённого слоя массовых правок'); return; }
    confirmModal(b.textContent, `Применить «${b.textContent}» к ${count} записям. Снимок создаётся заранее, откат доступен.`, ()=>{ toast(b.textContent+' · снимок создан'); selected.clear(); renderArea(); });
  });
  $('#bulkCancel').onclick=()=>{ current==='issues'?clearIssueSelection():selected.clear(); renderArea(); };
}
function issueBulkAction(label, count){
  if(label==='Отклонить выбранные'){
    openModal(`<h2 style="color:var(--state-danger)">Отклонить выбранные задачи</h2><div class="mb">Отклонение ${count} задач требует комментарий оператора.
      <textarea class="txt confirm-input" id="bulkRejectComment" placeholder="Почему отклоняем выбранные задачи?" style="font-family:var(--font-body);min-height:110px;resize:vertical;line-height:1.5"></textarea></div>
      <div class="mf"><button class="tbtn" onclick="closeModal()">Отмена</button><button class="tbtn" id="bulkRejectOk" disabled style="opacity:.5">Отклонить выбранные</button></div>`);
    const ta=$('#bulkRejectComment'), ok=$('#bulkRejectOk');
    ta.oninput=()=>{ const enabled=ta.value.trim().length>0; ok.disabled=!enabled; ok.style.opacity=enabled?1:.5; ok.style.background=enabled?'var(--state-danger)':''; ok.style.color=enabled?'var(--bg)':''; ok.style.borderColor=enabled?'var(--state-danger)':''; };
    ok.onclick=()=>{ selectedIssueIds().forEach(id=>{ const item=ISSUES.find(x=>x.id===id); if(item) item.status='rejected'; }); closeModal(); clearIssueSelection(); toast('Выбранные задачи отклонены'); renderArea(); };
    return;
  }
  const bulkField = {
    'Состояние…': ['status','состояние',ISSUE_STATUS_OPTIONS],
    'Срочность…': ['priority','срочность',ISSUE_PRIORITY_OPTIONS],
    'Тип…': ['type','тип работы',ISSUE_TYPE_OPTIONS],
    'Куда отправить…': ['to','куда отправить',projectOptions()],
  }[label];
  if(bulkField){
    const [field, title, options]=bulkField;
    openModal(`<h2>Групповое изменение: ${title}</h2><div class="mb">Изменить поле для ${count} выбранных задач.
      <label class="field" style="margin-top:10px">${title}<select class="txt" id="bulkIssueValue">${optionList(options, options[0])}</select></label></div>
      <div class="mf"><button class="tbtn" onclick="closeModal()">Отмена</button><button class="tbtn primary" id="bulkIssueApply">Применить</button></div>`);
    $('#bulkIssueApply').onclick=()=>{
      const value=$('#bulkIssueValue').value;
      selectedIssueIds().forEach(id=>{ const item=ISSUES.find(x=>x.id===id); if(item) item[field]=value; });
      closeModal(); clearIssueSelection(); toast(`${title}: ${value} · ${count} задач`); renderArea();
    };
    return;
  }
  if(label==='Метки…'){
    openModal(`<h2>Групповое изменение меток</h2><div class="mb">Добавить, снять или заменить метку у ${count} выбранных задач.
      <label class="field" style="margin-top:10px">Операция<select class="txt" id="bulkLabelMode"><option value="add">Добавить</option><option value="remove">Снять</option><option value="replace">Заменить единственной</option></select></label>
      <label class="field" style="margin-top:10px">Метка<select class="txt" id="bulkLabelValue">${optionList(issueLabelOptions(), issueLabelOptions()[0])}</select></label></div>
      <div class="mf"><button class="tbtn" onclick="closeModal()">Отмена</button><button class="tbtn primary" id="bulkLabelApply">Применить</button></div>`);
    $('#bulkLabelApply').onclick=()=>{
      const mode=$('#bulkLabelMode').value, value=$('#bulkLabelValue').value;
      selectedIssueIds().forEach(id=>{
        const item=ISSUES.find(x=>x.id===id); if(!item) return;
        const labels=new Set(item.labels||[]);
        if(mode==='add') labels.add(value);
        if(mode==='remove') labels.delete(value);
        if(mode==='replace'){ labels.clear(); labels.add(value); }
        item.labels=[...labels];
      });
      closeModal(); clearIssueSelection(); toast(`метки: ${value} · ${count} задач`); renderArea();
    };
    return;
  }
  confirmModal(label, `Применить «${label}» к ${count} выбранным задачам. Для журнала аудита будет создана одна групповая запись оператора.`, ()=>{ clearIssueSelection(); toast(label+' применено'); renderArea(); });
}

/* Reusable inline secret reveal — write-only discipline: one-shot, auto-hides on a timer.

const SVG_CHECK='<svg '+_LU+'><path d="M20 6 9 17l-5-5"/></svg>';
function revealSecret(trigger, opts){
  opts=opts||{};
  const row=trigger.closest('.erow, .ds-row, .reveal-host, tr')||trigger.parentElement;
  // Anchor the reveal line directly under the secret's name —
  // table row → the name cell (.vcell, under the key name); .erow → .ebody; .ds-row → .usage; else the row.
  const anchor = (opts.anchor) || (row.querySelector('.vcell')) || row.querySelector('.ebody') || row.querySelector('.usage') || row;
  const existing=anchor.querySelector(':scope > .reveal-inline');
  if(existing){ existing.dispatchEvent(new Event('rv-hide')); return; }   // toggle off
  const secs=opts.seconds||30;
  const val=opts.value||'sk-live-'+Math.abs((opts.id||'key').split('').reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)).toString(36)+'••one-shot';
  const box=el('div','reveal-inline');
  box.innerHTML=`<code class="rv-key" title="Одноразовый показ — значение не сохраняется">${escapeHtml(val)}</code>
    <span class="rv-timer" aria-live="polite">Скроется через ${secs} с</span>

  const tick=setInterval(()=>{ left--; if(tm) tm.textContent='Скроется через '+left+' с'; if(left<=0) hide(); }, 1000);
