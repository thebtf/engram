# Pull-only production runtime. Build definitions live in the root compose file;
# this file names exactly the three published artifacts promoted by CI.
services:
  postgres:
    image: ${ENGRAM_POSTGRES_IMAGE:?set ENGRAM_POSTGRES_IMAGE from the immutable release manifest}
    user: "70:70"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0700,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0775,size=16m
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    image: ${ENGRAM_SERVER_IMAGE:?set ENGRAM_SERVER_IMAGE from the immutable release manifest}
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "${WORKER_BIND:-0.0.0.0}:${WORKER_PORT:-37777}:37777"
    environment:
      HOME: /var/lib/engram
      DATABASE_DSN: "${DATABASE_DSN:-postgres://engram:${POSTGRES_PASSWORD}@postgres:5432/engram?sslmode=disable}"
      ENGRAM_WORKER_HOST: "0.0.0.0"
      ENGRAM_WORKER_PORT: "37777"
      ENGRAM_AUTH_ADMIN_TOKEN: "${ENGRAM_AUTH_ADMIN_TOKEN:-}"
      ENGRAM_AUTH_DISABLED: "${ENGRAM_AUTH_DISABLED:-false}"
      ENGRAM_VAULT_KEY: "${ENGRAM_VAULT_KEY:-}"
      ENGRAM_EMBEDDING_URL: "${ENGRAM_EMBEDDING_URL:-}"
      ENGRAM_EMBEDDING_MODEL: "${ENGRAM_EMBEDDING_MODEL:-text-embedding}"
      ENGRAM_EMBEDDING_API_KEY: "${ENGRAM_EMBEDDING_API_KEY:-}"
      ENGRAM_VNEXT_ENABLED: "${ENGRAM_VNEXT_ENABLED:-false}"
      ENGRAM_LIFECYCLE_ENABLED: "${ENGRAM_LIFECYCLE_ENABLED:-false}"
      ENGRAM_VNEXT_F_ENABLED: "${ENGRAM_VNEXT_F_ENABLED:-false}"
      ENGRAM_GRAPH_ENABLED: "${ENGRAM_GRAPH_ENABLED:-false}"
      ENGRAM_TEMPORAL_TRUTH_ENABLED: "${ENGRAM_TEMPORAL_TRUTH_ENABLED:-false}"
      ENGRAM_CRYSTALLIZATION_ENABLED: "${ENGRAM_CRYSTALLIZATION_ENABLED:-false}"
    volumes:
      - engramdata:/var/lib/engram
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  operator-console:
    image: ${ENGRAM_OPERATOR_IMAGE:?set ENGRAM_OPERATOR_IMAGE from the immutable release manifest}
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "${OPERATOR_CONSOLE_BIND:-0.0.0.0}:${OPERATOR_CONSOLE_PORT:-3000}:3000"
    environment:
      NUXT_OPERATOR_API_TARGET: "http://server:37777"
      NUXT_PUBLIC_API_BASE: "/api"
      NUXT_PUBLIC_API_DISPLAY_HOST: "${OPERATOR_CONSOLE_API_DISPLAY_HOST:-}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  engramdata:
