services:
  operator-web:
    image: ${ENGRAM_OPERATOR_IMAGE:?set ENGRAM_OPERATOR_IMAGE to an immutable digest reference}
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "${OPERATOR_WEB_PORT:-3000}:3000"
    environment:
      NUXT_PUBLIC_API_BASE: "/api"
      # Standalone rollout path for a host that already runs engram-server on :37777.
      # Override this if operator-web should talk to a different hostname, container,
      # or reverse-proxy upstream.
      NUXT_OPERATOR_API_TARGET: "${OPERATOR_WEB_API_TARGET:-http://host.docker.internal:37777}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/engram-healthcheck", "http://127.0.0.1:3000/api/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
