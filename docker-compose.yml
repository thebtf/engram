# Engram — Server Stack
#
# Provides: PostgreSQL + pgvector, Engram Server (API + MCP SSE on single port)
# Client (hooks + MCP proxy) runs locally on each workstation.
#
# Usage:
#   cp .env.example .env   # edit with your settings
#   docker compose up -d
#
# See docs/DEPLOYMENT.md for full setup instructions.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Worker with integrated MCP SSE (single port, single process)
  server:
    image: ghcr.io/thebtf/engram:main
    # To build locally instead: docker compose build server
    build:
      context: .
      target: server
    ports:
      - "${WORKER_PORT:-37777}:37777"
    environment:
      # Names below match exactly what the Go server reads. Do not reintroduce
      # legacy names (ENGRAM_API_TOKEN, ENGRAM_EMBEDDING_BASE_URL/MODEL_NAME,
      # ENGRAM_LLM_*, ENGRAM_FALKORDB_*) — the code ignores them.
      # Defaults to the bundled postgres service; set DATABASE_DSN in .env to
      # point at an external database instead.
      DATABASE_DSN: "${DATABASE_DSN:-postgres://engram:${POSTGRES_PASSWORD:-engram}@postgres:5432/engram?sslmode=disable}"
      ENGRAM_WORKER_HOST: "0.0.0.0"
      ENGRAM_WORKER_PORT: "37777"
      ENGRAM_AUTH_ADMIN_TOKEN: "${ENGRAM_AUTH_ADMIN_TOKEN:-}"
      ENGRAM_AUTH_DISABLED: "${ENGRAM_AUTH_DISABLED:-false}"
      ENGRAM_VAULT_KEY: "${ENGRAM_VAULT_KEY:-}"
      # Embedding (semantic memory). Empty URL = embedding disabled (FTS-only recall).
      ENGRAM_EMBEDDING_URL: "${ENGRAM_EMBEDDING_URL:-}"
      ENGRAM_EMBEDDING_MODEL: "${ENGRAM_EMBEDDING_MODEL:-text-embedding}"
      ENGRAM_EMBEDDING_API_KEY: "${ENGRAM_EMBEDDING_API_KEY:-}"
      # vNext feature flags (all default OFF; flag-OFF == v6.4.15 byte-identical).
      ENGRAM_VNEXT_ENABLED: "${ENGRAM_VNEXT_ENABLED:-false}"
      ENGRAM_LIFECYCLE_ENABLED: "${ENGRAM_LIFECYCLE_ENABLED:-false}"
      ENGRAM_VNEXT_F_ENABLED: "${ENGRAM_VNEXT_F_ENABLED:-false}"
      ENGRAM_CRYSTALLIZATION_ENABLED: "${ENGRAM_CRYSTALLIZATION_ENABLED:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  operator-console:
    image: ghcr.io/thebtf/engram-operator-console:main
    # To build locally instead: docker compose build operator-console
    build:
      context: .
      target: operator-console
    ports:
      - "${OPERATOR_CONSOLE_PORT:-3000}:3000"
    environment:
      NUXT_OPERATOR_API_TARGET: "http://server:37777"
      NUXT_PUBLIC_API_BASE: "/api"
      NUXT_PUBLIC_API_DISPLAY_HOST: "${OPERATOR_CONSOLE_API_DISPLAY_HOST:-}"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
