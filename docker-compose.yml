# Engram production-shaped local stack.
# PostgreSQL is intentionally internal-only; expose it explicitly only for a
# bounded maintenance session. Server and operator state survive recreation in
# named volumes owned by the non-root image users.
services:
  postgres:
    image: ${ENGRAM_POSTGRES_IMAGE:?set ENGRAM_POSTGRES_IMAGE from the immutable release manifest}
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    user: "70:70"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0700,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0775,size=16m
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram", "-d", "engram"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  server:
    image: ${ENGRAM_SERVER_IMAGE:?set ENGRAM_SERVER_IMAGE from the immutable release manifest}
    build:
      context: .
      target: server
      args:
        VERSION: ${ENGRAM_BUILD_VERSION:?set ENGRAM_BUILD_VERSION to vMAJOR.MINOR.PATCH[-prerelease] or sha-<full commit>}
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "${WORKER_BIND:-0.0.0.0}:${WORKER_PORT:-37777}:37777"
    environment:
      HOME: /var/lib/engram
      DATABASE_DSN_FILE: /run/secrets/database_dsn
      ENGRAM_WORKER_HOST: "0.0.0.0"
      ENGRAM_WORKER_PORT: "37777"
      ENGRAM_AUTH_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      ENGRAM_AUTH_DISABLED: "false"
      ENGRAM_ENCRYPTION_KEY_FILE: /run/secrets/vault_key
      ENGRAM_EMBEDDING_URL: "${ENGRAM_EMBEDDING_URL:-}"
      ENGRAM_EMBEDDING_MODEL: "${ENGRAM_EMBEDDING_MODEL:-text-embedding}"
      ENGRAM_EMBEDDING_API_KEY: "${ENGRAM_EMBEDDING_API_KEY:-}"
      ENGRAM_VNEXT_ENABLED: "${ENGRAM_VNEXT_ENABLED:-false}"
      ENGRAM_LIFECYCLE_ENABLED: "${ENGRAM_LIFECYCLE_ENABLED:-false}"
      ENGRAM_VNEXT_F_ENABLED: "${ENGRAM_VNEXT_F_ENABLED:-false}"
      ENGRAM_GRAPH_ENABLED: "${ENGRAM_GRAPH_ENABLED:-false}"
      ENGRAM_TEMPORAL_TRUTH_ENABLED: "${ENGRAM_TEMPORAL_TRUTH_ENABLED:-false}"
      ENGRAM_CRYSTALLIZATION_ENABLED: "${ENGRAM_CRYSTALLIZATION_ENABLED:-false}"
    volumes:
      - engramdata:/var/lib/engram
    secrets:
      - admin_token
      - database_dsn
      - vault_key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/engram-healthcheck", "http://127.0.0.1:37777/api/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  operator-console:
    image: ${ENGRAM_OPERATOR_IMAGE:?set ENGRAM_OPERATOR_IMAGE from the immutable release manifest}
    build:
      context: .
      target: operator-console
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=64m
    ports:
      - "${OPERATOR_CONSOLE_BIND:-0.0.0.0}:${OPERATOR_CONSOLE_PORT:-3000}:3000"
    environment:
      NUXT_OPERATOR_API_TARGET: "http://server:37777"
      NUXT_PUBLIC_API_BASE: "/api"
      NUXT_PUBLIC_API_DISPLAY_HOST: "${OPERATOR_CONSOLE_API_DISPLAY_HOST:-}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/engram-healthcheck", "http://127.0.0.1:3000/api/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  admin_token:
    file: ${ENGRAM_AUTH_ADMIN_TOKEN_SECRET_FILE:?set ENGRAM_AUTH_ADMIN_TOKEN_SECRET_FILE}
  database_dsn:
    file: ${ENGRAM_DATABASE_DSN_SECRET_FILE:?set ENGRAM_DATABASE_DSN_SECRET_FILE}
  postgres_password:
    file: ${ENGRAM_POSTGRES_PASSWORD_SECRET_FILE:?set ENGRAM_POSTGRES_PASSWORD_SECRET_FILE}
  vault_key:
    file: ${ENGRAM_VAULT_KEY_SECRET_FILE:?set ENGRAM_VAULT_KEY_SECRET_FILE}

volumes:
  pgdata:
  engramdata:
