# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: engram

before:
  hooks:
    - go mod tidy
    # Build the Vue dashboard and embed it into the server binary.
    - bash -c "sed 's/{{ .Version }}/{{ .Version }}/g' ui/package.json.tpl > ui/package.json"
    - bash -c "cd ui && npm install && npm run build"
    - bash -c "rm -rf internal/worker/static && mkdir -p internal/worker/static && cp -r ui/dist/* internal/worker/static/"
    - bash scripts/generate-plugin-config.sh

builds:
  - id: engram-server
    main: ./cmd/engram-server
    binary: engram-server
    env:
      - CGO_ENABLED=1
    tags:
      - fts5
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

  # These are the only launcher objects policy can authorize.
  - id: engram-client
    main: ./cmd/engram
    binary: engram-{{ .Os }}-{{ .Arch }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/thebtf/engram/internal/version.Daemon=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64

archives:
  # Archive names and layout are the direct-installer contract.
  - id: server-plugin
    ids:
      - engram-server
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: .claude-plugin/*
        dst: .claude-plugin
        strip_parent: true
      - src: .codex-plugin/*
        dst: .codex-plugin
        strip_parent: true
      - src: .omp-plugin/*
        dst: .omp-plugin
        strip_parent: true
      - src: plugin/engram/bootstrap-targets.json
        dst: .
        strip_parent: true
      - src: plugin/engram/package.json
        dst: .
        strip_parent: true
      - src: plugin/engram/extensions/engram-memory.mjs
        dst: extensions
        strip_parent: true
      - src: plugin/engram/hooks/*.js
        dst: hooks
        strip_parent: true
      - src: plugin/engram/hooks/*.cjs
        dst: hooks
        strip_parent: true
      - src: plugin/engram/hooks/hooks.json
        dst: hooks
        strip_parent: true
      - src: plugin/engram/scripts/*.js
        dst: scripts
        strip_parent: true
      - src: plugin/engram/commands/*
        dst: commands
        strip_parent: true
      - src: plugin/engram/skills/*/*.md
        dst: skills
      - src: plugin/engram/.mcp.json
        dst: .
        strip_parent: true
      - src: plugin/engram/claude/.mcp.json
        dst: claude
        strip_parent: true
    format_overrides:
      - goos: windows
        formats:
          - zip

  # Raw client assets are published by this GoReleaser writer, never another workflow.
  - id: client-raw
    ids:
      - engram-client
    formats:
      - binary
    name_template: "{{ .Binary }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: thebtf
    name: engram
  # Keep every artifact private until the workflow verifies the exact raw clients.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## Engram v{{.Version}}

    Shared memory infrastructure for Claude Code workstations.

    ### Install via Plugin Marketplace (recommended)

    ```
    /plugin marketplace add thebtf/engram-marketplace
    /plugin install engram
    ```

    Then run `/engram:setup` to configure your server connection.

    ### Install via Script

    **macOS / Linux:**
    ```bash
    curl -sSL https://raw.githubusercontent.com/thebtf/engram/main/scripts/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/thebtf/engram/main/scripts/install.ps1 | iex
    ```

    ### Server Deployment

    See [DEPLOYMENT.md](https://github.com/thebtf/engram/blob/main/docs/DEPLOYMENT.md) for Docker setup.

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
