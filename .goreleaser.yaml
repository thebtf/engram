# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: engram

before:
  hooks:
    - go mod tidy
    # Build the Vue dashboard and embed it into the server binary.
    # The tpl step injects the version so the UI reports the correct release.
    - bash -c "sed 's/{{ .Version }}/{{ .Version }}/g' ui/package.json.tpl > ui/package.json"
    - bash -c "cd ui && npm install && npm run build"
    - bash -c "rm -rf internal/worker/static && mkdir -p internal/worker/static && cp -r ui/dist/* internal/worker/static/"
    # Copy Claude + Codex plugin manifests into the archive staging directories.
    - bash scripts/generate-plugin-config.sh

builds:
  # engram-server — CGO is required for the FTS5 search extension via go-sqlite3.
  - id: engram-server
    main: ./cmd/engram-server
    binary: engram-server
    env:
      - CGO_ENABLED=1
    tags:
      - fts5
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # darwin/amd64 is not published (arm64 Apple Silicon is the primary target).
      - goos: darwin
        goarch: amd64
      # linux/arm64 is not published — CGO cross-compilation for this target
      # requires a separate toolchain not available in the release container.
      - goos: linux
        goarch: arm64
      # windows/arm64 is not published.
      - goos: windows
        goarch: arm64

archives:
  # CONTRACT: archive names and file layout are parsed by install.sh and
  # plugin/hooks/scripts/ensure-binary.js. Do not rename ids, change the
  # name_template, or move files without updating those callers.
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - src: .claude-plugin/*
        dst: .claude-plugin
        strip_parent: true
      - src: .codex-plugin/*
        dst: .codex-plugin
        strip_parent: true
      - src: plugin/engram/hooks/*.js
        dst: hooks
        strip_parent: true
      - src: plugin/engram/hooks/*.cjs
        dst: hooks
        strip_parent: true
      - src: plugin/engram/hooks/hooks.json
        dst: hooks
        strip_parent: true
      - src: plugin/engram/scripts/*.js
        dst: scripts
        strip_parent: true
      - src: plugin/engram/commands/*
        dst: commands
        strip_parent: true
      - src: plugin/engram/skills/*/*.md
        dst: skills
      - src: plugin/engram/.mcp.json
        dst: .
        strip_parent: true
      - src: plugin/engram/claude/.mcp.json
        dst: claude
        strip_parent: true
    format_overrides:
      # Windows users unzip with Explorer or PowerShell; tar.gz is awkward there.
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: thebtf
    name: engram
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## Engram v{{.Version}}

    Shared memory infrastructure for Claude Code workstations.

    ### Install via Plugin Marketplace (recommended)

    ```
    /plugin marketplace add thebtf/engram-marketplace
    /plugin install engram
    ```

    Then run `/engram:setup` to configure your server connection.

    ### Install via Script

    **macOS / Linux:**
    ```bash
    curl -sSL https://raw.githubusercontent.com/thebtf/engram/main/scripts/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/thebtf/engram/main/scripts/install.ps1 | iex
    ```

    ### Server Deployment

    See [DEPLOYMENT.md](https://github.com/thebtf/engram/blob/main/docs/DEPLOYMENT.md) for Docker setup.

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
